<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fd1c4"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2c879"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="14" fill="#0b3959"/>

  <text x="30" y="50" fill="#ffffff" font-size="24" font-weight="700">Constellation</text>
  <text x="30" y="76" fill="#b4cad8" font-size="16">From a subject to a checked, navigable map of what matters, and sharper at every run.</text>

  <!-- 1. Human: subject + profile -->
  <rect x="30" y="110" width="200" height="140" rx="12" fill="#12445d" stroke="#f2c879" stroke-width="2"/>
  <text x="130" y="148" text-anchor="middle" fill="#f2c879" font-size="15" font-weight="700" letter-spacing="1">READER</text>
  <text x="130" y="180" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Sets the subject</text>
  <text x="130" y="206" text-anchor="middle" fill="#b4cad8" font-size="15">and who reads it:</text>
  <text x="130" y="228" text-anchor="middle" fill="#b4cad8" font-size="15">axes · sources · lens</text>

  <line x1="232" y1="180" x2="296" y2="180" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>
  <polygon points="264,170 274,180 264,190 254,180" fill="#f2c879"/>

  <!-- 2. Hunters -->
  <rect x="300" y="110" width="220" height="140" rx="12" fill="#12445d" stroke="#4fd1c4" stroke-width="2"/>
  <g fill="none" stroke="#4fd1c4" stroke-width="2.5">
    <circle cx="378" cy="138" r="8"/><path d="M384 144 l7 7"/>
    <circle cx="408" cy="138" r="8"/><path d="M414 144 l7 7"/>
    <circle cx="438" cy="138" r="8"/><path d="M444 144 l7 7"/>
  </g>
  <text x="410" y="186" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Hunter agents</text>
  <text x="410" y="212" text-anchor="middle" fill="#b4cad8" font-size="15">one per axis, in parallel,</text>
  <text x="410" y="234" text-anchor="middle" fill="#b4cad8" font-size="15">each with its sources</text>

  <line x1="522" y1="180" x2="586" y2="180" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>
  <polygon points="554,170 564,180 554,190 544,180" fill="#f2c879"/>

  <!-- 3. Independent checks -->
  <rect x="590" y="110" width="220" height="140" rx="12" fill="#12445d" stroke="#4fd1c4" stroke-width="2"/>
  <g transform="translate(686,124)" fill="none" stroke="#4fd1c4" stroke-width="3">
    <circle cx="14" cy="14" r="14"/><path d="M7 14 l5 5 l9 -10"/>
  </g>
  <text x="700" y="186" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Independent checks</text>
  <text x="700" y="212" text-anchor="middle" fill="#b4cad8" font-size="15">other agents re-read every</text>
  <text x="700" y="234" text-anchor="middle" fill="#b4cad8" font-size="15">claim against its source</text>

  <line x1="812" y1="180" x2="876" y2="180" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>
  <polygon points="844,170 854,180 844,190 834,180" fill="#f2c879"/>

  <!-- 4. Map (deliverable) -->
  <rect x="880" y="110" width="290" height="140" rx="12" fill="#1e5a52" stroke="#4fd1c4" stroke-width="2"/>
  <g stroke="#7fe0b5" stroke-width="1.5" fill="#7fe0b5">
    <line x1="990" y1="134" x2="1012" y2="148"/><line x1="1012" y1="148" x2="1040" y2="130"/><line x1="1012" y1="148" x2="1030" y2="160"/><line x1="1040" y1="130" x2="1062" y2="146"/>
    <circle cx="990" cy="134" r="3.5"/><circle cx="1012" cy="148" r="4.5"/><circle cx="1040" cy="130" r="3.5"/><circle cx="1030" cy="160" r="3"/><circle cx="1062" cy="146" r="3.5"/>
  </g>
  <text x="1025" y="194" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Bilingual 3D map</text>
  <text x="1025" y="218" text-anchor="middle" fill="#7fe0b5" font-size="15">findings linked to each other,</text>
  <text x="1025" y="238" text-anchor="middle" fill="#7fe0b5" font-size="15">published on a web portal</text>

  <!-- feedback row -->
  <line x1="1025" y1="252" x2="1025" y2="296" stroke="#f2c879" stroke-width="3" marker-end="url(#g)"/>
  <rect x="880" y="300" width="290" height="76" rx="12" fill="#12445d" stroke="#f2c879" stroke-width="2"/>
  <text x="1025" y="330" text-anchor="middle" fill="#f2c879" font-size="15" font-weight="700" letter-spacing="1">READER</text>
  <text x="1025" y="356" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Rates what landed</text>

  <line x1="878" y1="338" x2="814" y2="338" stroke="#f2c879" stroke-width="3" marker-end="url(#g)"/>

  <rect x="470" y="300" width="340" height="76" rx="12" fill="#12445d" stroke="#4fd1c4" stroke-width="2"/>
  <text x="640" y="330" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Preference rules, back-tested</text>
  <text x="640" y="355" text-anchor="middle" fill="#b4cad8" font-size="15">kept only if they reproduce past ratings</text>

  <path d="M468 338 H410 V256" fill="none" stroke="#4fd1c4" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="400" y="330" text-anchor="end" fill="#4fd1c4" font-size="14">the next run</text>
  <text x="400" y="349" text-anchor="end" fill="#4fd1c4" font-size="14">is sharper</text>

  <!-- legend -->
  <polygon points="40,402 49,411 40,420 31,411" fill="#f2c879"/>
  <text x="58" y="416" fill="#b4cad8" font-size="14">Blocking validator: a stage advances only when a program checks its output on disk, never on an agent's word.</text>
</svg>
