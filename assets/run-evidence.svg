<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="470" rx="14" fill="#0b3959"/>
  <text x="30" y="50" fill="#ffffff" font-size="24" font-weight="700">One real run, end to end</text>
  <text x="30" y="76" fill="#b4cad8" font-size="16">General AI watch, August 2026: what the agents produced, and the rules the reader's ratings taught them.</text>

  <!-- stat tiles -->
  <rect x="30" y="100" width="270" height="110" rx="12" fill="#12445d"/>
  <text x="50" y="150" fill="#4fd1c4" font-size="38" font-weight="700">11</text>
  <text x="50" y="182" fill="#ffffff" font-size="16" font-weight="600">hunter agents</text>
  <text x="50" y="200" fill="#b4cad8" font-size="13">one per axis, plus a scout</text>

  <rect x="320" y="100" width="270" height="110" rx="12" fill="#12445d"/>
  <text x="340" y="150" fill="#4fd1c4" font-size="38" font-weight="700">78</text>
  <text x="340" y="182" fill="#ffffff" font-size="16" font-weight="600">leads brought back</text>
  <text x="340" y="200" fill="#b4cad8" font-size="13">each with its source and date</text>

  <rect x="610" y="100" width="270" height="110" rx="12" fill="#12445d"/>
  <text x="630" y="150" fill="#4fd1c4" font-size="38" font-weight="700">68</text>
  <text x="630" y="182" fill="#ffffff" font-size="16" font-weight="600">findings published</text>
  <text x="630" y="200" fill="#b4cad8" font-size="13">on 10 axes, in French and English</text>

  <rect x="900" y="100" width="270" height="110" rx="12" fill="#12445d"/>
  <text x="920" y="150" fill="#4fd1c4" font-size="38" font-weight="700">3</text>
  <text x="920" y="182" fill="#ffffff" font-size="16" font-weight="600">independent audits each</text>
  <text x="920" y="200" fill="#b4cad8" font-size="13">fidelity to source · interest · style</text>

  <!-- rules -->
  <rect x="30" y="230" width="1140" height="216" rx="12" fill="#12445d" stroke="#f2c879" stroke-width="2"/>
  <text x="50" y="264" fill="#f2c879" font-size="13" font-weight="700" letter-spacing="1">LEARNED RULES, BACK-TESTED ON THE READER'S OWN PAST RATINGS (KEPT AT 2/3 OR MORE)</text>

  <text x="50" y="304" fill="#ffffff" font-size="16" font-weight="600">Robotics</text>
  <text x="250" y="304" fill="#b4cad8" font-size="15">rises if tied to a known reference, or if the system leaves the lab</text>
  <rect x="870" y="290" width="200" height="18" rx="4" fill="#2a5d78"/><rect x="870" y="290" width="200" height="18" rx="4" fill="#4fd1c4"/>
  <text x="1150" y="304" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">11/11</text>

  <text x="50" y="346" fill="#ffffff" font-size="16" font-weight="600">Hardware &amp; compute</text>
  <text x="250" y="346" fill="#b4cad8" font-size="15">rises if it carries a number: dollars, watts, tokens per second</text>
  <rect x="870" y="332" width="200" height="18" rx="4" fill="#2a5d78"/><rect x="870" y="332" width="200" height="18" rx="4" fill="#4fd1c4"/>
  <text x="1150" y="346" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">3/3</text>

  <text x="50" y="388" fill="#ffffff" font-size="16" font-weight="600">Models</text>
  <text x="250" y="388" fill="#b4cad8" font-size="15">rises if it is a field-wide verdict, or a small model matching big ones</text>
  <rect x="870" y="374" width="200" height="18" rx="4" fill="#2a5d78"/><rect x="870" y="374" width="150" height="18" rx="4" fill="#4fd1c4"/>
  <text x="1150" y="388" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">3/4</text>

  <text x="50" y="430" fill="#ffffff" font-size="16" font-weight="600">AI &amp; cognition</text>
  <text x="250" y="430" fill="#b4cad8" font-size="15">rises if it links AI to something outside it: the brain, regulation</text>
  <rect x="870" y="416" width="200" height="18" rx="4" fill="#2a5d78"/><rect x="870" y="416" width="133" height="18" rx="4" fill="#4fd1c4"/>
  <text x="1150" y="430" text-anchor="end" fill="#ffffff" font-size="16" font-weight="700">4/6</text>
</svg>
