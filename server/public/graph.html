<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation — Graphe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080f0c; --panel:#101915; --line:rgba(233,239,233,.12); --line2:rgba(233,239,233,.2);
    --ink:#e9efe9; --ink-2:#b9c6bd; --ink-3:#8fa39a; --ink-4:#6d8078;
    --accent:#3ecfb9; --accent-deep:#0b6b5f;
    --serif:"Fraunces",Georgia,serif; --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
    --capfont:"Instrument Sans",sans-serif; --capweight:500; --capsize:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  /* NUIT — sombre neutre, profond, épuré (réf. Obsidian / Linear) */
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    background:radial-gradient(1300px 900px at 50% 42%,#141b24 0,rgba(20,27,36,0) 70%),#0b1017}
  .stars{display:none}

  /* chrome CLAIR (marque) — seule la map est sombre */
  header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:14px 24px;background:#fbfaf6;border-bottom:1px solid #e7e3d8}
  .brand{font-family:var(--serif);font-weight:600;font-size:17px;color:#181712}
  .brand em{font-style:normal;color:var(--accent-deep)}
  .htitle{font-size:15px;font-weight:600;color:#181712;margin:0}
  .hsub{font-size:12.5px;color:#8a857a}
  .hrt{margin-left:auto;font-size:12.5px;color:#8a857a}
  .fsw{display:flex;gap:5px;margin-left:14px}
  .fsw button{font-family:var(--sans);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
    border:1px solid #d5cfc0;background:#fff;color:#57534a;cursor:pointer}
  .fsw button:hover{border-color:var(--accent-deep);color:var(--accent-deep)}
  .fsw button.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}

  #stage{position:fixed;inset:0;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  svg#gr{position:absolute;inset:0;width:100%;height:100%}
  .lk-obj{stroke:#39434f;stroke-opacity:0;transition:stroke-opacity .15s}   /* cachés par défaut, révélés au survol d'un signal */
  .lk-obj.lk-show{stroke-opacity:.6}
  .lk-ed{stroke-opacity:.9}
  .lk-hit{stroke:transparent;stroke-width:12;cursor:pointer;fill:none}
  /* NŒUD = CAPSULE-TITRE : carte arrondie, BANDE de couleur d'axe à gauche, titre lisible sans survol */
  g.node{cursor:pointer}
  g.node .cap{fill:#141c26;stroke:transparent;stroke-width:0;transition:fill .12s,stroke .12s,filter .12s}
  g.node .band{transition:opacity .12s}
  g.node text{fill:#dbe3ec;font-family:var(--capfont);font-size:var(--capsize);font-weight:var(--capweight);pointer-events:none}
  g.node:hover .cap{fill:#1a2331}
  g.node.sel .cap{fill:#1a2331;stroke:var(--halo);stroke-width:1.5}
  g.node.unseen .cap{filter:drop-shadow(0 0 7px var(--halo))}   /* halo = pas encore lu */
  g.node.seen .cap{fill:#0f151d}
  g.node.seen .band{opacity:.35}
  g.node.seen text{fill:#7d8794}
  g.node.dim{opacity:.2}
  .lk-dim{opacity:.05}

  .legend{position:fixed;left:18px;bottom:16px;z-index:20;font-size:12px;color:#8b96a3;
    background:rgba(17,24,35,.92);border:1px solid rgba(219,227,236,.12);border-radius:12px;padding:9px 14px;line-height:1.8}
  .legend .sw{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:7px;border-top:2.5px solid var(--accent)}
  .legend .sw.thin{border-top:1.5px solid #4a5563}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:19;font-size:12.5px;color:#8b96a3;
    background:rgba(17,24,35,.92);border:1px solid rgba(219,227,236,.12);border-radius:999px;padding:7px 16px;white-space:nowrap}

  .tip{position:fixed;z-index:40;max-width:340px;background:#151d29;border:1px solid rgba(219,227,236,.2);border-radius:10px;
    padding:9px 12px;font-size:12.5px;line-height:1.5;color:#c2cad4;pointer-events:none;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .tip b{color:#fff}
  .tip .k{color:var(--accent);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em}

  /* panneau du nœud — thème CLAIR (marque), la map seule reste sombre */
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);z-index:30;background:#fbfaf6;color:#44403a;
    border-left:1px solid #e7e3d8;box-shadow:-18px 0 50px rgba(0,0,0,.35);transform:translateX(102%);
    transition:transform .22s cubic-bezier(.22,.8,.36,1);display:flex;flex-direction:column}
  #panel.open{transform:none}
  .p-head{padding:20px 24px 0}
  .p-axe{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid currentColor;border-radius:999px;padding:3px 10px;margin-bottom:12px}
  .p-title{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;color:#181712;margin:0 0 6px}
  .p-date{font-size:12.5px;color:#b3ada0;margin-bottom:10px}
  .p-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid #e7e3d8;
    background:#fff;color:#8a857a;font-size:15px;cursor:pointer}
  .p-close:hover{color:#181712;border-color:#d5cfc0}
  .p-body{flex:1;overflow-y:auto;padding:4px 24px 24px}
  .p-ess{font-size:14.5px;line-height:1.65;color:#44403a}
  .p-ess b{color:#181712;font-weight:600}
  .p-src{margin-top:14px;font-size:12.5px;color:#8a857a}
  .p-src a{color:var(--accent-deep);text-decoration:none}
  .p-src a:hover{text-decoration:underline}
  .p-links{margin-top:20px;border-top:1px solid #e7e3d8;padding-top:14px}
  .p-links h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b3ada0}
  .p-link{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e7e3d8;border-radius:10px;
    padding:9px 12px;margin:6px 0;color:#44403a;font-family:var(--sans);font-size:13px;line-height:1.45;cursor:pointer;transition:border-color .12s}
  .p-link:hover{border-color:var(--accent-deep)}
  .p-link .k{color:var(--accent-deep);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
  .p-link .why{color:#8a857a;font-size:12px}
  /* notation intégrée */
  .p-rate{border-top:1px solid #e7e3d8;padding:16px 24px 20px;background:#f4f2ea}
  .p-rate h4{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a857a}
  .scores{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:10px}
  .scores button{height:34px;border-radius:8px;border:1px solid #d5cfc0;background:#fff;color:#44403a;
    font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
  .scores button:hover{border-color:var(--accent-deep);color:var(--accent-deep)}
  .scores button.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
  .p-rate textarea{width:100%;min-height:64px;resize:vertical;background:#fff;border:1px solid #d5cfc0;
    border-radius:10px;color:#181712;font-family:var(--sans);font-size:13.5px;line-height:1.5;padding:10px 12px}
  .p-rate textarea::placeholder{color:#b3ada0}
  .p-rate .saved{font-size:11.5px;color:var(--accent-deep);margin-top:6px;min-height:1.2em}

  #idmodal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  #idmodal .box{background:#fbfaf6;border:1px solid #e7e3d8;border-radius:16px;padding:26px 28px;width:min(380px,90vw)}
  #idmodal h3{font-family:var(--serif);font-weight:500;margin:0 0 8px;color:#181712}
  #idmodal p{margin:0 0 14px;font-size:13.5px;color:#8a857a}
  #idmodal input{width:100%;background:#fff;border:1px solid #d5cfc0;border-radius:10px;color:#181712;
    font-size:15px;padding:10px 12px;margin-bottom:12px}
  #idmodal button{width:100%;background:var(--accent-deep);border:none;border-radius:10px;color:#fff;font-weight:600;
    font-size:14px;padding:11px;cursor:pointer}
  /* mindmap : hub + pilules d'axes */
  .hub circle{filter:drop-shadow(0 0 44px rgba(18,163,140,.35))}
  text.hub-t{font-family:var(--serif);font-size:20px;font-weight:600;fill:#fff;letter-spacing:-.005em}
  .axpill text{font-family:var(--sans);font-size:13px;font-weight:550;letter-spacing:.005em}
  g.node.seen circle.glow{opacity:0}
  g.node.seen circle.c{opacity:.5}
  g.node.seen text{fill:var(--ink-4)}
  @media(max-width:720px){ .legend{display:none} }
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<header>
  <div class="brand"><em>Constellation</em></div>
  <div><h1 class="htitle" id="hTitle">Graphe</h1><div class="hsub" id="hSub"></div></div>
  <nav class="fsw" id="fsw" aria-label="Police des signaux">
    <button data-f="sans">Sans</button>
    <button data-f="serif">Serif</button>
    <button data-f="news">Éditorial</button>
    <button data-f="grotesk">Grotesk</button>
    <button data-f="mono">Mono</button>
  </nav>
  <div class="hrt" id="hRt"></div>
</header>
<div id="stage"><svg id="gr"></svg></div>
<div class="legend"><span class="sw"></span>lien éditorial (survole : pourquoi)<br><span class="sw thin"></span>concepts partagés — au survol d'un signal<br><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#3ecfb9;box-shadow:0 0 8px #3ecfb9;vertical-align:middle;margin:0 13px 0 6px"></span>pas encore lu</div>
<div class="hint" id="hint">Glisser pour déplacer · molette pour zoomer · clic sur un signal → sa fiche</div>
<div class="tip" id="tip"></div>
<aside id="panel">
  <button class="p-close" id="pClose" aria-label="Fermer">✕</button>
  <div class="p-head">
    <span class="p-axe" id="pAxe"></span>
    <h2 class="p-title" id="pTitle"></h2>
    <div class="p-date" id="pDate"></div>
  </div>
  <div class="p-body">
    <div class="p-ess" id="pEss"></div>
    <div class="p-src" id="pSrc"></div>
    <div class="p-links" id="pLinks"></div>
  </div>
  <div class="p-rate">
    <h4>Ta note</h4>
    <div class="scores" id="pScores"></div>
    <textarea id="pComment" placeholder="Ce qui t'a servi, manqué ou dérangé — le pourquoi aide le plus."></textarea>
    <div class="saved" id="pSaved"></div>
  </div>
</aside>

<script>
"use strict";
// palette d'axes lumineuse (lisible sur fond nuit)
const PALETTE=["#3ecfb9","#9d8df0","#e8b45f","#e58a68","#64b1e0","#7ecb82","#e094c4","#e8705f","#57c4ad","#c9c25e","#7e9fe0","#d99a77","#5fc9d8","#b48ae0"];
let AXSORT=[];
// #rrggbb → rgba(r,g,b,a) — sert au fond tinté des pilules d'axes
function hexToRgba(hex,a){const h=hex.replace("#","");const n=parseInt(h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return`rgba(${r},${g},${b},${a})`;}

// ---- sélecteur de police des capsules (essai en live) ----
const FONTS={
  sans:{fam:'"Instrument Sans",sans-serif',w:500,size:'13px',cw:7.1},
  serif:{fam:'"Fraunces",Georgia,serif',w:500,size:'13.5px',cw:7.4},
  news:{fam:'"Newsreader",Georgia,serif',w:500,size:'14px',cw:7.2},
  grotesk:{fam:'"Hanken Grotesk",sans-serif',w:600,size:'13px',cw:6.9},
  mono:{fam:'"IBM Plex Mono",monospace',w:500,size:'11.5px',cw:7.7}
};
let CWF=7.1;
function applyFont(name){
  const F=FONTS[name]||FONTS.sans;
  const r=document.documentElement.style;
  r.setProperty("--capfont",F.fam);r.setProperty("--capweight",F.w);r.setProperty("--capsize",F.size);
  CWF=F.cw;try{localStorage.setItem("graph-font",name);}catch(e){}
  document.querySelectorAll("#fsw button").forEach(b=>b.classList.toggle("on",b.dataset.f===name));
  if(NODES.length)draw();
}
document.querySelectorAll("#fsw button").forEach(b=>b.onclick=()=>applyFont(b.dataset.f));
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function normAxe(a){a=String(a==null?"":a).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}️]/gu,"").replace(/^[\s\/·|]+/,"").trim();return (a.split(/\s+[—–]\s+/)[0].trim())||"Autres";}
const RUN=(location.pathname.match(/\/g\/([^\/]+)/)||[])[1]||"";
const KINDS={objets:"concepts partagés","suite de":"suite de",confirme:"confirme",contredit:"contredit",applique:"applique","même histoire":"même histoire"};

// étoiles
(function(){const h=document.getElementById("stars");for(let i=0;i<110;i++){const s=document.createElement("i");
s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*100)+"%";
s.style.setProperty("--td",(3.5+Math.random()*5).toFixed(1)+"s");s.style.setProperty("--tdel",(Math.random()*6).toFixed(1)+"s");h.appendChild(s);}})();

let NODES=[],LINKS=[],AX={},byId={},ME=localStorage.getItem("aiwatch-user")||"",MINE={};
// lu / non-lu : un signal ouvert est marqué consulté (persisté par navigateur)
const SEEN=new Set(JSON.parse(localStorage.getItem("seen::"+RUN)||"[]"));
function markSeen(id){
  if(SEEN.has(id))return;
  SEEN.add(id);try{localStorage.setItem("seen::"+RUN,JSON.stringify([...SEEN]));}catch(e){}
  const g=document.querySelector(`g.node[data-id="${CSS.escape(id)}"]`);if(g)g.classList.add("seen");
}

Promise.all([
  fetch("findings.json").then(r=>r.json()),
  fetch("links.json").then(r=>r.json()).catch(()=>({links:[],findings:[]}))
]).then(([doc,ld])=>{
  const fs=doc.findings||[];
  const objByF={};(ld.findings||[]).forEach(x=>objByF[x.id]=x.objects||[]);
  NODES=fs.map((f,i)=>({id:f.id,f:f,axe:normAxe(f.axe),objects:objByF[f.id]||[],deg:0,
    x:0,y:0}));
  byId={};NODES.forEach(n=>byId[n.id]=n);
  LINKS=(ld.links||[]).filter(l=>byId[l.a]&&byId[l.b]);
  LINKS.forEach(l=>{byId[l.a].deg+=(l.kind==="objets"?1:2);byId[l.b].deg+=(l.kind==="objets"?1:2);});
  // couleurs par AXE — la structure mindmap reste la colonne vertébrale
  const counts={};NODES.forEach(n=>counts[n.axe]=(counts[n.axe]||0)+1);
  AXSORT=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  AXSORT.forEach((a,i)=>AX[a]=PALETTE[i%PALETTE.length]);
  document.getElementById("hTitle").textContent=(doc.topic||doc.watch||"Graphe").replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
  const dm=(doc.run||"").match(/(\d{4})-(\d{2})-(\d{2})/);
  const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  document.getElementById("hSub").textContent=dm?("Édition du "+(+dm[3])+" "+MOIS[+dm[2]-1]+" "+dm[1]):"";
  document.getElementById("hRt").textContent=NODES.length+" signaux · "+LINKS.length+" liens";
  layout();applyFont(localStorage.getItem("graph-font")||"sans");pull();
});

/* ---------- layout MINDMAP radiale (hub → axes → findings) + liens en surimpression ---------- */
let HUB={x:0,y:0},AXPOS={},AXORDER=[];
function layout(){
  const counts={};NODES.forEach(n=>counts[n.axe]=(counts[n.axe]||0)+1);
  AXORDER=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  const ordered=[];AXORDER.forEach(a=>NODES.filter(n=>n.axe===a).forEach(n=>ordered.push(n)));
  const N=Math.max(1,ordered.length),step=2*Math.PI/N,start=-Math.PI/2;
  const RX=Math.max(720,N*52),RY=Math.round(RX*0.66);
  const W=2*(RX+320),H=2*(RY+280);
  HUB={x:W/2,y:H/2,W:W,H:H};
  const pos=(k,ang,off)=>[W/2+(RX*k+(off||0))*Math.cos(ang),H/2+(RY*k+(off||0))*Math.sin(ang)];
  const axAng={};AXORDER.forEach(a=>{const idxs=ordered.map((n,i)=>n.axe===a?i:-1).filter(i=>i>=0);
    axAng[a]=start+((idxs[0]+idxs[idxs.length-1])/2+0.5)*step;});
  AXPOS={};AXORDER.forEach((a,ai)=>{AXPOS[a]=pos([0.38,0.545,0.68][ai%3],axAng[a]);});
  ordered.forEach((n,i)=>{const ang=start+(i+0.5)*step;const p=pos(1,ang,i%2?74:-30);n.x=p[0];n.y=p[1];});
}

/* ---------- rendu SVG + pan/zoom ---------- */
let vb={x:0,y:0,w:1600,h:1000};
function draw(){
  const svg=document.getElementById("gr");
  // fit
  const xs=NODES.map(n=>n.x),ys=NODES.map(n=>n.y);
  const pad=210,minx=Math.min(...xs)-pad,maxx=Math.max(...xs)+pad,miny=Math.min(...ys)-pad,maxy=Math.max(...ys)+pad;
  vb={x:minx,y:miny,w:maxx-minx,h:maxy-miny};applyVB();
  let h="";
  // 1) SQUELETTE mindmap : branches hub → axe → finding (discrètes, la structure se lit)
  const curve=(x1,y1,x2,y2)=>{const mx=(x1+x2)/2;return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;};
  AXORDER.forEach(a=>{
    const col=AX[a],[ax,ay]=AXPOS[a];
    h+=`<path d="${curve(HUB.x,HUB.y,ax,ay)}" fill="none" stroke="${col}" stroke-width="2.2" stroke-opacity=".3"/>`;
    NODES.filter(n=>n.axe===a).forEach(n=>{
      h+=`<path d="${curve(ax,ay,n.x,n.y)}" fill="none" stroke="${col}" stroke-width="1.3" stroke-opacity=".22"/>`;
    });
  });
  // 2) LIENS entre findings — bombés vers l'EXTÉRIEUR (ils contournent le centre, zéro spaghetti au hub).
  //    Par défaut : seuls les liens ÉDITORIAUX sont visibles ; les liens de concepts apparaissent au survol.
  LINKS.forEach((l,i)=>{
    const a=byId[l.a],b=byId[l.b];
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const dxh=mx-HUB.x,dyh=my-HUB.y,dh=Math.max(1,Math.hypot(dxh,dyh));
    const bow=Math.min(320,Math.hypot(b.x-a.x,b.y-a.y)*0.3);
    const bx=mx+dxh/dh*bow,by=my+dyh/dh*bow;   // bombé qui FUIT le hub
    const d=`M${a.x},${a.y} Q${bx},${by} ${b.x},${b.y}`;
    if(l.kind==="objets"){
      h+=`<path class="lk lk-obj" data-i="${i}" d="${d}" fill="none" stroke-width="${(1+2*(l.w||0.4)).toFixed(1)}"/>`;
    }else{
      h+=`<path class="lk lk-ed" data-i="${i}" d="${d}" fill="none" stroke="#3ecfb9" stroke-width="2.4"/>`;
    }
    h+=`<path class="lk-hit" data-i="${i}" d="${d}"/>`;
  });
  // 3) hub (dominant) + pilules d'axes (calmes) + CAPSULES (bande couleur d'axe)
  const hubTitle=document.getElementById("hTitle").textContent;
  const hLines=hubTitle.length>13?wrap(hubTitle,13):[hubTitle];
  const hyOff=hLines.length>1?-4:8;
  const hubTxt=hLines.map((ln,li)=>`<text x="${HUB.x}" y="${HUB.y+hyOff+li*22}" text-anchor="middle" class="hub-t">${E(ln)}</text>`).join("");
  h+=`<g class="hub"><circle cx="${HUB.x}" cy="${HUB.y}" r="84" fill="url(#hubg)"/>${hubTxt}</g>`;
  AXORDER.forEach(a=>{
    const col=AX[a],[ax,ay]=AXPOS[a];const n=NODES.filter(x=>x.axe===a).length;
    const wpx=a.length*7.6+n.toString().length*7+42;
    h+=`<g class="axpill">`+
       `<rect x="${ax-wpx/2}" y="${ay-15}" width="${wpx}" height="30" rx="15" fill="${hexToRgba(col,0.14)}" stroke="${col}" stroke-width="1.5"/>`+
       `<text x="${ax}" y="${ay+4.5}" text-anchor="middle" fill="${col}">${E(a)} · ${n}</text></g>`;
  });
  NODES.forEach(n=>{
    const col=AX[n.axe]||"#8fa39a";
    const lines=wrap(n.f.title||n.id,22);
    const maxc=Math.max(1,...lines.map(s=>s.length));
    const two=lines.length>1;
    const w=Math.min(256,Math.max(108,maxc*CWF+38));
    const hg=two?46:32;
    const ty=two?-2.5:4.5;
    h+=`<g class="node ${SEEN.has(n.id)?'seen':'unseen'}" data-id="${n.id}" style="--halo:${col}" transform="translate(${n.x},${n.y})">`+
       `<rect class="cap" x="${-w/2}" y="${-hg/2}" width="${w}" height="${hg}" rx="13"/>`+
       `<rect class="band" x="${-w/2+5}" y="${-hg/2+5}" width="3.5" height="${hg-10}" rx="1.75" fill="${col}"/>`+
       lines.map((ln,li)=>`<text x="${-w/2+17}" y="${ty+li*15}">${E(ln)}</text>`).join("")+
       `</g>`;
  });
  svg.innerHTML=`<defs><radialGradient id="hubg" cx="0.32" cy="0.28" r="1"><stop offset="0" stop-color="#12a38c"/><stop offset="1" stop-color="#0b6b5f"/></radialGradient></defs>`+h;
  wire();
}
function wrap(t,n){t=String(t);if(t.length<=n)return[t];const ws=t.split(" ");const l1=[];let len=0;
  while(ws.length&&len+ws[0].length+1<=n){len+=ws[0].length+1;l1.push(ws.shift());}
  let rest=ws.join(" ");if(rest.length>n)rest=rest.slice(0,n-1)+"…";return[l1.join(" "),rest].filter(Boolean);}
function applyVB(){document.getElementById("gr").setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}

function wire(){
  const svg=document.getElementById("gr"),tip=document.getElementById("tip"),stage=document.getElementById("stage");
  svg.querySelectorAll("g.node").forEach(g=>{
    g.addEventListener("click",e=>{e.stopPropagation();openPanel(g.dataset.id);});
    g.addEventListener("mouseenter",()=>focusNode(g.dataset.id,true));
    g.addEventListener("mouseleave",()=>focusNode(null,false));
  });
  svg.querySelectorAll(".lk-hit").forEach(l=>{
    l.addEventListener("mousemove",e=>{
      const lk=LINKS[+l.dataset.i];if(!lk)return;
      tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+10)+"px";
      tip.innerHTML=lk.kind==="objets"
        ?`<span class="k">concepts partagés</span><br>${(lk.objects||[]).map(E).join(" · ")}`
        :`<span class="k">${E(lk.kind)}</span><br>${E(lk.phrase||"")}`;
    });
    l.addEventListener("mouseleave",()=>{tip.style.display="none";});
  });
  // pan / zoom
  let drag=false,sx,sy,svb;
  stage.addEventListener("mousedown",e=>{if(e.target.closest("g.node"))return;drag=true;sx=e.clientX;sy=e.clientY;svb={...vb};stage.classList.add("grabbing");});
  window.addEventListener("mouseup",()=>{drag=false;stage.classList.remove("grabbing");});
  window.addEventListener("mousemove",e=>{if(!drag)return;const sc=vb.w/stage.clientWidth;
    vb.x=svb.x-(e.clientX-sx)*sc;vb.y=svb.y-(e.clientY-sy)*sc;applyVB();});
  stage.addEventListener("wheel",e=>{e.preventDefault();
    const sc=e.deltaY<0?0.88:1.14;const r=stage.getBoundingClientRect();
    const mx=vb.x+(e.clientX-r.left)/r.width*vb.w,my=vb.y+(e.clientY-r.top)/r.height*vb.h;
    vb={x:mx-(mx-vb.x)*sc,y:my-(my-vb.y)*sc,w:vb.w*sc,h:vb.h*sc};applyVB();},{passive:false});
  stage.addEventListener("click",e=>{if(!e.target.closest("g.node")&&!e.target.closest("#panel"))closePanel();});
}
function focusNode(id,on){
  const svg=document.getElementById("gr");
  if(!on||!id){svg.querySelectorAll(".dim,.lk-dim").forEach(x=>x.classList.remove("dim","lk-dim"));
    svg.querySelectorAll(".lk-show").forEach(x=>x.classList.remove("lk-show"));return;}
  const keep=new Set([id]);
  LINKS.forEach(l=>{if(l.a===id)keep.add(l.b);if(l.b===id)keep.add(l.a);});
  svg.querySelectorAll("g.node").forEach(g=>{g.classList.toggle("dim",!keep.has(g.dataset.id));});
  svg.querySelectorAll(".lk").forEach(l=>{const lk=LINKS[+l.dataset.i];const rel=lk&&(lk.a===id||lk.b===id);
    l.classList.toggle("lk-dim",!rel);
    if(l.classList.contains("lk-obj"))l.classList.toggle("lk-show",!!rel);   // les liens de concepts du nœud apparaissent
  });
}

/* ---------- panneau + notation intégrée ---------- */
let CUR=null;
function mdLite(s){return E(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");}
function rootText(f){return f.essentiel||((f.tree&&f.tree.text)||"");}
function panTo(id){
  const n=byId[id];if(!n)return;
  const targetW=Math.min(vb.w,1000),targetH=targetW*(vb.h/vb.w);
  const from={...vb},to={x:n.x-targetW/2,y:n.y-targetH/2,w:targetW,h:targetH};
  const t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/320),e=1-Math.pow(1-k,3);
    vb={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e};
    applyVB();if(k<1)requestAnimationFrame(step);
  })(t0);
}
function openPanel(id,nav){
  const n=byId[id];if(!n)return;CUR=id;
  markSeen(id);
  document.querySelectorAll("g.node.sel").forEach(g=>g.classList.remove("sel"));
  const g=document.querySelector(`g.node[data-id="${CSS.escape(id)}"]`);if(g)g.classList.add("sel");
  if(nav){ panTo(id); focusNode(id,true); clearTimeout(window._nf); window._nf=setTimeout(()=>focusNode(null,false),1500); }
  const f=n.f,col=AX[n.axe]||"#0b6b5f";
  const ax=document.getElementById("pAxe");ax.textContent=n.axe;ax.style.color=col;
  ax.style.filter="brightness(0.7) saturate(1.3)";   // couleur d'axe (palette claire) → lisible sur le panneau papier
  document.getElementById("pTitle").textContent=f.title||id;
  document.getElementById("pDate").textContent=f.date?("Publié le "+f.date):"";
  document.getElementById("pEss").innerHTML=mdLite(rootText(f));
  document.getElementById("pSrc").innerHTML=f.source_url?`SOURCE · <a href="${E(f.source_url)}" target="_blank" rel="noopener">${E(f.source||f.source_url)}</a>`:"";
  const rel=LINKS.filter(l=>l.a===id||l.b===id);
  const lh=rel.length?("<h4>Connexions</h4>"+rel.map(l=>{
    const other=l.a===id?l.b:l.a;const of=byId[other];if(!of)return "";
    const why=l.kind==="objets"?("liés par "+(l.objects||[]).join(", ")):l.phrase||l.kind;
    return `<button class="p-link" data-go="${E(other)}"><span class="k">${E(l.kind)}</span> · ${E(of.f.title||other)}<br><span class="why">${E(why)}</span></button>`;
  }).join("")):"";
  document.getElementById("pLinks").innerHTML=lh;
  document.querySelectorAll("#pLinks .p-link").forEach(b=>b.onclick=()=>openPanel(b.dataset.go,true));
  renderRate();
  document.getElementById("panel").classList.add("open");
}
function closePanel(){document.getElementById("panel").classList.remove("hidden");document.getElementById("panel").classList.remove("open");
  document.querySelectorAll("g.node.sel").forEach(g=>g.classList.remove("sel"));CUR=null;}
document.getElementById("pClose").onclick=closePanel;

function renderRate(){
  const sc=document.getElementById("pScores");sc.innerHTML="";
  const mine=MINE[CUR]||{};
  for(let i=1;i<=10;i++){const b=document.createElement("button");b.textContent=i;
    if(mine.score===i)b.classList.add("on");
    b.onclick=()=>ensureId(()=>{mine.score=(mine.score===i?null:i);MINE[CUR]=mine;push();renderRate();});
    sc.appendChild(b);}
  const cm=document.getElementById("pComment");cm.value=mine.comment||"";
  cm.oninput=()=>{clearTimeout(cm._t);cm._t=setTimeout(()=>ensureId(()=>{mine.comment=cm.value.trim();MINE[CUR]=mine;push();}),600);};
  document.getElementById("pSaved").textContent="";
}
async function pull(){try{const r=await fetch("/api/annotations?run="+encodeURIComponent(RUN));const all=await r.json()||{};
  MINE={};if(ME)for(const fid in all){const m=all[fid]&&all[fid][ME];if(m)MINE[fid]={score:m.score||null,comment:m.comment||""};}}catch(e){}}
async function push(){
  if(!CUR||!ME)return;const m=MINE[CUR]||{};
  try{await fetch("/api/annotations",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({run:RUN,fid:CUR,user:ME,score:m.score||null,comment:m.comment||"",form:"",source_score:null})});
    document.getElementById("pSaved").textContent="Enregistré";setTimeout(()=>{const s=document.getElementById("pSaved");if(s)s.textContent="";},1400);
  }catch(e){}
}
function ensureId(cb){
  if(ME){cb();return;}
  const m=document.createElement("div");m.id="idmodal";
  m.innerHTML='<div class="box"><h3>Constellation</h3><p>Ton prénom, pour enregistrer tes notes et commentaires.</p><input id="idin" placeholder="Ton prénom" autocomplete="name"><button id="idok">Commencer</button></div>';
  document.body.appendChild(m);
  const inp=m.querySelector("#idin");inp.focus();
  const done=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}ME=v;localStorage.setItem("aiwatch-user",v);m.remove();pull().then(cb);};
  m.querySelector("#idok").onclick=done;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")done();});
}
</script>
