function envoyer(ri,fid,score,meta,retour){
  try{
    // pouce (garder/jeter) et note Likert coexistent sur la meme carte : on MERGE,
    // sinon le second geste ecrase le premier.
    const isPouce=(meta.valeur!=null&&score==null);
    const prevS=STORE[fid]||{}, prevN=NOTES[fid]||{};
    const nScore  =isPouce?(prevN.score!=null?prevN.score:(prevS.score!=null?prevS.score:null)):score;
    const nVerdict=isPouce?meta.valeur:(prevN.verdict!=null?prevN.verdict:(prevS.verdict!=null?prevS.verdict:null));
    STORE[fid]=Object.assign({},prevS,{score:nScore,verdict:nVerdict,meta:meta,run:runId(ri),ts:Date.now()});
    sauver();
    NOTES[fid]={score:nScore,verdict:nVerdict};
    marquerNotes(); majEpaisseurs();
    retour(true);
  }catch(e){retour(false,e.message||'localStorage indisponible');}
}

// marque visuellement les signaux dont la CARTE porte une note (anneau + halo)
function marquerNotes(){
  if(typeof etoiles==='undefined')return;
  const axeStat={},runStat={},tierStat={};
  etoiles.forEach(m=>{
    if(!m.userData||m.userData.type!=='leaf')return;
    const id=m.userData.d&&m.userData.d.id;
    // "consulté" (vu OU classé) = anneau VERT ; c'est le SEUL marqueur (plus de bleu).
    const consulte=estConsulte(m.userData.d);
    m.userData.score=null;            // plus de note Likert -> brillance neutre
    m.userData.note=consulte;
    m.userData.keep=false;            // plus de halo doré
    if(m.userData.halo&&m.userData.haloCol)m.userData.halo.material.color.copy(m.userData.haloCol);
    if(m.userData.anneau){ m.userData.anneau.visible=consulte; m.userData.anneau.material.color.set(0x5fd39b); }  // anneau VERT = consulté
    if(m.userData.anneauVu)m.userData.anneauVu.visible=false;   // plus d'anneau bleu
    const k=(m.userData.d&&m.userData.d.axe)+'|'+(m.userData.d&&m.userData.d.run);
    axeStat[k]=axeStat[k]||{tot:0,note:0}; axeStat[k].tot++; if(consulte)axeStat[k].note++;
    const rk=(m.userData.d&&m.userData.d.run); runStat[rk]=runStat[rk]||{tot:0,note:0}; runStat[rk].tot++; if(consulte)runStat[rk].note++;
    const tk=tierCourante(m.userData.d)+'|'+(m.userData.d&&m.userData.d.run);
    tierStat[tk]=tierStat[tk]||{tot:0,note:0}; tierStat[tk].tot++; if(consulte)tierStat[tk].note++;
  });
  // noeud d'axe : anneau "note" visible quand TOUTES les findings de l'axe (meme run) sont notees
  etoiles.forEach(m=>{
    if(!m.userData||m.userData.type!=='axe'||!m.userData.anneau)return;
    const s=axeStat[m.userData.axe+'|'+m.userData.ri];
    m.userData.anneau.visible=!!(s&&s.tot>0&&s.note===s.tot);
  });
  // noeud central : anneau "note" quand TOUS les findings de la veille (ce run) sont notes
  etoiles.forEach(m=>{
    if(!m.userData||m.userData.type!=='core'||!m.userData.anneau)return;
    const s=runStat[m.userData.ri||0];
    m.userData.anneau.visible=!!(s&&s.tot>0&&s.note===s.tot);
  });
  // ZONES REVUES : la couverture se lit sur la constellation, pas seulement sur la carte.
  Object.keys(ZONES.axes).forEach(k=>{
    const st=axeStat[k], z=ZONES.axes[k], fini=!!(st&&st.tot>0&&st.note===st.tot);
    z.wedgeVu.visible=fini; if(z.contourVu)z.contourVu.visible=fini;
  });
  Object.keys(ZONES.tiers).forEach(k=>{
    const st=tierStat[k], z=ZONES.tiers[k], fini=!!(st&&st.tot>0&&st.note===st.tot);
    z.mat.color.set(fini?0x5fd39b:0x5a76b0); z.mat.opacity=fini?.9:.5;
    if(z.labelEl)z.labelEl.classList.toggle('fini',fini);
  });
  etoiles.forEach(m=>{
    if(!m.userData||m.userData.type!=='axe'||!m.userData.lb)return;
    const st=axeStat[m.userData.axe+'|'+m.userData.ri];
    m.userData.lb.classList.toggle('fini',!!(st&&st.tot>0&&st.note===st.tot));
  });
  {const fb=document.getElementById('exportbtn');if(fb){const rs=runStat[(typeof active!=='undefined'?active:0)];fb.classList.toggle('pret',!!(rs&&rs.tot>0&&rs.note===rs.tot));}}
}

// BILAN de fin de notation. Centré sur l'AGENTIVITÉ de l'utilisateur (ce qu'il a corrigé),
// pas sur un score d'accord (biaisé par l'ancrage + il attribue le travail à l'agent).
// L'accord est calculé sur le TOUCHÉ seulement, et relégué en secondaire.
function bilan(){
  const nodes=(D&&D.nodes)||[];
  let consultes=0,deplaces=0,exact=0,within1=0,sumAbs=0,nT=0;
  const axeBias={}, tierBias={}, trans={}; const desac=[];   // biais + MATRICE de transition (agent×toi) par axe ; désaccords
  const bump=(m,k,dd)=>{(m[k]=m[k]||{n:0,sum:0,up:0,down:0,dist:{}});
    m[k].n++;m[k].sum+=dd; if(dd<0)m[k].up++; if(dd>0)m[k].down++;
    m[k].dist[dd]=(m[k].dist[dd]||0)+1;};   // distribution complète par écart Δ (-3..+3, 0 inclus)
  const putT=(ax,a,u)=>{(trans[ax]=trans[ax]||{}); const key=a+'>'+u; trans[ax][key]=(trans[ax][key]||0)+1;};
  nodes.forEach(d=>{
    const moved=!!(STORE['tier::'+d.id]&&STORE['tier::'+d.id].source==='user');
    const vu=VUS.has(d.id); if(!(moved||vu))return;
    consultes++;
    const a=tierIdx(d.tier||'Bof'), u=tierIdx(tierCourante(d)), dd=u-a;
    nT++; sumAbs+=Math.abs(dd); if(dd===0)exact++; if(Math.abs(dd)<=1)within1++;
    bump(axeBias,d.axe,dd); bump(tierBias,TIERS[u],dd);   // up=remontée (agent sous-estimait) · down=descente
    putT(d.axe,a,u); putT('Tous',a,u);                     // matrice de transition par axe + globale
    if(moved)deplaces++;
    if(dd!==0)desac.push({id:d.id,headline:d.headline||d.id,axe:d.axe,a:a,u:u,delta:dd,notes:d.notes||null});
  });
  desac.sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta)||y.delta-x.delta);
  const acc=nT?Math.round((1-(sumAbs/nT)/3)*100):null;
  return {total:nodes.length,consultes,deplaces,exact,within1,acc,nT,
          axeBias,tierBias,trans,top:desac.slice(0,7),nDesac:desac.length,
          meanAbs:nT?+(sumAbs/nT).toFixed(2):null};
}

// pouce : le geste leger. Libelles par defaut "utile/creux" (objets) ; passer
// labels=['Garder','Jeter'] pour le pouce primaire de la carte.
// === TIERS : couleur + deplacement radial d'une etoile quand sa tier change ===
const TIERCOL={Excellent:'#4ade80',Cool:'#06b6d4','Intéressant':'#3b82f6',Neutre:'#f472b6',Bof:'#f59e0b',Inutile:'#64748b'};
function tierCourante(d){ const s=STORE['tier::'+d.id]; return (s&&s.tier)|| d.tier || 'Bof'; }
// "consulté" = plus rien à y voir : ouvert (vu) OU classé par toi (tier déplacée)
// Pont vers les scripts hors module (le tuto) : eux ne voient pas les variables
// du module. Ils passent par ici pour allumer ce dont ils parlent.
window.__constel = {
  hili(o){ o=o||{}; hiliAxe=o.axe||null; hiliId=o.id||null; hiliTier=o.tier||null; },
  eteindre(){ hiliAxe=null; hiliId=null; hiliTier=null; },
  feuilles(){ return etoiles.filter(m=>m.userData&&m.userData.type==='leaf'&&m.userData.d)
                            .map(m=>m.userData.d); },
  tier(d){ return tierCourante(d); },
  // position ecran (px) de l'etoile d'un finding, pour la cadrer sans passer par son label
  // contour ecran d'une forme du modele, echantillonnee en 3D puis projetee :
  // la sphere peut tourner, la forme suit.
  watch(){ return D && D.watch || null; },
  donnees(){ return D || null; },   // deja en memoire : inutile de retelecharger le bundle
  montrerFil(i){ try{ setHi(i); ouvrirFil(i,'menu'); return true; }catch(e){ return false; } },
  // diagnostic : ce que le lecteur voit vraiment (px ecran), noeud par noeud
  mesures(){
    if(!cam) return [];
    const out=[];
    etoiles.forEach(m=>{
      if(!m.userData || m.userData.type!=='leaf' || !m.userData.d) return;
      const c=new THREE.Vector3(); m.getWorldPosition(c);
      const ech=new THREE.Vector3(); m.getWorldScale(ech);
      const geo=m.geometry; if(!geo.boundingSphere) geo.computeBoundingSphere();
      const rMonde=geo.boundingSphere.radius*Math.max(ech.x,ech.y,ech.z);
      const p0=c.clone().project(cam);
      const p1=c.clone().add(new THREE.Vector3(rMonde,0,0)).project(cam);
      out.push({id:m.userData.d.id, axe:m.userData.d.axe, tier:tierCourante(m.userData.d),
        x:(p0.x*0.5+0.5)*innerWidth, y:(-p0.y*0.5+0.5)*innerHeight,
        r:Math.abs((p1.x-p0.x)*0.5*innerWidth),
        anneau:!!(m.userData.anneau && m.userData.anneau.visible)});
    });
    return out;
  },
  vue(){ return curView && curView.type || null; },
  ouvert(){ return (curView && curView.type==='finding' && curView.d) || null; },   // le signal affiche
  ouvrirCoeur(){ const m=etoiles.find(e=>e.userData&&e.userData.type==='core');
    ouvrirLivraison(m ? (m.userData.ri||0) : 0); return true; },
  coeur(){
    const m = etoiles.find(e=>e.userData && e.userData.type==='core');
    if(!m || !cam) return null;
    const v = new THREE.Vector3(); m.getWorldPosition(v); v.project(cam);
    if(v.z > 1) return null;
    return {x:(v.x*0.5+0.5)*innerWidth, y:(-v.y*0.5+0.5)*innerHeight};
  },
  ouvrir(id){
    const m = etoiles.find(e=>e.userData&&e.userData.type==='leaf'&&e.userData.d&&e.userData.d.id===id);
    if(m){ ouvrir(m.userData.d); return true; }
    return false;
  },
  contour(kind, arg){
    const pl = plans && plans[plans.length-1];
    const g = pl && pl.g; if(!g || !cam) return null;
    const proj = (x,y)=>{
      const v = new THREE.Vector3(x,y,0); g.localToWorld(v); v.project(cam);
      return [ (v.x*0.5+0.5)*innerWidth, (-v.y*0.5+0.5)*innerHeight ];
    };
    const arc = (r,a0,a1,n)=>{ const out=[]; for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n;
      out.push(proj(Math.cos(a)*r, Math.sin(a)*r)); } return out; };
    const ROUT = tierR(TIERS.length-1)+RSTEP*0.65;
    if(kind==='secteur'){
      const sc = SEC[arg]; if(!sc) return null;
      // la part de tarte : pointe au coeur, arc a la peripherie
      return [[proj(0,0)].concat(arc(ROUT, sc.ai1, sc.ai0, 48))];
    }
    if(kind==='disque'){
      return [ arc(ROUT, 0, Math.PI*2, 90) ];   // les quatre couronnes d'un coup
    }
    if(kind==='anneau'){
      const k = TIERS.indexOf(arg); if(k<0) return null;
      const rOut = tierR(k)+RSTEP*0.46, rIn = Math.max(20, tierR(k)-RSTEP*0.46);
      return [ arc(rOut, 0, Math.PI*2, 80), arc(rIn, Math.PI*2, 0, 80) ];  // sens inverse = trou
    }
    return null;
  },
  // boite ecran englobant un ensemble de noeuds : {axe} , {tier} ou {id}
  zone(f){
    f = f || {};
    const pts = [];
    etoiles.forEach(m=>{
      const u = m.userData; if(!u || u.type!=='leaf' || !u.d) return;
      if(f.id!=null   && u.d.id!==f.id) return;
      if(f.axe!=null  && u.d.axe!==f.axe) return;
      if(f.tier!=null && tierCourante(u.d)!==f.tier) return;
      const v = new THREE.Vector3(); m.getWorldPosition(v); v.project(cam);
      if(v.z > 1) return;
      pts.push({x:(v.x*0.5+0.5)*innerWidth, y:(-v.y*0.5+0.5)*innerHeight});
    });
    if(!pts.length) return null;
    const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
    return {x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys), n:pts.length};
  },
  ecran(id){
    const m = etoiles.find(e=>e.userData&&e.userData.type==='leaf'&&e.userData.d&&e.userData.d.id===id);
    if(!m || !cam) return null;
    const v = new THREE.Vector3(); m.getWorldPosition(v); v.project(cam);
    if(v.z > 1) return null;                       // derriere la camera
    const w = innerWidth, h = innerHeight;
    const x = (v.x*0.5+0.5)*w, y = (-v.y*0.5+0.5)*h;
    if(x<0||y<0||x>w||y>h) return null;
    return {x, y, r: 26};
  },
};

// re-calcule les CIBLES de position de tous les findings d'un axe (secteur re-harmonisé par tier),
// sans bouger les meshes : la boucle animer() les fait glisser vers leur cible (lerp).
function layoutAxe(a){
  const s=SEC[a]; if(!s)return;
  const mine=D.nodes.filter(x=>(x.run||0)===s.ri && x.axe===a);
  TIERS.forEach((t,k)=>{
    const arr=mine.filter(d=>tierCourante(d)===t), rr=tierR(k), nn=arr.length;
    // ANTIOVERLAP-2026 : meme placement bande+grille que construire() -> pas de chevauchement apres reclassement
    const cellPos=cellLayout(nn,s.ai0,s.ai1,s.amid,rr,tierSize(t),k);
    arr.forEach((d,j)=>{
      const tx=cellPos[j].x, ty=cellPos[j].y, ns=cellPos[j].s;
      POS[d.id]=[tx,ty];
      const m=etoiles.find(mm=>mm.userData.type==='leaf'&&mm.userData.d&&mm.userData.d.id===d.id);
      if(m){ m.userData.tx=tx; m.userData.ty=ty;
        const b=m.userData.baseR; if(b>0)m.scale.setScalar(ns/b); }  // rescale (scale absolu vs rayon geometrique d'origine)
    });
  });
}
function deplacerTier(d,newtier){

  // La tier courante vit dans STORE (tierCourante la lit).
  try{ STORE['tier::'+d.id]={tier:newtier,source:'user',ts:Date.now()}; sauver(); }catch(e){ console.warn('sauver tier',e); }
  layoutAxe(d.axe);   // recalcule les cibles -> animer() translate + re-harmonise le secteur
  if(typeof marquerNotes==='function')marquerNotes();
}

function pouce(ri,fid,question,meta,labels){
  const L=labels||['utile','creux'];
  const w=document.createElement('div'); w.className='pouce';
  const q=document.createElement('span'); q.className='q'; q.textContent=question; w.appendChild(q);
  const msg=document.createElement('span'); msg.className='msg';
  const cour=(NOTES[fid]&&NOTES[fid].verdict!=null)?NOTES[fid].verdict:null;
  const btns=[];
  [['oui',L[0],1],['non',L[1],-1]].forEach(function(t){
    const b=document.createElement('button'); b.type='button';
    b.className=t[0]; b.textContent=t[1];
    b.setAttribute('aria-label',question+' — '+t[1]);
    if(cour===t[2])b.classList.add('on');
    b.onclick=()=>{
      btns.forEach(x=>x.classList.remove('on')); b.classList.add('on');
      msg.className='msg'; msg.textContent='…';
      const m=Object.assign({},meta,{v:1,geste:'pouce',valeur:t[2]});
      envoyer(ri,fid,null,m,(ok,err)=>{
        msg.className='msg'+(ok?'':' ko');
        msg.textContent=ok?'retenu':('non enregistré — '+err);
      });
    };
    btns.push(b); w.appendChild(b);
  });
  w.appendChild(msg);
  return w;
}

function sectionAxes(ri,onChange){
  const chg=()=>{if(onChange)onChange();};
  const wrap=document.createElement('div'); wrap.className='evaluation axes-eval';
  wrap.innerHTML='<div class="ev-titre">Les axes <span class="hint">&rarr; prochaine run</span></div>';

  // bloc "axes retenus" (defini tot : renderAjouts est partage avec les suggestions)
  const add=document.createElement('div'); add.className='axe-ajout';
  add.innerHTML='<div class="axe-ajout-l">Axes retenus pour la prochaine veille</div>';
  const list=document.createElement('div'); list.className='axe-ajout-list';
  function renderAjouts(){
    list.innerHTML='';
    (AXES.ajouts||[]).forEach((a,i)=>{
      const chip=document.createElement('span'); chip.className='axe-chip'; chip.textContent=a.titre;
      const x=document.createElement('button'); x.type='button'; x.textContent='×'; x.title='retirer';
      x.onclick=()=>{const t=a.titre; AXES.ajouts.splice(i,1);
        if(AXES.suggestions&&AXES.suggestions[t]==='oui')delete AXES.suggestions[t];
        sauverAxes(); renderAjouts(); majBoutonsSugg(); chg();};
      chip.appendChild(x); list.appendChild(chip);
    });
  }
  const inp=document.createElement('input'); inp.type='text'; inp.className='axe-ajout-inp';
  inp.placeholder='ajouter un axe à la main — Entrée';
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){AXES.ajouts=AXES.ajouts||[];AXES.ajouts.push({titre:inp.value.trim()});inp.value='';sauverAxes();renderAjouts();chg();}};
  add.appendChild(list); add.appendChild(inp);

  // decisions par axe actuel : garder / faire evoluer (vers) / retirer
  const axesDuRun=[...new Set(D.nodes.filter(n=>n.run===ri).map(n=>n.axe))];
  axesDuRun.forEach(axe=>{
    const dec=AXES.decisions[axe]||{choix:'garder',vers:''};
    const row=document.createElement('div'); row.className='axe-row';
    const nom=document.createElement('div'); nom.className='axe-nom'; nom.textContent=axe;
    nom.style.borderLeft='3px solid '+(AXC[axe]||'#7fb0ff');
    const grp=document.createElement('div'); grp.className='axe-choix';
    const vers=document.createElement('input'); vers.className='axe-vers'; vers.type='text';
    vers.placeholder='faire évoluer vers…'; vers.value=dec.vers||'';
    vers.style.display=(dec.choix==='evoluer')?'block':'none';
    [['garder','garder'],['evoluer','faire évoluer'],['retirer','retirer']].forEach(([k,lbl])=>{
      const b=document.createElement('button'); b.type='button'; b.textContent=lbl;
      if(dec.choix===k)b.classList.add('on','c-'+k);
      b.onclick=()=>{
        grp.querySelectorAll('button').forEach(x=>x.classList.remove('on','c-garder','c-evoluer','c-retirer'));
        b.classList.add('on','c-'+k);
        AXES.decisions[axe]=Object.assign(AXES.decisions[axe]||{},{choix:k});
        vers.style.display=(k==='evoluer')?'block':'none'; sauverAxes(); chg();
      };
      grp.appendChild(b);
    });
    // ancienneté (fenêtre de fraîcheur) réglable pour CET axe (défaut = globale)
    const fw=document.createElement('label'); fw.className='axe-frais'; fw.innerHTML='<span>fraîcheur</span>';
    const sel=document.createElement('select');
    FRAICHEURS.forEach(([k,lbl])=>{const o=document.createElement('option');o.value=k;o.textContent=lbl;sel.appendChild(o);});
    sel.value=dec.fraicheur||AXES.fraicheur;
    sel.onchange=()=>{AXES.decisions[axe]=Object.assign(AXES.decisions[axe]||{choix:dec.choix||'garder'},{fraicheur:sel.value});sauverAxes();};
    fw.appendChild(sel);
    vers.oninput=()=>{AXES.decisions[axe]=Object.assign(AXES.decisions[axe]||{choix:'evoluer'},{vers:vers.value});sauverAxes();};
    row.appendChild(nom); row.appendChild(grp); row.appendChild(fw); row.appendChild(vers);
    wrap.appendChild(row);
  });

  // suggestions d'axes emergents (Volet B) : reperees dans la recherche, a valider
  const cartesSugg=[];
  function majBoutonsSugg(){
    cartesSugg.forEach(({s,card,oui,non})=>{
      const v=(AXES.suggestions||{})[s.titre];
      oui.classList.toggle('on',v==='oui'); non.classList.toggle('on',v==='non');
      card.className='axe-sugg'+(v?(' v-'+v):'');
    });
  }
  const sugg=(D.suggestions_axes||[]);
  if(sugg.length){
    AXES.suggestions=AXES.suggestions||{};
    const sw=document.createElement('div'); sw.className='axe-sugg-bloc';
    sw.innerHTML='<div class="axe-ajout-l">Suggestions repérées dans la recherche <span class="hint">à valider pour la prochaine veille</span></div>';
    sugg.forEach(s=>{
      const card=document.createElement('div'); card.className='axe-sugg';
      let h='<div class="axe-sugg-t">'+esc(s.titre)+'</div>';
      if(s.pourquoi)h+='<div class="axe-sugg-w">'+esc(s.pourquoi)+'</div>';
      if(s.findings&&s.findings.length)h+='<ul class="axe-sugg-h">'+s.findings.map(f=>'<li>'+esc(f.titre||f)+'</li>').join('')+'</ul>';
      card.innerHTML=h;
      const act=document.createElement('div'); act.className='axe-sugg-act';
      const oui=document.createElement('button'); oui.type='button'; oui.className='s-oui'; oui.textContent="M'intéresse";
      const non=document.createElement('button'); non.type='button'; non.className='s-non'; non.textContent='Non merci';
      oui.onclick=()=>{AXES.suggestions[s.titre]='oui';
        AXES.ajouts=AXES.ajouts||[]; if(!AXES.ajouts.some(a=>a.titre===s.titre))AXES.ajouts.push({titre:s.titre,origine:'suggestion'});
        sauverAxes(); renderAjouts(); majBoutonsSugg(); chg();};
      non.onclick=()=>{AXES.suggestions[s.titre]='non';
        if(AXES.ajouts)AXES.ajouts=AXES.ajouts.filter(a=>a.titre!==s.titre);
        sauverAxes(); renderAjouts(); majBoutonsSugg(); chg();};
      act.appendChild(oui); act.appendChild(non); card.appendChild(act);
      cartesSugg.push({s,card,oui,non}); sw.appendChild(card);
    });
    wrap.appendChild(sw);
  }

  wrap.appendChild(add); renderAjouts(); majBoutonsSugg();
  return wrap;
}

  // source : le geste que la page attend est visible des l'ouverture, la lecture continue en

  viderPied();
  panel.classList.add('on'); recadrer();
}

// la carte du signal : essentiel avec objets nommés, dépliables sur place
function hote(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }

// Une carte porte une HISTOIRE : plusieurs findings, donc plusieurs sources. Une seule source
// garde l'affichage d'un lien nu ; au-dela, la carte les liste — c'est ce qui montre au lecteur
// que le volume est la, sous un seul objet de lecture.
function blocSources(f){
  const S=(f&&f.sources)||[];
  if(!S.length) return f&&f.url
    ? '<a class="src-url" href="'+esc(f.url)+'" target="_blank" rel="noopener" title="'+esc(f.url)+'">'+esc(f.url)+'</a>'
    : '';
  if(S.length===1) return '<a class="src-url" href="'+esc(S[0].url)+'" target="_blank" rel="noopener" title="'+esc(S[0].url)+'">'+esc(S[0].url)+'</a>';
  let h='<div class="srcs"><div class="srcs-t">'+S.length+' sources</div>';
  S.forEach((sc,i)=>{
    h+='<a class="srcs-i" href="'+esc(sc.url)+'" target="_blank" rel="noopener" title="'+esc(sc.url)+'">'+
       '<span class="srcs-n">'+(i+1)+'</span>'+
       '<span class="srcs-c"><span class="srcs-h">'+esc(sc.titre||hote(sc.url))+'</span>'+
       '<span class="srcs-m">'+esc(hote(sc.url))+(sc.date?' \u00b7 '+fmtd(sc.date):'')+'</span></span></a>';
  });
  return h+'</div>';
}

function carte(d){
  const f=d.fiche||{}, col=AXC[d.axe]||'#64748b';
  // pas de jargon de pipeline sur la carte (case rare / rapport dégradé / signal
  // isolé) : ce sont des étiquettes internes, pas destinées au lecteur (2026-07-21).
  let h='<h2 style="border-left:4px solid '+col+';padding-left:11px">'+esc(d.headline)+'</h2>'+
        '<div class="meta">'+fmtd(d.date)+' · '+esc(d.axe)+'</div>'+
        blocSources(f)+
        (d.notes?'<div style="margin:8px 0 2px">'+blocNotes(d)+'</div>':'')+
        '<div class="card">';

  h+=corpsCarte(f.essentiel,f.objets);
  if(f.rapport){
    h+='<details class="fond"><summary>Rapport de fond</summary>'+
       '<div class="fond-x">'+mdRapport(f.rapport)+'</div></details>';
  }
  return h+'</div>';
}

// rendu markdown leger du rapport de fond (porte de la page de notation)
function paragrapher(t){
  t=(t||'').trim();
  if(!t||/\n\s*\n/.test(t))return t;
  const ph=t.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý0-9])/);
  if(ph.length<3)return t;
  const out=[]; for(let i=0;i<ph.length;i+=2) out.push(ph.slice(i,i+2).join(' '));
  return out.join('\n\n');
}
function mdRapport(src){
  let t=esc(src||'');
  t=t.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
     .replace(/^##\s+(.+)$/gm,'<h2>$1</h2>')
     .replace(/^#\s+(.+)$/gm,'<h2>$1</h2>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
     .replace(/(?<![\*\w])\*([^\*\n]+)\*(?!\*)/g,'<em>$1</em>')
     .replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/^\s*[•\-]\s+(.+)$/gm,'<li>$1</li>');
  t=t.replace(/^(\|.*\|)$/gm,'<div class="tbl">$1</div>');
  // paragraphes : on ne wrappe pas les blocs deja balises
  const blocs=t.split(/\n\s*\n/).map(b=>{
    const s=b.trim();
    if(!s)return '';
    if(/^<(h2|h3|div|li)/.test(s))return s.replace(/\n/g,' ');
    return '<p>'+s.replace(/\n/g,'<br>')+'</p>';
  });
  return blocs.join('');
}

// champ de commentaire libre, persiste en local (fusionne depuis la page de notation)
function champCommentaire(id,ph){
  const w=document.createElement('div'); w.className='commentaire';
  const l=document.createElement('label'); l.textContent='Commentaire libre'; w.appendChild(l);
  const ta=document.createElement('textarea');
  ta.placeholder=ph||'ce qui manque, ce qui dérange, ce qui sert';
  const cle='com::'+id;
  if(STORE[cle]&&STORE[cle].texte)ta.value=STORE[cle].texte;
  ta.oninput=()=>{STORE[cle]={texte:ta.value,ts:Date.now()};sauver();};
  w.appendChild(ta); return w;
}

// essentiel + objets dépliables : commun aux cartes de signal et aux cartes de fil
function corpsCarte(essentiel,objets){
  const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^•/gm,'&bull;');
  let h='';
  if(essentiel){
    const objs=objets||[];
    let txt=esc(essentiel);
    // mise en evidence dans l'essentiel : __gras__ pour un fait ou un chiffre,
    // *italique* pour un nom ou un terme. `**nom**` reste reserve aux objets depliables.
    txt=txt.replace(/__(.+?)__/g, "<strong>$1</strong>");
    txt=txt.replace(/(?<![\*\w])\*([^\*\n]{2,}?)\*(?!\*)/g, "<em>$1</em>");
    txt=txt.replace(/\*\*(.+?)\*\*/g,(m,nom)=>{
      const i=objs.findIndex(o=>o.nom===nom);
      return i>=0 ? '<button type="button" class="ob" data-o="'+i+'">'+nom+'</button>'
                  : '<span class="men">'+nom+'</span>';
    });
    h+='<details class="essd" open><summary>Essentiel</summary>';
    // essentiel 4-temps : un intitulé de rôle au-dessus de chaque paragraphe (si bien 4).
    const parts=txt.split(/\n\s*\n/).filter(x=>x.trim());
    const LAB=['Le fait','Le mécanisme','Ce qui compte','Réserves & effet'];
    let inner='';
    parts.forEach((p,i)=>{ if(parts.length===4)inner+='<div class="ptit">'+LAB[i]+'</div>'; inner+='<p>'+p+'</p>'; });
    h+='<div class="ess">'+inner+'</div>';
    objs.forEach((o,i)=>{
      const c=o.type==='chiffre'?'#fbbf24':o.type==='limite'?'#f87171':
              o.type==='mécanisme'?'#2dd4bf':o.type==='acteur'?'#c084fc':'#7fb0ff';
      let b='<div class="dep" data-d="'+i+'" hidden><span class="tt" style="color:'+c+'">'+esc(o.type||'')+'</span>'+md(o.texte||'');
      if(o.sources&&o.sources.length){
        b+='<div class="srcs">';
        o.sources.forEach(x=>{b+='<a class="src" href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.n||x.u)+'</a>';});
        b+='</div>';
      }
      h+=b+'</div>';
    });
    h+='</details>';
  }else{
    h+='<div class="lead" style="color:#5f708f">Carte non générée.</div>';
  }
  return h;
}
// un objet s'ouvre au clic
function cablerObjets(){
  pbody.querySelectorAll('.ob').forEach(b=>{
    b.onclick=()=>{
      const dep=pbody.querySelector('.dep[data-d="'+b.dataset.o+'"]');
      if(!dep)return;
      const ouvert=!dep.hidden;
      dep.hidden=ouvert; b.classList.toggle('ouv',!ouvert);
      if(!ouvert){
        // le dépliage se place juste après le paragraphe où le nom apparaît
        const par=b.closest('p')||b.parentNode;
        par.parentNode.insertBefore(dep,par.nextSibling);
        dep.scrollIntoView({block:'nearest',behavior:'smooth'});
      }
    };
  });
}

// Mise en forme du texte d'un lien : meme grammaire que les essentiels
// (__gras__ pour un fait ou un chiffre, *italique* pour un nom), sans le
// depliant "Essentiel" qui n'a pas de sens ici.
function typoLien(txt,nSrc){
  return esc(String(txt||''))
    .replace(/__(.+?)__/g,'<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(?<![\*\w])\*([^\*\n]{2,}?)\*(?!\*)/g,'<em>$1</em>')
    // un renvoi ne vaut que s'il mene quelque part : [2] designe la source 2
    .replace(/\[(\d{1,2})\]/g,(m,n)=>{
      const k=+n; if(!nSrc||k<1||k>nSrc) return m;
      return '<button type="button" class="renvoi" data-src="'+k+'">'+k+'</button>';
    });
}
function ouvrirFil(i,src){
  viderPied();   /* FIXPC-2026 */
  const f=(D.fils||[])[i]; if(!f)return;
  pushNav('fil'); curView={type:'fil',fil:i,src:src};
  const col=AXC[f.axe]||'#64748b';
  // Un fil de publication porte son propos dans `texte` ; un fil d'evaluation
  // porte une carte et un statut. On lit le fil selon ce qu'il est.
  const estLien=!!f.texte && !f.essentiel_carte;
  const axesU=[...new Set(f.axes||[f.axe])].filter(Boolean);
  const portee=axesU.length>1?axesU.map(esc).join(' \u00d7 '):esc(axesU[0]||f.axe||'');
  const nature=estLien?(f.type==='suite'?'suite dans le temps':'rapprochement'):(f.statut||'');
  const meta=[portee,nature,f.chaine.length+' signaux',
              fmtd(f.chaine[0].date)+' \u2192 '+fmtd(f.chaine[f.chaine.length-1].date)]
             .filter(Boolean).join(' \u00b7 ');
  let h='<h2 style="border-left:4px solid '+col+';padding-left:11px">'+esc(f.titre)+'</h2>'+
    '<div class="meta">'+meta+'</div>'+
    (estLien
      ? '<div class="card"><div class="ess"><p>'+typoLien(f.texte,f.chaine.length)+'</p></div></div>'
      : f.essentiel_carte
        ? '<div class="card">'+corpsCarte(f.essentiel_carte,f.objets)+'</div>'
        : '<div class="etat">'+esc(f.etat||'')+'</div>')+
    '<div class="sect">'+(estLien?'Les signaux reli\u00e9s':'Ce que chaque livraison a chang\u00e9')+'</div>';
  let nS=0;
  f.chaine.forEach(c=>{
    const n=D.nodes.filter(x=>x.id===c.id)[0]||{};
    if(estLien){
      // le lien renvoie a ses deux bouts : on doit pouvoir aller lire le signal
      h+='<div class="ent lienf" data-nid="'+esc(c.id)+'" data-src="'+(nS+1)+'">'+
         '<div class="d"><span class="num">'+(++nS)+'</span> '+fmtd(c.date)+
         (n.axe?' <span class="r">'+esc(n.axe)+'</span>':'')+'</div>'+
         '<div class="c">'+esc(n.headline||n.titre||c.id)+'</div></div>';
    }else{
      h+='<div class="ent"><div class="d">'+fmtd(c.date)+' <span class="r">'+esc(c.rel||'')+'</span></div>'+
         '<div class="c">'+esc(c.change||'')+'</div><div class="d" style="margin-top:4px">'+esc(n.headline||'')+'</div></div>';
    }
  });
  if(f.traj&&f.traj.length){
    h+='<div class="sect">Ce qui avait été annoncé</div>';
    f.traj.forEach(t=>{h+='<div class="tj '+t.v+'"><div class="v">'+
      (t.v==='realisee'?'réalisé':t.v==='infirmee'?'infirmé':'trop tôt pour dire')+'</div>'+
      '<div>Annoncé le '+fmtd(t.d)+' : '+esc(t.a)+'</div>'+
      '<div style="margin-top:6px;color:#93a3bf">→ '+esc(t.s)+'</div></div>';});
  }
  pbody.innerHTML=h; cablerObjets();
  // chaque bout du lien ouvre son signal
  const srcDe=k=>pbody.querySelector('.ent.lienf[data-src="'+k+'"]');
  pbody.querySelectorAll('.ent.lienf').forEach(el=>{
    el.onmouseenter=()=>{ hiliId=el.dataset.nid; };   // designe l'etoile dans le ciel
    el.onmouseleave=()=>{ hiliId=null; };
    el.onclick=()=>{const n=D.nodes.filter(x=>x.id===el.dataset.nid)[0]; if(n)ouvrir(n);};
  });
  // le renvoi du texte et la source sous le texte designent la meme chose
  pbody.querySelectorAll('.renvoi').forEach(b=>{
    const cible=srcDe(b.dataset.src);
    b.onmouseenter=()=>{ if(!cible)return; hiliId=cible.dataset.nid; cible.classList.add('vise'); };
    b.onmouseleave=()=>{ hiliId=null; if(cible)cible.classList.remove('vise'); };
    b.onclick=()=>{ if(cible)cible.click(); };
  });
  // la carte du fil se rattache a la livraison la plus recente de sa chaine
  const dfin=f.chaine[f.chaine.length-1].date, rfin=Math.max(0,D.runs.indexOf(dfin));
  // en lecture, rien a noter : un lien n'appartient pas a une run a evaluer
  if(!window.__PUBLICATION && f.id){
    cablerPouceObjets(rfin,f.objets,'fil::'+f.id);
    pbody.appendChild(barre(rfin,'fil::'+f.id,'Cette carte de fil',
      {niveau:'fil',role:ROLE.fil,cible:f.id,axe:f.axe,statut:f.statut}));
  }
  if(src){
    const b=document.createElement('button');b.className='go';b.textContent='Revenir à la carte du signal';
    b.onclick=()=>ouvrir(src);pbody.appendChild(b);
    const b2=document.createElement('button');b2.className='go';b2.textContent="S'approcher";
    b2.style.marginTop='8px';b2.onclick=()=>approcher(src);pbody.appendChild(b2);}
  panel.classList.add('on'); recadrer();
}
function fermerPanneau(){selection=null;hiliAxe=null;hiliId=null;hiliTier=null;curView=null;navStack.length=0;viderPied();panel.classList.remove('on');recadrer();}
// RETOUR-PILE-2026 : re-ouvre une vue parente depuis la pile, sans re-empiler (restoring).
function rouvrir(v){
  restoring=true;
  try{
    if(v.type==='finding'){ ouvrir(v.d); if(v.viaTier)curView.viaTier=v.viaTier; }
    else if(v.type==='axe')  ouvrirAxe(v.axe,v.ri);
    else if(v.type==='tier') ouvrirTier(v.tier,v.ri);
    else if(v.type==='core') ouvrirLivraison(v.ri);
    else if(v.type==='fil')  ouvrirFil(v.fil,v.src);
    else fermerPanneau();
  } finally { restoring=false; }
}

  const now=Date.now(); if(now-lastRetour<300)return; lastRetour=now;   // avale le ghost-click tactile
  if(navStack.length) rouvrir(navStack.pop());   // fiche->axe->constellation, sans saut au ciel
  else fermerPanneau();
}

function construireNav(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  // Le rail est dans le meme sens que la profondeur de la scene : la livraison
  // regardee a gauche, les precedentes vers la droite.
  const ordre=D.runs.map((run,ri)=>({run:run,ri:ri}));
  if(window.__PUBLICATION) ordre.reverse();
  ordre.forEach(o=>{
    const run=o.run, ri=o.ri;
    const n=D.nodes.filter(x=>x.run===ri).length;
    const b=document.createElement('button'); b.className='stop'; b.dataset.ri=ri;
    b.setAttribute('role','tab'); b.setAttribute('aria-label','Livraison du '+run+', '+n+' signaux');
    b.textContent=fmtd(run); b.onclick=()=>allerA(ri);
    rail.appendChild(b);
  });
  // la fleche mene vers ce qu'elle designe a l'ecran, pas vers un rang
  const versGauche=()=>{ if(window.__PUBLICATION){ if(active<D.runs.length-1)allerA(active+1); }
                         else if(active>0)allerA(active-1); };
  const versDroite=()=>{ if(window.__PUBLICATION){ if(active>0)allerA(active-1); }
                         else if(active<D.runs.length-1)allerA(active+1); };
  document.getElementById('prev').onclick=versGauche;
  document.getElementById('next').onclick=versDroite;
  // une seule livraison : pas de navigation → on masque les flèches et on rend la date
  // non-interactive (elle sert d'étiquette, plus de faux bouton cliquable sans effet).
  document.getElementById('nav').classList.toggle('mono', D.runs.length<=1);
  peindreNav();
}
function peindreNav(){
  document.querySelectorAll('#rail .stop').forEach(b=>{
    const on=+b.dataset.ri===active;
    b.classList.toggle('on',on); b.setAttribute('aria-selected',on?'true':'false');
  });
  const bout0=(active===0), boutN=(active===D.runs.length-1);
  document.getElementById('prev').disabled=window.__PUBLICATION?boutN:bout0;
  document.getElementById('next').disabled=window.__PUBLICATION?bout0:boutN;
}

(function(){
  const rz=document.getElementById('resizer'),root=document.documentElement;
  const MIN=340, MAX=()=>Math.min(innerWidth*0.96, 1100);
  const larg=localStorage.getItem('constel-pw');
  if(larg)root.style.setProperty('--pw',larg+'px');
  let drag=false;
  function pose(px){const w=Math.max(MIN,Math.min(MAX(),innerWidth-px));
    root.style.setProperty('--pw',w+'px');return w;}
  rz.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;
    drag=true; rz.setPointerCapture(e.pointerId);
    document.body.classList.add('redim'); document.getElementById('panel').classList.add('redim');
    e.preventDefault();});
  let rafR=0;
  rz.addEventListener('pointermove',e=>{if(!drag)return; pose(e.clientX); if(!rafR)rafR=requestAnimationFrame(()=>{rafR=0;recadrer();});});
  function fin(e){if(!drag)return; drag=false;
    document.body.classList.remove('redim'); document.getElementById('panel').classList.remove('redim');
    const w=pose(e.clientX); localStorage.setItem('constel-pw',Math.round(w)); recadrer();}
  rz.addEventListener('pointerup',fin);
  rz.addEventListener('pointercancel',fin);
  // double-clic sur la poignee : revenir a la largeur par defaut
  rz.addEventListener('dblclick',()=>{root.style.removeProperty('--pw');
    localStorage.removeItem('constel-pw');recadrer();});
})();

let enPause=false;
addEventListener('message',e=>{ if(e.data==='pause')enPause=true; if(e.data==='reprise')enPause=false; });
function animer(){
  requestAnimationFrame(animer);
  if(enPause) return;   /* la vitrine ne consomme rien quand elle est hors ecran */
  if(EMBED){ orbA+=0.00028; majVitrine(); } else { ctl.update(); }
  if(animer._plansActif!==active){          // les rayons ne changent qu'ici
    animer._plansActif=active;
    plans.forEach(p=>{
      const loin=Math.abs(p.ri-active)>0, op=loin?.07:.22;
      p.rayons.forEach(o=>{o.material.opacity=op;});
    });
  }
  // TRANSLATION animee (physique tres legere) : chaque étoile glisse vers sa cible (tx,ty) ;
  // re-harmonise le secteur quand une tier change. Les non-mobiles = early-return (60fps garanti).
  etoiles.forEach(m=>{
    if(m.userData.type!=='leaf'||m.userData.tx===undefined)return;
    const dx=m.userData.tx-m.position.x, dy=m.userData.ty-m.position.y;
    if(dx*dx+dy*dy<0.25)return;                       // déjà en place -> rien à faire
    m.position.x+=dx*0.16; m.position.y+=dy*0.16;     // lerp (ressort amorti, sans moteur physique)
    const fl=m.userData.fil;
    if(fl){ const nx=m.position.x, ny=m.position.y, rr=Math.sqrt(nx*nx+ny*ny)||1;
      const mx=nx*0.5-ny/rr*(rr*0.06), my=ny*0.5+nx/rr*(rr*0.06);
      fl.geometry.setFromPoints(new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0,0,0),new THREE.Vector3(mx,my,0),new THREE.Vector3(nx,ny,0)).getPoints(24)); }
  });
  if(hiFil==null){
    etoiles.forEach(m=>{
      if(!m.userData.lb)return;
      const loin=Math.abs(m.userData.ri-active)>0;
      // livraison au 1er plan : coeur + axes toujours etiquetes (la carte de lecture) ;
      // les findings ne montrent leur titre qu'au SURVOL, sinon les grappes se telescopent.
      // livraisons du fond : seule la date du coeur, en filigrane.
      const hid=(hiliId!=null&&m.userData.type==='leaf'&&m.userData.d&&m.userData.d.id===hiliId);
      const op = loin ? (m.userData.type==='core' ? .38 : 0)
                      : (m.userData.type==='leaf' ? (m===survol||hid?1:0) : 1);
      const vide = op < .2 || (loin && m.userData.type==='core');
      // ecrire dans le DOM coute un recalcul de style : on ne le fait qu'au changement
      if(m.userData._op!==op){ m.userData._op=op; m.userData.lb.style.opacity=op; }
      if(m.userData._vide!==vide){ m.userData._vide=vide;
        m.userData.lb.classList.toggle('vide', vide); }
    });
  }
  // survol marque + selection + signaux notes : halo, luminosite, anneau, label
  const puls=0.5+0.5*Math.sin(performance.now()/1000*2.7);   // respiration lente 0..1
  if(hiFil==null) etoiles.forEach(m=>{
    if(!m.userData.halo)return;
    // les livraisons du fond sont figees par majProfondeur : rien a recalculer
    const _ri=(m.userData.ri!=null)?m.userData.ri:((m.userData.d&&m.userData.d.run)||0);
    if(_ri!==active && m!==survol && m!==selection) return;
    const sel=(m===selection), surv=(m===survol), sc=m.userData.score;
    const b=(sc!=null)?sc/10:null;        // 0.1 (note 1) .. 1.0 (note 10)
    const lerp=(a,x)=>a+(x-a)*0.2;
    // priorite : le noeud SELECTIONNE respire (pulsation), au-dessus du survol,
    // au-dessus de la brillance selon la note ; sinon neutre.
    let ho=sel?(0.30+0.70*puls):(surv?1:(b!=null?(0.25+0.75*b):.5)); if(m.userData.keep)ho=Math.max(ho,0.88+0.12*puls);
    m.userData.halo.material.opacity=lerp(m.userData.halo.material.opacity,ho);
    // le halo est compense par la taille de la bille (m.scale) pour ne pas doubler
    let kS=sel?(1.30+0.75*puls):(surv?1.55:(b!=null?(0.85+0.55*b):1)); if(m.userData.keep)kS=Math.max(kS,1.55);
    const cibleS=((m.userData.haloBase||1)/(m.scale.x||1))*kS;
    m.userData.halo.scale.setScalar(lerp(m.userData.halo.scale.x,cibleS));
    if(m.material&&m.material.emissiveIntensity!==undefined){
      let ei=sel?(0.60+1.70*puls):(surv?1.4:(b!=null?(0.25+1.15*b):.45)); if(m.userData.keep)ei=Math.max(ei,1.3);
      m.material.emissiveIntensity=lerp(m.material.emissiveIntensity,ei);
    }
    const _sv=surv||sel;
    if(m.userData.lb && m.userData._sv!==_sv){ m.userData._sv=_sv;
      m.userData.lb.classList.toggle('survol',_sv); }
    if(m.userData.anneauVu)m.userData.anneauVu.visible=false;   // anneau bleu supprimé : vert partout pour "consulté"
  });
  // highlight : l'AXE ouvert est la base (contexte persistant), survoler une finding
  // ne DEhighlighte pas l'axe -> ca ajoute seulement un surcroit de glow sur cette etoile.
  if(hiFil==null){
    const anyHi = hiliAxe!=null || hiliId!=null || hiliTier!=null;
    filaments.forEach(fl=>{ fl.material.opacity =
      !anyHi ? .13 : (hiliAxe!=null && fl.userData.faxe===hiliAxe ? .55 : .03); });
    if(anyHi) etoiles.forEach(m=>{
      if(!m.userData.halo||m.userData.type==='core')return;   // le coeur reste intact
      const isLeaf=m.userData.type==='leaf';
      const ax=isLeaf?(m.userData.d&&m.userData.d.axe):m.userData.axe;
      const cible=(hiliId!=null&&isLeaf&&m.userData.d&&m.userData.d.id===hiliId);
      // contexte axe -> tout l'axe ; contexte tier -> tous les findings de la tier ; sinon -> seule la finding visee
      const match = hiliAxe!=null ? (ax===hiliAxe)
                  : hiliTier!=null ? (isLeaf && tierCourante(m.userData.d)===hiliTier)
                  : cible;
      if(match){
        if(cible){
          m.userData.halo.material.opacity=1;
          m.userData.halo.scale.setScalar(((m.userData.haloBase||1)/(m.scale.x||1))*(2.6+0.5*puls));
          if(m.material&&m.material.emissiveIntensity!==undefined)m.material.emissiveIntensity=3.0;
        } else {
          m.userData.halo.material.opacity=Math.min(1,m.userData.halo.material.opacity*1.1+0.12);
          if(m.material&&m.material.emissiveIntensity!==undefined)m.material.emissiveIntensity=Math.max(m.material.emissiveIntensity,1.0);
        }
      } else {
        m.userData.halo.material.opacity*=0.10;
        if(m.material&&m.material.emissiveIntensity!==undefined)m.material.emissiveIntensity*=0.16;
      }
    });
  }
  rnd.render(scene,cam); lab.render(scene,cam);
  // PERF-BOOT-2026 : signale la 1re frame rendue → le starfield peut lancer son animation
  // sans concurrencer le boot de la constellation.
  if(!animer._pret){ animer._pret=true; try{ window.dispatchEvent(new Event('constel-pret')); }catch(e){} }
}

    // FIXPC-2026 bug2 : écran « Ma vue d'ensemble » + notation — chaînes qui restaient en FR en mode EN.
    // (uppercase = purement CSS → on matche la vraie casse du DOM ; le reverse EN→FR est auto.)
    ['Ce que l\'agent proposait → ce que tu as décidé','What the agent proposed → what you decided'],
    ['Notation exacte par l\'agent','Exact match with the agent'],
    ['Similarité avec l\'agent','Similarity with the agent'],
    ['Tes plus gros désaccords','Your biggest disagreements'],
    ['TA TIER →','YOUR TIER →'],
    ['AGENT ↓','AGENT ↓'],
    ['Avis complémentaire','Additional feedback'],
    ['(optionnel)','(optional)'],
    ['Commentaire libre','Free comment'],   // (déjà présent plus haut ; conservé par sûreté)
    ['Commentaire','Comment'],              // libellés « Commentaire (optionnel) » scindés en 2 nœuds DOM
    // filtre d'axes de la matrice (onglet « Tous »)
    ['Tous','All'],
    // bouton de portee au-dessus du rail des dates (restait en FR en mode EN)
    ['Vue globale','Overview'],
    // cle du tiroir « bilan + filtres » (ecrans < 980px)
    ['Bilan & filtres','Summary & filters'],
    // puce d'axe transverse (harmonisation : l'axe traduit affiche « Cross-cutting »)
    ['Transverse','Cross-cutting'],
    // en-tête : compteur de fils au singulier FR (« 0 fil » / « 1 fil »)
    ['0 fil','0 threads'],
    ['1 fil','1 thread'],
    // placeholders de commentaire (attributs, traduits aussi par swapDomStrings + l'observer).
    // NB : l'observer applique le map en ORDRE DE TABLEAU (pas longest-first) → on fournit AUSSI
    // chaque fragment pour que la traduction soit complète quel que soit le chemin.
    ['ce qui manque, ce qui dérange, ce qui sert','what is missing, what bothers you, what is useful'],
    ['ce qui dérange','what bothers you'],
    ['ce qui sert','what is useful'],
    ['de cette veille','from this brief'],
    ['de cette livraison','from this delivery'],
    ['ce qu\'il faudrait changer la prochaine fois','what to change next time'],
    ['ce que dit cet axe','what this axis says'],
    ['ce que dit ce niveau','what this tier says'],
  ];
  const EN_TO_FR = FR_TO_EN.map(([f,e])=>[e,f]);
  // FIXPC-2026 : copie triée longest-first, calculée une fois, réutilisée par l'observer.
  const FR_TO_EN_SORTED = [...FR_TO_EN].sort((a,b)=>b[0].length-a[0].length);

  // Detect INITIAL language of the loaded data (fr default; if English content detected on core, en)
  function detectInitialLang(){
    // First priority: user preference from localStorage
    const stored = localStorage.getItem('constel-lang');
    if(stored==='en'||stored==='fr') return stored;
    // Second: peek at fetched data via a marker
    // We'll refine below once D is loaded.
    return null;
  }

  let currentLang = detectInitialLang();

  // Language toggle chip
  function buildToggle(){
    const btn = document.createElement('button');
    btn.id = 'lang-toggle';
    btn.setAttribute('aria-label','Toggle language');
    btn.setAttribute('type','button');
    btn.innerHTML = '<span class="globe">🌐</span><span class="code" id="lang-cur">EN</span><span class="alt" id="lang-alt">·FR</span>';
    document.body.appendChild(btn);
    btn.addEventListener('click', ()=>setLang(currentLang==='en'?'fr':'en'));
    updateToggleLabel();
  }
  function updateToggleLabel(){
    const cur=document.getElementById('lang-cur'), alt=document.getElementById('lang-alt');
    if(!cur||!alt)return;
    if(currentLang==='en'){cur.textContent='EN';alt.textContent='·FR';}
    else {cur.textContent='FR';alt.textContent='·EN';}
  }

  // Walk DOM and swap known strings direction (fr→en or en→fr)
  // Un remplacement ne doit jamais mordre a l'interieur d'un mot : « All » ne
  // remplace pas le debut d'« Aller », « Comment » ne se glisse pas dans
  // « Commentaire ». On borne chaque motif par une frontiere de mot quand ses
  // extremites sont alphanumeriques.
  const MOT = "A-Za-z\\u00C0-\\u024F0-9";
  const _rxCache = new Map();
  function rxDe(from){
    let r = _rxCache.get(from);
    if(r) return r;
    const esc = from.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const estMot = c => new RegExp("[" + MOT + "]").test(c);
    const avant = estMot(from[0]) ? "(?<![" + MOT + "])" : "";
    const apres = estMot(from[from.length-1]) ? "(?![" + MOT + "])" : "";
    r = new RegExp(avant + esc + apres, "g");
    _rxCache.set(from, r);
    return r;
  }
  function appliquer(t, map){
    for(const [from, to] of map){
      if(t.indexOf(from) === -1) continue;
      t = t.replace(rxDe(from), to);
    }
    return t;
  }

  function swapDomStrings(map){
    // Applique les remplacements du plus LONG au plus COURT (intention documentée) :
    // sinon une règle générique ('livraison'→'delivery', 'signaux'→'signals') s'applique
    // avant une règle spécifique ('Commentaire sur la livraison', 'signaux lus') et la
    // casse en franglais ('Commentaire sur la delivery', 'signals lus').
    map=[...map].sort((a,b)=>b[0].length-a[0].length);
    // exclude the language toggle itself + tutorial + script/style
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: (n)=>{
        if(!n.textContent||!n.textContent.trim())return NodeFilter.FILTER_REJECT;
        let p = n.parentElement;
        while(p){
          const id=p.id||'';
          if(id==='lang-toggle'||id==='tuto-scrim')return NodeFilter.FILTER_REJECT;
          const tag=p.tagName;
          if(tag==='SCRIPT'||tag==='STYLE')return NodeFilter.FILTER_REJECT;
          p=p.parentElement;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let node, batch=[];
    while(node=walker.nextNode())batch.push(node);
    batch.forEach(n=>{
      const t = appliquer(n.textContent, map);
      if(t!==n.textContent)n.textContent=t;
    });
    // Also swap attributes on interactive elements (title, aria-label, placeholder)
    document.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>{
      if(el.id==='lang-toggle')return;
      ['title','aria-label','placeholder'].forEach(attr=>{
        const v = el.getAttribute(attr);
        if(!v)return;
        const t = appliquer(v, map);
        if(t!==v)el.setAttribute(attr,t);
      });
    });
  }

  // Swap data-level content (findings, axes, resumes) using _en/_fr variants
  // The engine reads D dynamically from window.D or from a fetched copy
  let dataOriginal = null; // frozen snapshot of data as first loaded
  let dataFetched = null;  // our own fetched copy (since main D is module-scoped)

  async function fetchOwnData(){
    // le module a deja les donnees : on les emprunte plutot que de les redemander
    for(let i=0;i<60 && !(window.__constel && window.__constel.donnees);i++)
      await new Promise(r=>setTimeout(r,100));
    const d = window.__constel && window.__constel.donnees && window.__constel.donnees();
    if(d){ dataFetched = d; return d; }
    try{
      const r = await fetch('constellation-data.json',{cache:'no-cache'});
      if(r.ok){ dataFetched = await r.json(); return dataFetched; }
    }catch(_){}
    return null;
  }

  // Given a node/object and a lang, return the language-appropriate string for `field`
  // Fallback: if <field>_<lang> missing, use <field>
  function pick(obj, field, lang){
    if(!obj)return '';
    const k = field+'_'+lang;
    return obj[k]!=null ? obj[k] : (obj[field]||'');
  }

  // Apply bilingual swap to any D-like object in-place (for the main-scope D via DOM re-render)
  // Since we can't directly touch main D (module-scoped), we do DOM-level string swap after render.
  // This is a best-effort layer; for fully robust bilingual data, the render code needs D reload.

  // Intervalles de re-swap lancés au boot (rattrapent le chrome rendu tardivement).
  // Dès que l'utilisateur bascule manuellement, on les stoppe : sinon ils ré-appliquent
  // FR→EN en boucle et écrasent le passage à FR (chrome bloqué en anglais).
  let bootSwapIntervals = [];
  function stopBootSwaps(){ bootSwapIntervals.forEach(clearInterval); bootSwapIntervals = []; }

  // Persist and apply preference
  function setLang(newLang){
    if(newLang===currentLang)return;
    stopBootSwaps();
    const oldLang = currentLang;
    currentLang = newLang;
    localStorage.setItem('constel-lang', newLang);
    document.documentElement.lang = newLang;
    updateToggleLabel();
    // Chrome swap (buttons/labels)
    const map = (oldLang==='fr' && newLang==='en') ? FR_TO_EN :
                (oldLang==='en' && newLang==='fr') ? EN_TO_FR : null;
    if(map) swapDomStrings(map);
    // Findings swap in currently-open panel (if any)
    setTimeout(()=>swapPanelToLang(newLang), 50);
    // Swap the axes labels in the sphere (rendered as .lb.axe elements) via data-cross-lookup
    swapAxesLabelsToLang(newLang);
    // Swap the star (finding) titles on the constellation to the active language
    swapStarTitlesToLang(newLang);
    // ouverte en cadre (constellation d'exemple, profil) : le bandeau du parent suit
    try{ if(window.parent && window.parent !== window)
      window.parent.postMessage({type:'langue', en:(newLang==='en')}, '*'); }catch(e){}
    // le parcours guide se reecrit dans la nouvelle langue, sans changer d'etape
    try{ if(typeof window.__wtRelire === 'function') window.__wtRelire(); }catch(e){}
    swapCoreTitleToLang(newLang);
  }

  // Idempotent + bidirectionnel : on repart TOUJOURS de la source (dataFetched.axes)
  // pour retrouver l'index de chaque label, quelle que soit sa langue courante, puis
  // on écrit la valeur de la langue cible (axes_<lang> si présent, sinon la source).
  // → EN→FR→EN restaure bien l'anglais même sans champ axes_en (source = anglais natif).
  function axisVariantToIndex(){
    if(!dataFetched)return null;
    const src = dataFetched.axes||[];
    if(!src.length)return null;
    const map = {};
    const arrays = [src];
    ['fr','en'].forEach(l=>{const a=dataFetched['axes_'+l];if(a&&a.length===src.length)arrays.push(a);});
    arrays.forEach(arr=>arr.forEach((t,i)=>{const k=(t||'').trim();if(k)map[k]=i;}));
    return {map, src};
  }
  function axisTargetArray(lang){
    if(!dataFetched)return null;
    const src = dataFetched.axes||[];
    const a = dataFetched['axes_'+lang];
    return (a && a.length===src.length) ? a : src;
  }
  function swapAxesLabelsToLang(lang){
    const vi = axisVariantToIndex();
    if(!vi)return;
    const tgt = axisTargetArray(lang);
    document.querySelectorAll('.lb.axe').forEach(el=>{
      const t = el.textContent.trim();
      const idx = vi.map[t];
      if(idx!=null && tgt[idx] && tgt[idx]!==t) el.textContent = tgt[idx];
    });
  }

  // Titres des étoiles (findings) sur la constellation : label = .lb SANS .axe/.core.
  // On retrouve le nœud par n'importe quelle variante de headline, puis on écrit le
  // titre de la langue active (headline_<lang> si dispo, sinon le headline natif).
  // Le titre au centre vient des donnees (`theme`), pas du chrome : sans variante de
  // langue il restait fige, et il repassait en francais a chaque reconstruction.
  function swapCoreTitleToLang(lang){
    if(!dataFetched) return;
    const cible = dataFetched['theme_'+lang] || dataFetched.theme;
    if(!cible) return;
    const variantes = [dataFetched.theme, dataFetched.theme_fr, dataFetched.theme_en]
      .filter(Boolean).map(x=>x.trim());
    document.querySelectorAll('.lb.core').forEach(el=>{
      const t = el.textContent.trim();
      if(variantes.includes(t) && t !== cible) el.textContent = cible;
    });
  }
  function swapStarTitlesToLang(lang){
    if(!dataFetched||!dataFetched.nodes)return;
    document.querySelectorAll('.lb:not(.axe):not(.core)').forEach(el=>{
      const t = el.textContent.trim();
      if(t.length<6)return;
      const node = findNodeByHeadlineText(t);
      if(!node)return;
      const target = node['headline_'+lang] || node.headline;
      if(target && target!==t) el.textContent = target;
    });
  }

  // ------------------------------------------------------------------------
  // Bilingual findings swap: when a panel opens, use pre-translated fields
  // from dataFetched (essentiel_en / essentiel_fr / headline_en / headline_fr).
  // We detect new .ess divs via MutationObserver and swap their innerHTML.
  // ------------------------------------------------------------------------
  function nodeByCidOrId(query){
    if(!dataFetched||!dataFetched.nodes)return null;
    // First: try match by exact id
    for(const n of dataFetched.nodes){if(n.id===query)return n;}
    // Then: by fid uppercase
    const u = query.toUpperCase();
    for(const n of dataFetched.nodes){if((n.fid||'').toUpperCase()===u)return n;}
    // Then: by first heading matching
    return null;
  }
  // Try to identify which node the currently-open panel belongs to.
  // The template renders headline text somewhere near top of `#panel`.
  function currentPanelNodeId(){
    const panel = document.getElementById('panel');
    if(!panel)return null;
    // heuristic: the first h2/h3/h1/large-title in panel contains the headline text
    const title = panel.querySelector('h1,h2,h3,.p-titre,.p-title');
    if(!title)return null;
    const txt = title.textContent.trim();
    if(!dataFetched||!dataFetched.nodes)return null;
    // Match by headline (in either language)
    for(const n of dataFetched.nodes){
      const h = n.headline||''; const he = n.headline_en||''; const hf = n.headline_fr||'';
      if(txt===h||txt===he||txt===hf)return n.id;
    }
    // fallback: contains match
    for(const n of dataFetched.nodes){
      if((n.headline||'').includes(txt.slice(0,40)))return n.id;
    }
    return null;
  }
  // Index nodes by any language variant of their headline (case-insensitive first 60 chars)
  function buildNodeIndex(){
    if(!dataFetched||!dataFetched.nodes)return {};
    const idx = {};
    for(const n of dataFetched.nodes){
      for(const k of ['headline','headline_en','headline_fr']){
        const v = (n[k]||'').trim();
        if(v) idx[v.slice(0,80).toLowerCase()] = n;
      }
    }
    return idx;
  }
  let _nodeIndex = null;
  function nodeIndex(){ if(!_nodeIndex)_nodeIndex=buildNodeIndex(); return _nodeIndex; }
  function findNodeByHeadlineText(txt){
    if(!txt)return null;
    const idx = nodeIndex();
    return idx[txt.slice(0,80).toLowerCase()] || null;
  }
  // Format an essential (with \n\n paragraph separators) to HTML with <p> + <strong>
  function formatEssentialHtml(essential){
    if(!essential)return '';
    return essential.split(/\n\n+/).map(p=>
      '<p>'+p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>'
    ).join('');
  }

  // Swap ALL visible finding content in the panel to the target language:
  // - headline titles (h1/h2/h3/.p-titre)
  // - lead paragraphs
  // - essentials (long .ess / .p-essentiel)
  // Mise en forme d'un paragraphe d'essentiel : __gras__ et *italique*.
  // `**nom**` designe un objet depliable : il est traite par le rendu principal,
  // ici on le rend simplement en gras pour ne pas laisser d'etoiles a l'ecran.
  function typoEssentiel(txt){
    return String(txt)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/__(.+?)__/g,'<strong>$1</strong>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/(?<![\*\w])\*([^\*\n]{2,}?)\*(?!\*)/g,'<em>$1</em>');
  }
  function swapPanelToLang(lang){
    if(!dataFetched)return;
    const panel = document.getElementById('panel');
    if(!panel)return;
    // (A) Swap headline titles
    panel.querySelectorAll('h1, h2, h3, .p-titre, .p-title, .titre').forEach(el=>{
      const t = el.textContent.trim();
      if(t.length<8||t.length>250)return;
      const node = findNodeByHeadlineText(t);
      if(!node)return;
      const target = node['headline_'+lang] || node.headline;
      if(target && target !== t) el.textContent = target;
    });
    // (A bis) Les listes du panneau (vue d'ensemble, panneau d'axe, panneau de tier)
    // rendent les titres dans `.lien-sig .nom` : ce ne sont pas des titres HTML, donc
    // la passe (A) les manquait et l'ecran de navigation restait dans l'autre langue.
    panel.querySelectorAll('.lien-sig .nom, .tlitems .nom, .bloc-finding .nom').forEach(el=>{
      const t = el.textContent.trim();
      if(t.length < 8 || t.length > 250) return;
      const node = findNodeByHeadlineText(t);
      if(!node) return;
      const cible = node['headline_'+lang] || node.headline;
      if(cible && cible !== t) el.textContent = cible;
    });
    // les noms d'AXE en liste suivent axes_<lang>
    (function(){
      const vi = axisVariantToIndex(); const tgt = axisTargetArray(lang);
      if(!vi || !tgt) return;
      panel.querySelectorAll('.lien-axe .nom').forEach(el=>{
        const t = el.textContent.trim(); const i = vi.map[t];
        if(i != null && tgt[i] && tgt[i] !== t) el.textContent = tgt[i];
      });
    })();
    // (B) Swap essentials. The template renders:
    //   <details class="essd" open><summary>Essentiel</summary>
    //     <div class="ess">
    //       <div class="ptit">Le fait</div><p>P1</p>
    //       <div class="ptit">Le mécanisme</div><p>P2</p>
    //       ... × 4
    //     </div>
    //   </details>
    // We replace: <summary> label, each <div class="ptit"> label, and each <p> content.
    const PART_LABELS = { fr: ['Le fait','Le mécanisme','Ce qui compte','Réserves & effet'],
                          en: ['The fact','The mechanism','What matters','Reserves & effect'] };
    const SUMMARY_LABEL = { fr: 'Essentiel', en: 'Essential' };
    panel.querySelectorAll('.essd').forEach(essd=>{
      // Find headline scope
      let scope = essd.closest('.card') || essd.parentElement;
      let head = null;
      // headline is typically outside .essd, in the same .card as an h3 or h2
      const cardTitle = scope?.querySelector('h1,h2,h3,.titre,.p-titre');
      if(cardTitle) head = cardTitle.textContent.trim();
      // fallback: look for the panel-level headline (the first h heading in the whole panel)
      if(!head){
        const gh = panel.querySelector('h1,h2,h3');
        if(gh) head = gh.textContent.trim();
      }
      let node = head ? findNodeByHeadlineText(head) : null;
      if(!node){
        // fallback: match by first paragraph of essential
        const firstP = essd.querySelector('.ess > p');
        if(firstP && dataFetched.nodes){
          const sig = firstP.textContent.trim().slice(0,80).toLowerCase();
          for(const n of dataFetched.nodes){
            for(const k of ['essentiel','essentiel_en','essentiel_fr']){
              const src = (n.fiche||{})[k]||'';
              if(src.toLowerCase().includes(sig)){node=n;break;}
            }
            if(node)break;
          }
        }
      }
      if(!node)return;
      const targetEss = node.fiche?.['essentiel_'+lang] || node.fiche?.essentiel;
      if(!targetEss)return;
      // Split target into paragraphs
      const parts = targetEss.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
      // Update summary label
      const sum = essd.querySelector('summary');
      if(sum) sum.firstChild ? (sum.textContent = SUMMARY_LABEL[lang]||sum.textContent) : null;
      // Update ess div: rewrite ptit labels + p bodies
      const ess = essd.querySelector('.ess');
      if(!ess)return;
      const ptits = ess.querySelectorAll('.ptit');
      const paras = ess.querySelectorAll('p');
      // Case A: same paragraph count → in-place replace
      if(parts.length === paras.length){
        paras.forEach((p,i)=>{
          p.innerHTML = typoEssentiel(parts[i]);
        });
        if(ptits.length === 4 && parts.length === 4){
          const labels = PART_LABELS[lang]||PART_LABELS.fr;
          ptits.forEach((pt,i)=>{pt.textContent = labels[i];});
        }
      }else{
        // Case B: rebuild the .ess innerHTML wholesale
        let html = '';
        parts.forEach((p,i)=>{
          if(parts.length===4){
            const labels = PART_LABELS[lang]||PART_LABELS.fr;
            html += '<div class="ptit">'+labels[i]+'</div>';
          }
          html += '<p>'+typoEssentiel(p)+'</p>';
        });
        ess.innerHTML = html;
      }
    });
    // (C) Swap lead paragraphs
    panel.querySelectorAll('.lead, .p-lead').forEach(el=>{
      const t = el.textContent.trim();
      if(t.length<20||t.length>500)return;
      // match by lead in either lang
      const nodes = dataFetched.nodes||[];
      for(const n of nodes){
        if((n.lead||'').trim()===t||(n.lead_en||'').trim()===t||(n.lead_fr||'').trim()===t){
          const target = n['lead_'+lang]||n.lead;
          if(target && target !== t){ el.textContent = target; break;}
        }
      }
    });
    // (D) Swap resume_livraison if visible
    if(dataFetched['resume_livraison_'+lang]){
      panel.querySelectorAll('.resume, .p-resume, .livraison-resume').forEach(el=>{
        const t = el.textContent.trim();
        if(t===dataFetched.resume_livraison || t===dataFetched.resume_livraison_en || t===dataFetched.resume_livraison_fr){
          el.textContent = dataFetched['resume_livraison_'+lang];
        }
      });
    }
    // (E) Swap axis names anywhere in the panel: breadcrumb header (.meta = "date · Axe"),
    //     axis-view title (h2), axis link buttons. Bidirectionnel via toutes les variantes.
    {
      const src = dataFetched.axes||[];
      if(src.length){
        const tgt = (dataFetched['axes_'+lang] && dataFetched['axes_'+lang].length===src.length)
                    ? dataFetched['axes_'+lang] : src;
        const pairs = [];
        const arrays = [src];
        ['fr','en'].forEach(l=>{const a=dataFetched['axes_'+l];if(a&&a.length===src.length)arrays.push(a);});
        arrays.forEach(arr=>arr.forEach((t,i)=>{ if(t&&tgt[i]&&t!==tgt[i]) pairs.push([t,tgt[i]]); }));
        // dédoublonne + trie du plus long au plus court (évite les collisions partielles)
        const seen=new Set(); const uniq=[];
        pairs.forEach(p=>{const k=p[0]+'␀'+p[1];if(!seen.has(k)){seen.add(k);uniq.push(p);}});
        uniq.sort((a,b)=>b[0].length-a[0].length);
        if(uniq.length){
          const w = document.createTreeWalker(panel, NodeFilter.SHOW_TEXT);
          const tns=[]; let tn; while(tn=w.nextNode())tns.push(tn);
          tns.forEach(n=>{
            let t=n.textContent;
            for(const [from,to] of uniq){ if(t.indexOf(from)!==-1) t=t.split(from).join(to); }
            if(t!==n.textContent)n.textContent=t;
          });
        }
      }
    }
  }

  // MutationObserver: keep translating new nodes as the app renders them
  let observer = null;
  function startObserver(){
    if(observer)return;
    observer = new MutationObserver((mutations)=>{
      // Chrome is ALWAYS French in the template. Swap only when displaying EN.
      if(currentLang==='fr')return;
      // FIXPC-2026 bug2 : trier longest-first (comme swapDomStrings) pour éviter qu'une règle
      // générique ('signaux'→'signals') court-circuite une règle spécifique ('signaux lus'→'findings read').
      const map = FR_TO_EN_SORTED;
      for(const m of mutations){
        for(const n of m.addedNodes){
          if(n.nodeType===Node.TEXT_NODE){
            let t=n.textContent;
            for(const [from,to] of map){if(t.indexOf(from)!==-1)t=t.split(from).join(to);}
            if(t!==n.textContent)n.textContent=t;
          }else if(n.nodeType===Node.ELEMENT_NODE){
            // walk subtree text nodes
            const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
            let tn;
            while(tn=w.nextNode()){
              if(!tn.parentElement||tn.parentElement.id==='lang-toggle')continue;
              let tag=tn.parentElement.tagName; if(tag==='SCRIPT'||tag==='STYLE')continue;
              let t=tn.textContent;
              for(const [from,to] of map){if(t.indexOf(from)!==-1)t=t.split(from).join(to);}
              if(t!==tn.textContent)tn.textContent=t;
            }
            // also attributes
            n.querySelectorAll&&n.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>{
              if(el.id==='lang-toggle')return;
              ['title','aria-label','placeholder'].forEach(attr=>{
                const v=el.getAttribute(attr); if(!v)return;
                let t=v; for(const [from,to] of map){if(t.indexOf(from)!==-1)t=t.split(from).join(to);}
                if(t!==v)el.setAttribute(attr,t);
              });
            });
          }
        }
      }
    });
    observer.observe(document.body, {childList:true, subtree:true, characterData:true});
    // Also observe #panel opens to swap essentials to current lang
    const panel = document.getElementById('panel');
    if(panel){
      const panelObs = new MutationObserver(()=>{
        setTimeout(()=>swapPanelToLang(currentLang), 40);
      });
      panelObs.observe(panel, {childList:true, subtree:true});
    }
  }

  // ========================================================================
  // Boot
  // ========================================================================
  async function boot(){
    // Fetch our own copy of data to detect language
    await fetchOwnData();
    // Priority: explicit `language` field at top-level of the data.
    // Fallback: heuristic on the first essential.
    let sourceLang = 'fr';
    if(dataFetched && dataFetched.language && (dataFetched.language==='en'||dataFetched.language==='fr')){
      sourceLang = dataFetched.language;
    }else if(dataFetched && dataFetched.nodes && dataFetched.nodes.length){
      // count French common words vs English in a bigger sample
      const sample = dataFetched.nodes.slice(0,5).map(n=>
        (n.headline||'')+' '+(n.fiche?.essentiel||'').slice(0,400)).join(' ');
      const fr = (sample.match(/\b(le|la|les|de|des|du|un|une|est|sont|dans|pour|par|avec|sur|qui|que|se|cette|ces|aux|au)\b/gi)||[]).length;
      const en = (sample.match(/\b(the|of|and|to|in|is|are|for|with|on|that|this|these|by|as|from|has|have|be|it)\b/gi)||[]).length;
      const hasFrAcc = /[àâçéèêëîïôûùüÿœ]/i.test(sample);
      sourceLang = (en > fr*1.2 && !hasFrAcc) ? 'en' : 'fr';
    }
    // HONNÊTETÉ FR-only : si AUCUN champ de contenu traduit n'existe dans les données
    // (cas veille IA généraliste — pas de _en/_fr sur axes/findings/essentiels), on ne
    // fabrique PAS de fausse traduction dans le viewer. On force la langue source et on
    // ne construit PAS le bouton de bascule. (La vraie traduction viendra du pipeline.)
    const translatable = hasTranslatedContent();
    if(!translatable){
      currentLang = sourceLang;
      localStorage.removeItem('constel-lang');
      document.documentElement.lang = currentLang;
      startObserver();
      return; // pas de toggle, pas de swap chrome — le contenu reste dans sa langue d'origine
    }
    // If user has no stored preference, default to source lang (no swap needed)
    if(currentLang===null){
      currentLang = sourceLang;
      // do NOT persist yet — let user click toggle to commit
    }
    document.documentElement.lang = currentLang;
        buildToggle();
    // The template's CHROME (buttons/labels/nav) is baked in FRENCH regardless of data.
    // So we always swap chrome to EN when currentLang==='en'.
    // Findings content follows the data's source language (une veille anglaise reste en anglais, une francaise en francais)
    // and gets swapped via bilingual _en/_fr fields.
    if(currentLang === 'en'){
      // Aggressive re-swap: every 300ms for the first 8s catches late-rendered chrome
      const swapIt = ()=>swapDomStrings(FR_TO_EN);
      swapIt();
      let n=0; const iv = setInterval(()=>{swapIt(); if(++n>25) clearInterval(iv);}, 320);
      bootSwapIntervals.push(iv);
    }
    // Contenu (axes + titres d'étoiles) dans la langue active si ≠ source native :
    // le rendu 3D est asynchrone, on ré-applique quelques fois (idempotent).
    if(currentLang !== sourceLang){
      const applyContent = ()=>{ swapAxesLabelsToLang(currentLang); swapStarTitlesToLang(currentLang); swapCoreTitleToLang(currentLang); };
      applyContent();
      let c=0; const ivc = setInterval(()=>{applyContent(); if(++c>25) clearInterval(ivc);}, 320);
      bootSwapIntervals.push(ivc);
    }
    startObserver();
    /* maybeShowTutorial() removed */
  }

  // Vrai ssi au moins un champ de CONTENU traduit existe dans les données.
  function hasTranslatedContent(){
    const d = dataFetched;
    if(!d)return false;
    if((d.axes_en&&d.axes_en.length)||(d.axes_fr&&d.axes_fr.length))return true;
    if(d.resume_livraison_en||d.resume_livraison_fr)return true;
    for(const n of (d.nodes||[])){
      if(n.headline_en||n.headline_fr||n.lead_en||n.lead_fr)return true;
      const f=n.fiche||{};
      if(f.essentiel_en||f.essentiel_fr)return true;
    }
    return false;
  }

  if(document.readyState==='complete' || document.readyState==='interactive'){
    setTimeout(boot, 100);
  }else{
    document.addEventListener('DOMContentLoaded', boot);
  }
})();
</script>

  };
  function t(k){return T[isEn()?'en':'fr'][k];}

  // Step definitions: each step = {key, targetSelector, tooltip position, waitAction}
  // targetSelector: CSS selector for the element to spotlight; null = centered modal
  // position: 'above'|'below'|'left'|'right'|'center' — where the tooltip goes relative to target
  // wait: {event: 'pointerdown'|'wheel'|'click'|'panelopen', on?: selector} — advance on action

  // Removed "rotate" & "zoom" (camera fixed in eval), removed "rate" (target only exists when a card is open).
  const STEPS = ()=>[
    // On lit d'abord la carte (ce qu'est une etoile, un axe, une couche), puis on

    {key:'welcome', target:null, position:'center', wait:null},
    {key:'lang', target:'#lang-toggle', position:'below-left', wait:null, interactif:true},
    {key:'finding', target:'tuto-etoile', position:'bottom-fixed', wait:null,

    {key:'axe', target:'tuto-axe', position:'bottom-fixed', wait:null,

    {key:'tier', target:'tuto-tier', position:'bottom-fixed', wait:null,
     enter:balayerLesNiveaux},
    {key:'coeur',   target:'tuto-coeur',  position:'bottom-fixed',
     wait:{event:'vue', attendu:'core'}},
    {key:'menu',    target:'tuto-menu',   position:'below', enter:ouvrirLEnsemble,
     wait:{event:'vue', attendu:'axe'}},
    {key:'liste',   target:'tuto-liste',  position:'left', enter:ouvrirUneListe,
     wait:{event:'panelopen'}},
    {key:'carte',   target:'tuto-carte',  position:'left', wait:null, enter:ouvrirLaCarte},
    {key:'noter',   target:'tuto-tiers',  position:'left', enter:ouvrirLaCarte,
     wait:{event:'note'}},
    {key:'dire',    target:'tuto-retours',position:'left', wait:null, enter:ouvrirLaCarte},
    {key:'bilan',   target:'#exportbtn', position:'above', interactif:true,
     wait:{event:'ouvertBilan'}},
    {key:'envoi',   target:'tuto-bilan', position:'bottom-fixed', enter:ouvrirLeBilan, wait:null},
    {key:'finish', target:'tuto-fin', position:'above', wait:null},
  ];

  let idx = 0, currentStep = null, cleanupFns = [];
  let suiviTrou = 0;                 // boucle qui fait suivre le trou a la scene
  // Deux entrees peuvent lancer le parcours (demarrage auto, bouton « ? », page de
  // demonstration). Sans drapeau partage, la seconde reconstruit l'overlay et renvoie
  // le lecteur a l'etape 1 en plein milieu.
  window.__wtEnCours = window.__wtEnCours || false;
  let ouvertParLeTuto = false;       // le tuto a-t-il ouvert le panneau lui-meme ?

  // Le tuto montre ce dont il parle : il pose les memes variables de surbrillance
  // que le survol d'un panneau (hiliId / hiliAxe / hiliTier), lues par la boucle de rendu.
  function tutoFeuilles(){
    try { return (window.__constel&&window.__constel.feuilles()) || []; } catch(e){ return []; }
  }
  let tutoEtoile = null;                 // le noeud montre a l'etape « un finding »
  function tutoUneEtoile(){
    if(tutoEtoile) return tutoEtoile;
    // un noeud au hasard, mais visible a l'ecran (sinon on cadrerait dans le vide)
    const f = tutoFeuilles().slice();
    for(let i=f.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [f[i],f[j]]=[f[j],f[i]]; }
    // visible ET hors de la bande basse ou s'ancre la bulle du tuto, sinon le
    // cercle se retrouve cache derriere elle
    const degage = d=>{ const p=window.__constel.ecran(d.id);
      return p && p.y < innerHeight*0.55 && p.y > 90 && p.x > 60 && p.x < innerWidth-60; };
    tutoEtoile = f.find(degage) || f.find(d=>window.__constel.ecran(d.id)) || f[0] || null;

  }
  function tutoUnAxe(){
    const c={}; tutoFeuilles().forEach(d=>{ if(d.axe) c[d.axe]=(c[d.axe]||0)+1; });

    return e.length ? e[0][0] : null;

  // Les quatre niveaux s'allument a tour de role : une couche fixe ne dit pas
  // qu'il y en a quatre, ni qu'elles se lisent du coeur vers le bord.
  let balayage = 0;
  function balayerLesNiveaux(){
    const NIV = ['Excellent','Cool','Intéressant','Neutre','Bof','Inutile'];
    let i = 0;
    clearInterval(balayage);
    const pas = ()=>{ if(window.__constel) window.__constel.hili({tier:NIV[i % NIV.length]}); i++; };
    pas(); balayage = setInterval(pas, 1100);
  }
  // la liste des signaux d'un axe : l'etape d'avant y a mene, on la montre ouverte
  function ouvrirUneListe(){
    const C = window.__constel;
    if(!C) return;
    if(C.vue() === 'axe') return;
    const a = tutoUnAxe();
    const lien = [...document.querySelectorAll('#panel .lien-axe')]
      .find(b => !a || (b.innerText||'').trim().startsWith(a.slice(0, 12)));
    if(lien) lien.click();
  }
  function zoneListe(){
    const p = panneau(); if(!p) return null;
    // une ligne de liste, c'est la bande de niveau coloree PLUS le signal : cadrer les
    // seuls liens coupait la bande a gauche et laissait le titre de section dehors.
    const rangs = [...p.querySelectorAll('.tlrow')];
    const liens = [...p.querySelectorAll('.lien-sig')];

  function construireMasque(){
    if(masque) return masque;

    masque.id='wt-masque';
    trou = document.createElementNS(NS,'path'); trou.setAttribute('fill-rule','evenodd');
    trou.setAttribute('class','wt-voile');   // « tout sauf la forme » : sert aussi de bloqueur

    document.body.appendChild(masque);

  const d_poly = pts => pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' Z';
  function dessinerTrou(boucles){
    if(!currentStep) return false;            // tuto termine : on ne perce plus rien
    construireMasque();
    if(!boucles || !boucles.length){ masque.style.display='none'; voile(false); return false; }
    const W=innerWidth, H=innerHeight;
    masque.setAttribute('viewBox','0 0 '+W+' '+H);

  // un rectangle arrondi, pour les cibles d'interface
  function boucleRect(r, rad){
    const x0=r.left, y0=r.top, x1=r.right, y1=r.bottom, k=Math.min(rad, (x1-x0)/2, (y1-y0)/2);
    const pts=[]; const coin=(cx,cy,a0,a1)=>{ for(let i=0;i<=8;i++){ const a=a0+(a1-a0)*i/8;
      pts.push([cx+Math.cos(a)*k, cy+Math.sin(a)*k]); } };
    coin(x1-k,y0+k,-Math.PI/2,0); coin(x1-k,y1-k,0,Math.PI/2);

    return pts;
  }
  function boucleCercle(cx,cy,r){ const pts=[]; for(let i=0;i<=44;i++){ const a=i/44*Math.PI*2;

  // Le tuto ouvre lui-meme la carte : sans elle, les etapes suivantes n'auraient

  function bilanOuvert(){

  function zoneBilan(){

  // une zone qui englobe plusieurs elements, avec leur intitule
  function unionDe(els){
    const r0 = els.filter(Boolean).map(e=>e.getBoundingClientRect()).filter(r=>r.width>2);
    if(!r0.length) return null;
    const r = {left:Math.min(...r0.map(x=>x.left))-8, top:Math.min(...r0.map(x=>x.top))-8,
               right:Math.max(...r0.map(x=>x.right))+8, bottom:Math.max(...r0.map(x=>x.bottom))+8};

  function boutonsTier(){

  function zoneRetours(){

  function findTarget(sel){
