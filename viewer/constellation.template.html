<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constellation</title>
<style>
  :root{--bg:#0b1220;--ink:#eaf0fb;--muted:#93a3bf;--faint:#5f708f;--card:#131f36;--line2:#33456a;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--accent:#7fb0ff;}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:13px 22px;background:linear-gradient(180deg,rgba(11,18,32,.96),rgba(11,18,32,.55));
    backdrop-filter:blur(4px);border-bottom:1px solid #1c2942;user-select:none;pointer-events:none}
  header .brand{font-weight:700;font-size:15px;color:#fff;display:inline-flex;align-items:center;gap:10px;
    text-decoration:none;pointer-events:auto}
  header .hdr-logo{height:28px;width:auto;display:block;filter:drop-shadow(0 0 6px rgba(127,176,255,.25));transition:filter .18s}
  header .brand:hover .hdr-logo{filter:drop-shadow(0 0 10px rgba(127,176,255,.55))}
  header h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  header .sub{font-size:12.5px;color:var(--muted)}
  header .ttl{display:flex;align-items:baseline;gap:9px;min-width:0}
  header .ttl .sub::before{content:"·";margin-right:8px;color:var(--faint)}

  header .rt{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;line-height:1.4}
  header .hdr-profil{margin-left:16px;align-self:center;font-size:12.5px;font-weight:600;color:#9ec5ff;
    text-decoration:none;border:1px solid rgba(127,176,255,.4);padding:5px 12px;border-radius:8px;
    pointer-events:auto;white-space:nowrap}
  header .hdr-profil:hover{background:rgba(127,176,255,.15);color:#fff}

  /* mode vitrine : plus de chrome, plus de curseur de manipulation */
  html.embed header,html.embed #nav,html.embed #helpbtn,html.embed #keys,
  html.embed #recentrer,html.embed aside,html.embed #filname{display:none!important}
  html.embed #gl{cursor:default}
  html.embed .lb{pointer-events:none}

  #gl{position:fixed;inset:0;z-index:1;display:block;cursor:grab;touch-action:none}
  #gl.grabbing{cursor:grabbing}
  #lab{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}

  .lb{font-size:11.5px;line-height:1.3;color:#c3d2ee;white-space:nowrap;text-shadow:0 1px 7px rgba(0,0,0,.95);
    transform:translateX(12px);max-width:260px;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s,color .15s;
    pointer-events:auto;cursor:pointer;padding:3px 6px;margin:-3px -6px;border-radius:6px;
    background:rgba(6,10,20,.72);box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .lb:hover,.lb.survol{color:#fff;background:rgba(127,176,255,.20);font-weight:600}
  .lb.survol{box-shadow:0 0 0 1px rgba(127,176,255,.4);border-radius:6px}
  .lb.vide{pointer-events:none}
  /* un nom d'axe ne se coupe pas : il revient a la ligne. Les traductions sont plus
     longues que l'original, et une etiquette tronquee ne dit plus de quoi il s'agit. */
  .lb.axe{font-weight:700;font-size:13.5px;letter-spacing:.01em;color:#eef3fb;border:1px solid transparent;
    white-space:normal;max-width:230px;text-align:center;line-height:1.2;overflow:visible;
    text-overflow:clip;
    /* SECTIONSEP-2026 : label d'axe ancré par une pastille sombre + halo -> chaque section se repère mieux */
    padding:2px 9px;border-radius:11px;background:rgba(10,16,30,.5);
    box-shadow:0 0 0 1px rgba(120,150,210,.18);text-shadow:0 1px 6px rgba(0,0,0,.85)}
  .lb.core{transform:translate(-50%,22px);text-align:center;font-size:17px;font-weight:800;color:#fff;
    letter-spacing:.01em}
  .lb.core small{display:block;font-size:10px;font-weight:500;color:var(--muted);
    letter-spacing:.13em;text-transform:uppercase;margin-bottom:2px}
  /* labels des anneaux tiers (Excellent / Cool / Intéressant / Neutre / Bof / Inutile) */
  /* date d'une livraison : nomme la couche quand son decor est masque */
  .lb-date{font:600 11px/1 var(--sans);color:#6f86ad;letter-spacing:.08em;white-space:nowrap;
    background:rgba(6,10,20,.7);padding:3px 8px;border-radius:6px;pointer-events:none;opacity:.75}
  .lb-date.active{color:#cfe0ff;opacity:1;box-shadow:0 0 0 1px rgba(147,174,222,.35)}
  .lb-tier{color:#8397ba;font:600 12px/1 var(--sans);opacity:.75;letter-spacing:.04em;
    white-space:nowrap;pointer-events:auto;
    /* pastille sombre : l'etiquette doit rester lisible par-dessus les secteurs teintes */
    background:rgba(6,10,20,.78);padding:3px 8px;border-radius:7px;
    box-shadow:0 1px 6px rgba(0,0,0,.45)}

  /* La barre de livraison se decale au-dessus du bandeau de consentement (bas de fenetre,
     z-index maximal) : sinon il la recouvre et on ne peut plus changer de livraison.
     --signaler-bas : la hauteur que la pastille de signalement doit laisser libre. */
  :root{--signaler-bas:92px}
  #nav{position:fixed;left:50%;bottom:calc(18px + var(--ph-bandeau,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;
    gap:10px;padding:8px 12px;border-radius:15px;background:rgba(10,17,30,.9);border:1px solid #23324e;
    backdrop-filter:blur(9px);box-shadow:0 12px 40px rgba(0,0,0,.55);max-width:min(920px,calc(100vw - 300px));user-select:none}
  #nav .arw{width:32px;height:32px;flex:0 0 auto;border-radius:9px;border:1px solid #2b3b59;
    background:rgba(19,31,54,.9);color:var(--ink);font-size:15px;cursor:pointer;display:flex;
    align-items:center;justify-content:center}
  #nav .arw:hover:not(:disabled){border-color:var(--accent);color:#fff}
  #nav .arw:disabled{opacity:.3;cursor:default}
  /* une seule livraison : navigation sans objet → flèches masquées, date = étiquette */
  #nav.mono .arw{display:none}
  #nav.mono #rail{justify-content:center}
  #nav.mono .stop{pointer-events:none;cursor:default}
  #rail{position:relative;display:flex;align-items:center;flex:1;overflow-x:auto;padding:2px}
  #rail::-webkit-scrollbar{height:0}
  .stop{flex:1 1 0;min-width:62px;min-height:38px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:none;border:0;color:var(--muted);font:650 13px var(--sans);border-radius:9px;
    padding:6px 4px;transition:color .14s,background .14s}
  .stop:hover{color:var(--ink);background:rgba(127,176,255,.09)}
  .stop.on{color:#fff;background:rgba(127,176,255,.17);box-shadow:inset 0 0 0 1px rgba(127,176,255,.45)}

  #helpbtn{position:fixed;left:20px;bottom:20px;z-index:31;width:34px;height:34px;border-radius:10px;
    border:1px solid #2b3b59;background:rgba(19,31,54,.92);color:var(--muted);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  #helpbtn:hover{border-color:var(--accent);color:#fff}
  #keys{position:fixed;left:20px;bottom:64px;z-index:31;font-size:11.5px;color:#b9c8e4;
    background:rgba(10,17,30,.94);border:1px solid #23324e;border-radius:12px;padding:11px 14px;line-height:1.95;
    backdrop-filter:blur(6px);user-select:none}
  #keys[hidden]{display:none}
  #helpbtn,#keys{display:none!important} /* helper masque nav verrouillee */
  #keys b{color:var(--ink);font-weight:600;background:#1a2740;border:1px solid #2b3b59;border-radius:5px;
    padding:1px 6px;font-size:10.5px;margin-right:3px;display:inline-block;min-width:19px;text-align:center}
  #keys .r{display:block;white-space:nowrap}
  #keys .sep{display:block;height:7px}

  html.embed #exportbtn{display:none!important}
  #exportbtn{position:fixed;left:18px;bottom:calc(20px + var(--ph-bandeau,0px));z-index:31;padding:9px 15px;border-radius:11px;
    border:1px solid #2b3b59;background:rgba(19,31,54,.92);color:var(--ink);font-size:12.5px;font-weight:600;
    cursor:pointer;opacity:1;transition:opacity .18s,border-color .18s}
  #exportbtn:hover{opacity:1;border-color:var(--accent)}
  #exportbtn.pret{background:rgba(45,212,191,.22);border-color:#2dd4bf;color:#eafaf7;opacity:1;font-weight:700}
  html.pub .evaluation, html.pub .pouce, html.pub #exportbtn, html.pub #barwrap, html.pub .eval-sep{display:none!important} /* mode publish = lecture seule, pas de notation */

  #filname{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:22;opacity:0;transition:opacity .12s;
    font-size:13px;font-weight:600;color:var(--ink);background:rgba(15,26,46,.95);border:1px solid #33456a;
    border-radius:999px;padding:7px 16px;pointer-events:none;max-width:72vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.45)}

  aside{position:fixed;top:0;right:0;bottom:0;width:min(var(--pw,min(392px,92vw)),94vw);z-index:34;background:rgba(13,23,41,.97);
    backdrop-filter:blur(8px);border-left:1px solid #1c2942;overflow:hidden;
    display:flex;flex-direction:column;   /* FIXPC-2026 bug1 : scroll DANS #pbody, le bouton fermer + le pied ne défilent jamais */
    padding:60px clamp(13px,4.5cqw,22px) 30px;
    container-type:inline-size;   /* les tailles internes se calent sur la largeur du panneau */
    transform:translateX(101%);transition:transform .22s}
  aside.on{transform:none}
  /* FIXPC-2026 : la zone de contenu scrolle seule ; le header (bouton fermer, absolu) et le pied restent fixes */
  aside #pbody{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  /* ligne de lecture bornee quand la fiche est elargie a la souris : au-dela de ~62 signes
     par ligne, l'oeil perd le debut de la ligne suivante (mesure : 84 signes a 720px). */
  @media (min-width:701px){ aside #pbody{max-width:62ch;margin-left:auto;margin-right:auto} }
  aside #pfoot{flex:0 0 auto}
  aside #pfoot:empty{display:none}
  /* FIXPC-2026 bug4 : barre de notation sticky en bas du panneau (visible sans scroller) */
  aside .note-sticky{margin:0 calc(-1*clamp(13px,4.5cqw,22px)) -30px;
    padding:9px clamp(13px,4.5cqw,22px) calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(11,19,35,.99) 62%,rgba(11,19,35,.86));
    border-top:1px solid #2b3b59;box-shadow:0 -8px 22px rgba(4,9,18,.5)}
  aside .note-sticky .nst-lab{font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
  aside .note-sticky .nst-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  aside .note-sticky button{cursor:pointer;border-radius:8px;padding:9px 4px;font:700 11.5px/1 var(--sans);transition:.12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  aside .pgrab{display:none}
  aside.redim{transition:none}
  body.redim{user-select:none}
  .resizer{position:fixed;top:0;bottom:0;right:var(--pw,min(392px,92vw));width:11px;margin-right:-5px;
    z-index:36;cursor:ew-resize;touch-action:none;display:none}
  aside.on ~ .resizer{display:block}
  .resizer::before{content:"";position:absolute;top:50%;left:4px;width:3px;height:46px;margin-top:-23px;border-radius:3px;background:#33456a;transition:background .15s}
  .resizer:hover::before,body.redim .resizer::before{background:var(--accent)}
  html.embed .resizer{display:none!important}
  aside h2{margin:4px 0 9px;font-size:clamp(15px,5.3cqw,22px);line-height:1.3;font-weight:700;letter-spacing:-.01em}
  aside .meta{font-size:clamp(10.5px,3.5cqw,13px);color:var(--muted);margin-bottom:16px;display:flex;flex-wrap:wrap;
    align-items:center;gap:8px}
  aside a.src-url{display:block;width:fit-content;max-width:100%;margin:-10px 0 15px;font-size:11.5px;
    color:var(--axe,#7fb0ff);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  aside a.src-url:hover{text-decoration:underline;text-underline-offset:2px}
  aside .srcs{margin:-6px 0 15px;border-left:2px solid var(--axe,#7fb0ff);padding-left:10px}
  aside .srcs-t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
  aside a.srcs-i{display:flex;gap:8px;align-items:baseline;padding:4px 0;text-decoration:none;color:inherit}
  aside a.srcs-i:hover .srcs-h{text-decoration:underline;text-underline-offset:2px}
  aside .srcs-n{flex:0 0 auto;font-size:10px;opacity:.5;min-width:12px}
  aside .srcs-c{display:flex;flex-direction:column;min-width:0}
  aside .srcs-h{font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
  aside .srcs-m{font-size:10.5px;opacity:.55;margin-top:1px;overflow-wrap:anywhere}
  aside .etat{font-size:13.5px;line-height:1.66;color:#dbe4f5;margin-bottom:16px}
  .ev-titre .opt{font-weight:400;color:var(--faint);font-size:.82em;letter-spacing:0;text-transform:none}
  .sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:16px 0 8px;font-weight:700}
  .ent{padding:8px 0 8px 12px;border-left:2px solid #26344f;margin-bottom:3px}
  .ent .d{font-size:11px;color:var(--faint)}
  .ent .r{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
  .ent .c{font-size:12.5px;line-height:1.5;margin-top:3px;color:#d3ddf0}
  .ent.lienf{cursor:pointer;border-radius:0 8px 8px 0;transition:background .12s}
  .ent.lienf.vise{background:rgba(45,212,191,.14);border-left-color:#2dd4bf}
  .ent.lienf .num{display:inline-block;min-width:15px;height:15px;line-height:15px;
    text-align:center;border-radius:4px;background:#22334f;color:#9ec5ff;
    font-weight:700;font-size:10px;margin-right:3px}
  .renvoi{display:inline-block;min-width:15px;padding:0 3px;margin:0 1px;
    vertical-align:2px;border:0;border-radius:4px;background:#22334f;color:#9ec5ff;
    font:700 10px/15px system-ui,sans-serif;cursor:pointer}
  .renvoi:hover{background:#2dd4bf;color:#0b1220}
  .ent.lienf:hover{background:rgba(45,212,191,.10);border-left-color:#2dd4bf}
  .tj{padding:9px 11px;border-radius:8px;margin-bottom:7px;font-size:12.5px;line-height:1.55}
  .tj.realisee{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.35)}
  .tj.infirmee{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35)}
  .tj.trop_tot{background:rgba(147,163,191,.08);border:1px solid #2b3b59}
  .tj .v{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:4px}
  .tj.realisee .v{color:#34d399}.tj.infirmee .v{color:#f87171}.tj.trop_tot .v{color:var(--muted)}
  /* FIXPC-2026 bug1 : bouton « ‹ Retour » en HAUT-GAUCHE du panneau sur desktop → il ne passe plus
     SOUS le toggle FR/EN + « ? » (chrome fixe top-right, z-index 35) qui le rendaient inutilisable à la souris.
     z-index 35 pour rester cliquable au-dessus du contenu. (Mobile : repassé à droite plus bas.) */
  aside .x{position:absolute;top:13px;left:14px;right:auto;z-index:35;width:auto;height:32px;padding:0 13px;font-size:12.5px;font-weight:600;border-radius:9px;border:1px solid #2b3b59;
    background:rgba(19,31,54,.9);cursor:pointer;color:var(--muted);font-size:17px;display:flex;
    align-items:center;justify-content:center}
  aside .x:hover{color:#fff;border-color:var(--accent)}
  /* --- carte fusionnee : tags, rapport de fond, commentaire (theme nuit) --- */
  aside .tags{margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px}
  aside .tag{font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
  aside .tag.rare{border-color:#7fb0ff;color:#bcd4ff}
  aside .tag.deg{border-color:#c99a3a;color:#f0cd82}
  aside .card a.srclien{color:var(--accent);font-size:12px;text-decoration:none;border-bottom:1px solid rgba(127,176,255,.35)}
  aside .fond{margin-top:24px;border-top:2px solid #3a4f78;padding-top:4px}
  aside .fond>summary{cursor:pointer;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;padding:10px 2px;
    color:#cfe0ff;font-weight:700;list-style:none}
  aside .fond>summary::before{content:"▸";color:var(--accent);font-size:12px}
  aside .fond[open]>summary::before{display:inline-block;transform:rotate(90deg)}
  aside .fond>summary::-webkit-details-marker{display:none}
  aside .fond>summary:hover{color:var(--accent)}
  aside .fond[open]>summary{color:var(--accent);margin-bottom:10px}
  aside .fond-x{font-size:clamp(12px,3.8cqw,14.5px);line-height:1.66;color:#d3ddf0;max-height:52vh;overflow:auto;padding-right:6px}
  aside .fond-x p{margin:0 0 11px}
  aside .fond-x h2{font-size:13.5px;margin:16px 0 6px;color:#eaf0fb;font-weight:700;text-transform:none;letter-spacing:0}
  aside .fond-x h3{font-size:12.5px;margin:13px 0 5px;color:#cdd8ec;font-weight:700;text-transform:none;letter-spacing:0}
  aside .fond-x strong{color:#fff;font-weight:650}
  aside .fond-x code{background:rgba(127,176,255,.13);padding:1px 5px;border-radius:4px;font-size:12px}
  aside .fond-x .tbl{font:11.5px ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;color:var(--muted);margin:4px 0}
  aside .fond-x li{margin:2px 0 2px 4px;list-style:none}
  /* essentiel replié par défaut (2026-07-29) */
  aside .essd{margin-top:2px}
  aside .essd>summary{cursor:pointer;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;padding:8px 2px;color:var(--muted);list-style:none;font-weight:600}
  aside .essd>summary::before{content:"▸";color:var(--accent);font-size:12px}
  aside .essd[open]>summary::before{display:inline-block;transform:rotate(90deg)}
  aside .essd>summary::-webkit-details-marker{display:none}
  aside .essd>summary:hover{color:var(--accent)}
  aside .essd[open]>summary{color:var(--accent);margin-bottom:6px}
  aside .ess .ptit{font:700 10px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--axe,var(--accent));opacity:.85;margin:13px 0 2px}
  aside .ess .ptit:first-child{margin-top:2px}
  /* évaluation avancée repliée (Likert + source) — 2026-07-29 */
  aside .avance{margin-top:16px;border-top:1px solid #24334f;padding-top:2px}
  aside .avance>summary{cursor:pointer;font-size:12.5px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;padding:9px 2px;color:var(--faint);list-style:none;font-weight:600}
  aside .avance>summary::before{content:"▸";color:var(--accent);font-size:12px}
  aside .avance[open]>summary::before{display:inline-block;transform:rotate(90deg)}
  aside .avance>summary::-webkit-details-marker{display:none}
  aside .avance>summary:hover{color:var(--accent)}
  aside .avance>.evaluation:first-of-type{margin-top:8px}
  /* séparateur net contenu ↔ évaluation — 2026-07-29 */
  aside .eval-sep{display:flex;align-items:center;gap:12px;margin:26px 0 8px}
  aside .eval-sep::before,aside .eval-sep::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#3a4f78 40%,#3a4f78 60%,transparent)}
  aside .eval-sep span{font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  aside .commentaire{margin-top:14px}
  aside .commentaire label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-bottom:6px;font-weight:700}
  aside .commentaire textarea{width:100%;min-height:60px;padding:10px;border-radius:9px;border:1px solid var(--line2);
    background:rgba(11,18,32,.6);color:var(--ink);font:clamp(12px,3.8cqw,14.5px)/1.55 var(--sans);resize:vertical}
  aside .commentaire textarea:focus{border-color:var(--accent);outline:none}
  /* commentaire libre DANS le bilan (hors aside) : carte propre facon wizard, sinon non-stylee */
  #fbmodal .commentaire{margin-top:0;background:#0c1526;border:1px solid #22314e;border-radius:14px;padding:16px 18px}
  #fbmodal .commentaire label{display:block;font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:#8ea5c8;margin-bottom:10px}
  #fbmodal .commentaire textarea{width:100%;min-height:120px;padding:13px 14px;border-radius:10px;border:1px solid #2b3b59;background:#0a1120;color:#dbe4f5;font:14px/1.6 var(--sans);resize:vertical;box-sizing:border-box}
  #fbmodal .commentaire textarea:focus{border-color:#2dd4bf;outline:none;box-shadow:0 0 0 3px rgba(45,212,191,.12)}
  #fbmodal .commentaire textarea::placeholder{color:#5b6e8f}

  /* =========================================================
     MOBILE — bloc consolidé
     Déclenché sur : (a) viewport étroit ≤ 700px OU (b) paysage bas (≤ 500px de haut)
     OU (c) device tactile sans souris (couvre les tablettes / iPad en portrait).
     - header compact, nav axes plein largeur, aside en bottom-sheet
     - touch targets ≥ 44px, inputs 16px (anti-zoom iOS)
     - dvh + safe-area pour iOS notch/home-bar
     ========================================================= */
  @media (max-width: 700px), (orientation: landscape) and (max-height: 500px){
    html,body{height:100dvh}
    /* header compact : juste logo + titre + bouton profil */
    header{padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));
      padding-left:calc(12px + env(safe-area-inset-left));
      padding-right:calc(106px + env(safe-area-inset-right));gap:8px;
      flex-wrap:wrap;row-gap:2px}
    header .hdr-logo{height:20px}
    header h1{font-size:14px}
    /* MOBILE-2026 : on n'efface plus l'identite de la page. Le nom de la veille reste sur la
       1re ligne, le compteur de signaux et « Mon profil » passent sur une 2e ligne. La bande
       de droite (106px, cf. padding-right ci-dessus) est reservee au chip FR/EN, en fixed. */
    header .brand{order:1;flex:0 0 auto}
    header .ttl{order:2;min-width:0;overflow:hidden;flex:1 1 auto;margin-right:0}
    header .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header .ttl .sub::before{content:"";margin-right:0}
    header::after{content:"";order:3;flex:0 0 100%;height:0}
    header .sub{display:block;font-size:11.5px;line-height:1.25;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    header .rt{display:block!important;order:4;flex:0 1 auto;min-width:0;margin-left:0;
      font-size:11.5px;line-height:1.25;text-align:left;padding-right:0!important;
      max-width:none!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* « Mon profil » n'est plus supprime : il descend sur la 2e ligne, hors de la zone
       occultee par le chip langue. Le masquer retirait une fonction entiere du produit. */
    header .hdr-profil{display:inline-flex!important;align-items:center;order:5;flex:0 0 auto;
      margin:0 0 0 auto!important;min-height:30px;padding:4px 11px;border-radius:999px;
      font-size:11.5px;white-space:nowrap;background:rgba(19,31,54,.75);pointer-events:auto}

    /* nav axes plein largeur ancré au bas, taille tactile */
    #nav{left:0;right:0;bottom:var(--ph-bandeau,0px);transform:none;max-width:none;border-radius:0;
      border-left:0;border-right:0;border-bottom:0;padding:6px 8px;
      padding-bottom:calc(6px + env(safe-area-inset-bottom));gap:6px}
    #nav .arw{width:44px;height:44px;font-size:17px}
    #rail{gap:4px;scroll-snap-type:x proximity}
    #rail .stop{scroll-snap-align:center}
    .stop{min-height:44px;min-width:64px;padding:8px 6px;font-size:13px}

    /* aside en bottom-sheet plein écran, avec grab-handle & arrondi */
    aside{width:100vw!important;left:0;right:0;top:0;bottom:0;max-height:100dvh;
      padding:calc(56px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));
      padding-left:calc(16px + env(safe-area-inset-left));
      padding-right:calc(16px + env(safe-area-inset-right));
      transform:translateY(101%);border-left:0;border-top-left-radius:16px;border-top-right-radius:16px;
      overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    aside.on{transform:none}
    /* MOBILE-2026 : la poignee dessinee ici etait un leurre — aucun geste ne lui etait
       rattache. Elle est remplacee par un VRAI bouton (.pgrab) qui REPLIE la feuille au lieu
       de la fermer : on revoit la constellation (et l'etoile qui a change d'anneau), la
       lecture reprend ou elle en etait. */
    aside::before{display:none}
    /* le contenu defile SOUS le bouton « Retour » et le chip de langue : masque opaque en
       haut de la feuille, sinon le texte se fait trancher par deux boutons semi-transparents */

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const PALETTE=["#2dd4bf","#818cf8","#f472b6","#fbbf24","#4ade80","#38bdf8","#f87171","#c084fc","#fb923c","#34d399","#a78bfa","#e879a9","#facc15","#22d3ee"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtd=s=>{const p=String(s).split('-');return p[2]+'/'+p[1];};
const DZ=1500;
/* mode vitrine : la constellation cadrée en enfilade, sans commandes — utilisé par l'accueil */
const EMBED=(new URLSearchParams(location.search)).get('embed')==='1';
if(EMBED)document.documentElement.classList.add('embed');
/* ANTIOVERLAP-2026 : hook de test non-intrusif (positions+tailles reelles des noeuds), inactif sans ?ovtest=1 */
const OVTEST=(new URLSearchParams(location.search)).get('ovtest')==='1';
if(OVTEST)window.__OVNODES=[];
/* device tactile sans souris : détection utilisée pour élargir le raycasting (viser),
   les marges de labels d'axe (distanceFit) et signalée au CSS via html.tactile */
const TACTILE=matchMedia('(hover: none) and (pointer: coarse)').matches;
/* MOBILE-2026 : meme condition que les media queries mobiles, cote JS. */
const ETROIT=()=>innerWidth<=700||(innerHeight<=500&&innerWidth>innerHeight);
if(TACTILE){
  document.documentElement.classList.add('tactile');
  /* sur mobile, focus dans une textarea de l'aside → le clavier virtuel iOS/Android
     couvre le champ. On centre le champ après un délai qui laisse le clavier apparaître. */
  addEventListener('focusin',ev=>{
    const t=ev.target;
    if(!t||!t.matches||!t.matches('textarea,input[type=text],input[type=search]'))return;
    if(!t.closest('aside,#fbmodal'))return;
    setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},320);
  });
}
let orbA=0;

let D=null,AXC={},AXORDER=[],ANG={},SECT={},POS={},liensNotes=[],active=0,hiFil=null;
let BAR=+(localStorage.getItem("constel-bar"))||7; const KEEPCOL=new THREE.Color(0xffcf5c);
let scene,cam,rnd,lab,ctl,ray,pointer;
const etoiles=[],liens=[],plans=[];
// profondeur de chaque livraison : espacée proportionnellement au TEMPS réel
// entre les runs (écart en jours → distance), normalisée entre DZMIN et DZMAX.
const DZMIN=800, DZMAX=3200;
let ZBYRUN=[];
function computeZ(){
  const N=D.runs.length; ZBYRUN=new Array(N).fill(0);
  if(N<=1) return;
  const day=86400000;
  const t=D.runs.map(s=>{const m=/(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;});
  const gaps=[]; for(let i=1;i<N;i++){ let g=(t[i]-t[i-1])/day; gaps.push(isFinite(g)&&g>=0?g:NaN); }
  const valid=gaps.filter(g=>isFinite(g));
  const gmin=valid.length?Math.min(...valid):1, gmax=valid.length?Math.max(...valid):1;
  const norm=g=>{ if(!isFinite(g)) return DZ; if(gmax<=gmin) return (DZMIN+DZMAX)/2;
    return DZMIN+(g-gmin)/(gmax-gmin)*(DZMAX-DZMIN); };
  ZBYRUN[N-1]=0;
  for(let i=N-2;i>=0;i--) ZBYRUN[i]=ZBYRUN[i+1]-norm(gaps[i]);
}
const zPlane=ri=>ZBYRUN[ri]!=null?ZBYRUN[ri]:-(D.runs.length-1-ri)*DZ;

function charger(){
  document.getElementById('erreur').classList.remove('on');
  document.getElementById('loading').style.display='flex';
  fetch('constellation-data.json',{cache:'no-cache'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(d=>{D=d;CLE='constel-notes-'+D.watch+'-'+(D.runs&&D.runs[0]||'run');CLE_AXES='constel-profil-'+D.watch+'-'+(D.runs&&D.runs[0]||'run');Object.keys(STORE).forEach(k=>delete STORE[k]);try{Object.assign(STORE,JSON.parse(localStorage.getItem(CLE)||'{}'))}catch(e){}VUS.clear();Object.keys(STORE).forEach(k=>{if(k.indexOf('vu::')===0)VUS.add(k.slice(4));});try{localStorage.removeItem('constel-notes-ai-watch-run');localStorage.removeItem('constel-profil-ai-watch-run');}catch(e){}demarrer();})
    .catch(e=>{
      document.getElementById('loading').style.display='none';
      document.getElementById('erreurtxt').textContent="Données indisponibles ("+e.message+").";
      document.getElementById('erreur').classList.add('on');
    });
}
document.getElementById('reessayer').onclick=charger;
charger();

async function demarrer(){
  document.getElementById('loading').style.display='none';
  // session distante / navigateur vierge : si aucune note locale, charger un preset
  // (1) inline window.__NOTES_PRESET__ injecté au déploiement, sinon (2) fetch notes-preset.json
  if(typeof STORE!=='undefined' && Object.keys(STORE).length===0){
    let p=(typeof window!=='undefined' && window.__NOTES_PRESET__) || null;
    if(!p){ try{ const r=await fetch('notes-preset.json',{cache:'no-cache'}); if(r.ok)p=await r.json(); }catch(e){} }
    if(p&&typeof p==='object'){ Object.assign(STORE,p); sauver();
      Object.keys(STORE).forEach(k=>{ if(k.indexOf('vu::')===0)VUS.add(k.slice(4)); }); }
  }
  if(!EMBED){
    ['nav','helpbtn'].forEach(id=>{document.getElementById(id).hidden=false;});
    if(!localStorage.getItem('constel-vu3'))document.getElementById('keys').hidden=false;
  }

  const cnt={}; D.nodes.forEach(n=>{cnt[n.axe]=(cnt[n.axe]||0)+1;});
  AXORDER=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  AXORDER.forEach((a,i)=>{AXC[a]=PALETTE[i%PALETTE.length];});
  document.getElementById('sub').textContent=(D.watch||'');
  document.getElementById('rt').innerHTML=
    D.nodes.length+' '+(D.nodes.length>1?'signaux':'signal')+' · '+D.runs.length+' '+(D.runs.length>1?'livraisons':'livraison');

  chargerNotes();
  computeZ();
  layoutAngles(); active=D.runs.length-1;
  if(typeof D!=="undefined"&&D&&D.mode==="publish")document.documentElement.classList.add("pub");
  initTrois(); construire(); construireNav(); marquerNotes(); majEpaisseurs();
  /*légende core-edge retirée (Le lecteur)*/
  if(EMBED){ active=D.runs.length-1; cadrerVitrine(); } else { allerA(active,true); }
  // MOBILE-2026 : sans cet appel, les etiquettes des livraisons voisines restent affichees
  // jusqu'au premier deplacement de camera — trois titres superposes au chargement.
  majProfondeur();
  majProfondeur();
  animer();
}

// La tier la plus basse de toute la bibliotheque : elle donne le bord du disque,
// identique pour chaque livraison.
let _dtb=null;
function dernierTierBibliotheque(){
  if(_dtb!=null) return _dtb;
  const vus=new Set((D.nodes||[]).map(x=>tierCourante(x)));
  _dtb=Math.max(0, ...TIERS.map((t,i)=>vus.has(t)?i:-1));
  return _dtb;
}
function layoutAngles(){
  const need={};
  AXORDER.forEach(a=>{
    const fils=(D.fils||[]).filter(f=>f.axe===a).map(f=>f.i);
    let mi=0;
    D.runs.forEach((r,ri)=>{const k=D.nodes.filter(n=>n.axe===a&&n.run===ri&&n.kind==='iso').length;if(k>mi)mi=k;});
    need[a]={fils:fils,iso:mi,total:fils.length+mi};
  });
  const TOT=AXORDER.reduce((s,a)=>s+need[a].total,0),step=2*Math.PI/TOT,start=Math.PI/2;
  let cur=0; const sf={},si={};
  AXORDER.forEach(a=>{
    SECT[a]={mid:start+(cur+need[a].total/2)*step};
    need[a].fils.forEach((fi,k)=>{sf[fi]=start+(cur+k+0.5)*step;});
    si[a]=[]; for(let k=0;k<need[a].iso;k++)si[a].push(start+(cur+need[a].fils.length+k+0.5)*step);
    cur+=need[a].total;
  });
  const used={};
  D.nodes.forEach(n=>{
    if(n.kind==='fil'&&sf[n.fil]!=null)ANG[n.id]=sf[n.fil];
    else{const k=n.axe+'|'+n.run,i=(used[k]||0);ANG[n.id]=si[n.axe][i];used[k]=i+1;}
  });
}

function initTrois(){
  scene=new THREE.Scene();
  // STARFIELD-2026 : le fond de la scène WebGL était opaque (0x0b1220) et masquait le
  // ciel étoilé CSS (#bg-stars, z-index:-2) une fois le rendu Three.js lancé → le starfield
  // « disparaissait » après l'intro. On rend la scène TRANSPARENTE pour qu'il reste visible en permanence.
  scene.background=null;

  // tassees dans un disque de 260px, impossibles a viser, et `touch-action:none` coupe aussi
  // le pincer-zoomer du navigateur : le doigt n'avait AUCUN moyen d'agrandir.
  // Rotation et pan restent verrouilles (feedback 2026-07-28) : la vue de face sert a cliquer.
  ctl.enableZoom=true;
  ctl.minDistance=140; ctl.maxDistance=16000;

  ctl.touches={ONE:null,TWO:THREE.TOUCH.DOLLY_PAN};
  ctl.addEventListener('start',()=>rnd.domElement.classList.add('grabbing'));
  ctl.addEventListener('end',()=>{rnd.domElement.classList.remove('grabbing');majActive();});
  ctl.addEventListener('change',majActive);

  scene.add(new THREE.AmbientLight(0x8fa8d8,0.5));
  const key=new THREE.DirectionalLight(0xffffff,1.2); key.position.set(1,1.4,1.2); scene.add(key);
  const fill=new THREE.DirectionalLight(0x6b8fd0,0.45); fill.position.set(-1,-0.7,-0.6); scene.add(fill);

  ciel();
  ray=new THREE.Raycaster(); ray.params.Line.threshold=26; pointer=new THREE.Vector2();
  addEventListener('resize',onResize);
  setTimeout(espacerEtiquettesAxes, 600);   // les cadres ne sont mesurables qu'apres un rendu
  // MOBILE-2026 : le cadrage n'est pas encore stabilise a 600ms — deux passes de rattrapage,
  // sinon les etiquettes d'axes restent coupees par le bord de l'ecran.
  setTimeout(espacerEtiquettesAxes, 1800);
  setTimeout(espacerEtiquettesAxes, 3600);
  // MOBILE-2026 : les etiquettes d'anneaux (.lb-tier) sont masquees sur ecran etroit ; la
  // legende fixe les remplace. Elle n'etait jamais construite -> aucune cle de lecture au doigt.
  if(TACTILE || innerWidth<=700 || (innerHeight<=500 && innerWidth>innerHeight)) buildTierLegend();

  // sur window mais bien sur visualViewport → sinon la constellation reste mal cadrée.
  if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
  // rotation d'appareil : recadrage explicite (au cas où onResize ne suffit pas)
  addEventListener('orientationchange',()=>setTimeout(onResize,120));
  const c=rnd.domElement;
  if(!EMBED){
    c.addEventListener('pointermove',onHover);
    c.addEventListener('click',onClick);
    c.addEventListener('dblclick',onDbl);
    // MOBILE-2026 : `dblclick` n'est jamais emis au doigt (mesure : 2 clicks, 0 dblclick).
    // On detecte le double-tap a la main -> « approcher » existe aussi en tactile.
    let _tt=0,_tx=0,_ty=0;
    c.addEventListener('pointerup',ev=>{
      if(ev.pointerType==='mouse')return;
      const now=Date.now();
      if(now-_tt<330 && Math.abs(ev.clientX-_tx)<26 && Math.abs(ev.clientY-_ty)<26){ _tt=0; onDbl(ev); }
      else { _tt=now; _tx=ev.clientX; _ty=ev.clientY; }
    });
  }
  c.addEventListener('contextmenu',e=>e.preventDefault());
}
function onResize(){
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  rnd.setSize(innerWidth,innerHeight); lab.setSize(innerWidth,innerHeight);
  recadrer();   // la constellation se reajuste pour tenir dans la nouvelle taille
  espacerEtiquettesAxes();

// Les etiquettes d'axe se posent au milieu de leur secteur, sur le bord du disque.
// Deux secteurs etroits et voisins les superposent, et celle du sommet passe sous
// le bandeau. Elles GLISSENT alors le long du cercle — rayon inchange, pour rester
// a la limite de la sphere — jusqu'a trouver une place libre.
function espacerEtiquettesAxes(){
  if(typeof etoiles==='undefined' || !etoiles.length) return;
  const axes = etoiles.filter(m=>m.userData && m.userData.type==='axe' && m.userData.lb);
  if(!axes.length) return;
  axes.forEach(m=>{
    if(m.userData.rBord==null){
      m.userData.rBord = m.position.length();
      m.userData.aBord = Math.atan2(m.position.y, m.position.x);
      m.userData.dAngle = 0;
      m.userData.fRad = 1;
    }
    // on repart toujours de la position theorique : sinon les passes s'additionnent
    const a = m.userData.aBord + m.userData.dAngle, r = m.userData.rBord*(m.userData.fRad||1);
    m.position.set(Math.cos(a)*r, Math.sin(a)*r, m.position.z);
  });

  // zones occupees par l'interface fixe : une etiquette qui tombe dessous est perdue
  const obstacles = [];
  document.querySelectorAll('header,#nav,#exportbtn,#filsbtn,#lang-toggle,#helpbtn,#keys,#tier-legend,#help-btn-wt,#hud-cle').forEach(e=>{
    if(!e || e.hidden) return;
    const r = e.getBoundingClientRect();
    if(r.width > 4 && r.height > 4) obstacles.push(r);
  });

  // taille de chaque etiquette : mesuree une fois, elle ne change pas en bougeant
  if(lab && typeof scene!=='undefined' && cam) lab.render(scene, cam);
  const dim = axes.map(m=>{ const r=m.userData.lb.getBoundingClientRect();
    return {w:r.width||140, h:r.height||24}; });

  // calibrage : l'ecart entre le point projete et le rectangle reellement pose,
  // pour ne dependre d'aucune convention du moteur d'etiquettes
  const _v = new THREE.Vector3();
  const projete = (m,d,f)=>{
    const a=m.userData.aBord+d, r=m.userData.rBord*(f==null?(m.userData.fRad||1):f);
    _v.set(Math.cos(a)*r, Math.sin(a)*r, m.position.z);
    if(m.parent) m.parent.localToWorld(_v);
    _v.project(cam);
    return { x:(_v.x*0.5+0.5)*innerWidth, y:(-_v.y*0.5+0.5)*innerHeight };
  };
  let ox=0, oy=0;
  {
    const m0=axes[0], p0=projete(m0, m0.userData.dAngle);
    const r0=m0.userData.lb.getBoundingClientRect();
    if(r0.width>1){ ox=(r0.left+r0.right)/2 - p0.x; oy=(r0.top+r0.bottom)/2 - p0.y; }
  }
  const rectDe = (m,i,d,f)=>{
    const p=projete(m,d,f), w=dim[i].w, h=dim[i].h;
    const cx=p.x+ox, cy=p.y+oy;
    return { left:cx-w/2, right:cx+w/2, top:cy-h/2, bottom:cy+h/2 };
  };

  const aire = (a,b)=>{
    const w = Math.min(a.right,b.right) - Math.max(a.left,b.left);
    const h = Math.min(a.bottom,b.bottom) - Math.max(a.top,b.top);
    return (w>0 && h>0) ? w*h : 0;
  };
  const cout = (i, rects)=>{
    const r = rects[i];
    let c = 0;
    for(const o of obstacles) c += aire(r,o)*3;            // l'interface pese plus lourd
    for(let j=0;j<rects.length;j++) if(j!==i) c += aire(r, rects[j]);
    const MB = 6;   // MOBILE-2026 : marge franche au bord, sinon l'etiquette semble coupee
    const debord = Math.max(0,MB-r.left)+Math.max(0,MB-r.top)
                 + Math.max(0,r.right-(innerWidth-MB))+Math.max(0,r.bottom-(innerHeight-MB));
    return c + debord*40;                                  // sortir du cadre est pire
  };

  const PAS = 3*Math.PI/180, MAX = 34*Math.PI/180;
  // MOBILE-2026 : glisser le long du cercle ne suffit pas quand les etiquettes sont larges
  // par rapport au disque (390px) : elles se chevauchaient et se faisaient couper par le bord.
  // On leur donne une seconde liberte, RADIALE : rentrer vers l'interieur du disque. Rentrer
  // a un cout propre, pour que ce soit un recours et non la solution par defaut.
  const RADS = [1, 0.92, 0.84, 0.76, 0.68, 0.58, 0.48];
  let rects = axes.map((m,i)=>rectDe(m,i,m.userData.dAngle));
  for(let passe=0; passe<5; passe++){
    let bouge = false;
    for(let i=0;i<axes.length;i++){
      const m=axes[i];
      if(cout(i,rects) <= 0) continue;
      let meilleurA = m.userData.dAngle, meilleurF = (m.userData.fRad||1), score = cout(i,rects);
      const angles = [m.userData.dAngle];
      for(const sens of [1,-1]){
        let d = m.userData.dAngle;
        for(let k=0;k<3;k++){ d += sens*PAS; if(Math.abs(d) > MAX) break; angles.push(d); }
      }
      for(const d of angles){
        for(const f of RADS){
          rects[i] = rectDe(m,i,d,f);
          const sc = cout(i,rects) + (1-f)*900;
          if(sc < score - 0.5){ score = sc; meilleurA = d; meilleurF = f; }
        }
      }
      if(meilleurA !== m.userData.dAngle || meilleurF !== (m.userData.fRad||1)){
        m.userData.dAngle = meilleurA; m.userData.fRad = meilleurF; bouge = true;
      }
      rects[i] = rectDe(m,i,m.userData.dAngle,m.userData.fRad);
    }
    if(!bouge) break;
  }
  // une seule pose, un seul rendu
  axes.forEach(m=>{
    const a = m.userData.aBord + m.userData.dAngle, r = m.userData.rBord*(m.userData.fRad||1);
    m.position.set(Math.cos(a)*r, Math.sin(a)*r, m.position.z);
  });
  if(lab && typeof scene!=='undefined' && cam) lab.render(scene, cam);
}
// largeur occupee par le panneau lateral quand une carte est ouverte
function largeurPanneau(){
  // MOBILE-2026 : la fiche mobile est une feuille ancree en bas — elle ne prend AUCUNE
  // largeur. La compter decalait la constellation d'un demi-ecran vers la gauche, ce qui se
  // voyait des qu'on repliait la feuille.
  if(ETROIT()) return 0;
  return (panel && panel.classList.contains('on')) ? panel.getBoundingClientRect().width : 0;
}
// distance camera pour que la constellation tienne dans la zone VISIBLE (hors
// panneau), selon le RATIO : fenetre etroite OU carte ouverte -> on recule.
function distanceFit(ri){
  ri=(ri==null?active:ri);
  const p=plans.filter(x=>x.ri===ri)[0];
  // marge labels d'axe : mobile 1.30 (au lieu de 1.55) → la constellation remplit ~80% de
  // la largeur au lieu de ~65% ; les labels d'axe mobiles sont réduits (CSS) pour ne pas déborder.
  // Le décalage vertical caméra (recadrer) compense la place prise par le nav en bas.
  // FIXPC-2026 bug3 : desktop panneau ouvert → marge plus grande (1.42) pour que les labels d'axe
  // de droite (« Énergie & environnement », « Hardware & compute ») ne passent plus SOUS le panneau.
  const lp=largeurPanneau();
  // FILLSCREEN-2026 : marges réduites pour que la constellation remplisse davantage l'écran.
  // Mobile 1.38→1.30 (elle était tassée au centre ; on l'agrandit mais les labels d'axe latéraux
  // longs — largeur px fixe sur écran étroit — bornent le grossissement, sinon ils sont coupés).
  // Desktop 1.12→1.06, panneau ouvert 1.42→1.34. Labels d'axe lisibles et non coupés (vérifié live).
  // On garde une marge franche : sans elle, l'etiquette du sommet se tasse contre
  // le bandeau et celles des cotes contre le bord de la fenetre.
  const marge = TACTILE ? 1.22 : (lp>0 ? 1.78 : 1.58);
  const R=p?p.R:600, rad=R*marge;
  const libre=Math.max(220, innerWidth-lp);
  const t=Math.tan(cam.fov*Math.PI/360);
  return Math.max(rad/t, rad/(t*(libre/innerHeight)))*1.03;
}
// recadre la constellation dans la zone libre (a gauche du panneau ouvert),
// orientation courante conservee. Appele au resize ET a l'ouverture/fermeture.
function recadrer(){
  if(!D||!plans.length)return;
  const dist=distanceFit();
  // MOBILE-2026 : bornes de zoom recalculees autour du cadrage ajuste. Sur la page publiee,
  // un pincement modere multipliait l'echelle par 4,5 et sortait la constellation du cadre
  // sans aucun moyen de recadrer. Ici elle ne peut plus s'echapper.
  try{ ctl.minDistance=Math.max(120,dist*0.40); ctl.maxDistance=dist*1.25; }catch(e){}
  let fwd=ctl.target.clone().sub(cam.position);
  if(fwd.lengthSq()<1e-6)fwd.set(0,0,-1);
  fwd.normalize();
  const right=new THREE.Vector3().crossVectors(fwd,cam.up).normalize();
  const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
  const t=Math.tan(cam.fov*Math.PI/360);
  const Wworld=2*dist*t*(innerWidth/innerHeight);
  const Hworld=2*dist*t;
  const decal=(largeurPanneau()/2/innerWidth)*Wworld;   // pousse le contenu vers la gauche
  // Mobile : le nav (56px + safe-area) prend de la place en bas, le header en haut.
  // On calcule le centre de la zone VISIBLE et on décale la caméra vers le haut d'autant :
  // la constellation ne se plaque plus sous le nav (Hardware & compute clippé).
  let dy=0;
  if(TACTILE){
    const navH=innerWidth<=700||innerHeight<=500?66:0;
    const hdrH=innerWidth<=700||innerHeight<=500?62:0;
    const visibleCenterY=(hdrH+(innerHeight-navH))/2;   // en px
    const viewportCenterY=innerHeight/2;
    const decalPx=viewportCenterY-visibleCenterY;       // >0 si visible center au-dessus
    dy=(decalPx/innerHeight)*Hworld;                    // shift target UP → scene monte à l'écran
  }
  const centre=new THREE.Vector3(0,0,zPlane(active))
    .add(right.clone().multiplyScalar(decal))
    .add(up.clone().multiplyScalar(-dy));               // -dy : target descend en world → scène monte à l'écran
  ctl.target.copy(centre);
  // Vue de TROIS QUARTS en publication : plusieurs livraisons sont empilees en
  // profondeur, et de face elles se masquent l'une l'autre. De biais, on voit
  // l'epaisseur du temps. L'evaluation reste de face : on y clique des etoiles.
  const troisQuarts = (typeof D!=='undefined' && D && D.mode==='publish' && (D.runs||[]).length>1);
  if(troisQuarts){
    const AZ = 26*Math.PI/180, EL = 14*Math.PI/180;   // biais horizontal, legere plongee
    const dir = new THREE.Vector3(
      Math.sin(AZ)*Math.cos(EL),
      Math.sin(EL),
      Math.cos(AZ)*Math.cos(EL));
    cam.position.copy(centre.clone().add(dir.multiplyScalar(dist*1.12)));
  }else{
    cam.position.copy(centre.clone().sub(fwd.clone().multiplyScalar(dist)));
  }
  ctl.update();
}
function ciel(){
  const N=2400,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=20000+Math.random()*12000,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.cos(p); pos[i*3+2]=r*Math.sin(p)*Math.sin(t);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe0ff,size:42,sizeAttenuation:true,
    transparent:true,opacity:.6,fog:false})));
}

const GEO={};
const boule=r=>{const k='g'+r; if(!GEO[k])GEO[k]=new THREE.SphereGeometry(r,30,22); return GEO[k];};

function etoile(parent,x,y,r,couleur,texte,cls,data){
  const col=new THREE.Color(couleur);
  const m=new THREE.Mesh(boule(r),new THREE.MeshStandardMaterial({
    color:col, emissive:col.clone().multiplyScalar(.40), roughness:.32, metalness:.06}));
  m.position.set(x,y,0); m.userData=data||{}; parent.add(m);

  const h=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:col,transparent:true,
    opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  h.scale.setScalar(r*2.0); m.add(h); m.userData.halo=h; m.userData.haloBase=r*2.0; m.userData.haloCol=col.clone();
  m.userData.emiBase=(data&&data.type==='leaf')?.40:.40;
  // anneau "noté" : visible quand le finding de ce signal porte une note
  if(data&&(data.type==='leaf'||data.type==='axe'||data.type==='core')){
    const an=new THREE.Mesh(new THREE.RingGeometry(r*1.16,r*1.40,32),
      new THREE.MeshBasicMaterial({color:0x8ef0c0,transparent:true,opacity:.95,
        side:THREE.DoubleSide,depthWrite:false,fog:false}));
    an.visible=false; m.add(an); m.userData.anneau=an;
  }
  // anneau "vu" (finding deja ouvert) : liseré bleu clair, distinct de l'anneau "noté"
  if(data&&data.type==='leaf'){
    const av=new THREE.Mesh(new THREE.RingGeometry(r*1.58,r*1.82,36),
      new THREE.MeshBasicMaterial({color:0x9ec5ff,transparent:true,opacity:.85,
        side:THREE.DoubleSide,depthWrite:false,fog:false}));
    av.visible=false; m.add(av); m.userData.anneauVu=av;
  }

  if(texte){
    const d=document.createElement('div'); d.className='lb '+cls; d.innerHTML=texte;
    if(cls==='axe'){
      // teinte de l'axe, remontee en clarte : la couleur pleine du secteur est trop
      // sombre pour du texte, on la ramene vers le clair sans perdre la teinte.
      const c=col.clone(); const hsl={}; c.getHSL(hsl);
      c.setHSL(hsl.h, Math.min(1, hsl.s*1.05), Math.max(0.72, hsl.l));
      d.style.color='#'+c.getHexString();
      d.style.borderColor='#'+col.clone().setHSL(hsl.h, hsl.s, Math.max(0.42, hsl.l*0.9)).getHexString();
      const nomAxe = data && data.axe;
      if(nomAxe){
        d.addEventListener('mouseenter', ()=>{
          if(curView && curView.type!=='core' && curView.type!=='axe') return;  // une carte ouverte garde la main
          hiliAxe = nomAxe;
        });
        d.addEventListener('mouseleave', ()=>{
          if(curView && curView.type==='axe' && curView.axe===nomAxe) return;   // l'axe ouvert reste allume
          if(hiliAxe === nomAxe) hiliAxe = null;
        });
      }
    }
    const o=new CSS2DObject(d); o.position.set(cls==='core'?0:r,0,0); m.add(o);
    m.userData.lb=d;
    // le titre est cliquable au meme titre que la bille — c'est la cible visible
    let px=0,py=0;
    d.addEventListener('pointerdown',ev=>{px=ev.clientX;py=ev.clientY;ev.stopPropagation();});
    d.addEventListener('click',ev=>{
      if(Math.abs(ev.clientX-px)+Math.abs(ev.clientY-py)>4)return;   // c'etait un glisser
      ev.stopPropagation();
      if(m.userData.type==='leaf')ouvrir(m.userData.d);
      else if(m.userData.type==='axe')ouvrirAxe(m.userData.axe,m.userData.ri);
      else if(m.userData.type==='core'){
        if(m.userData.ri===active)ouvrirLivraison(m.userData.ri); else allerA(m.userData.ri);
      }
    });
    d.addEventListener('dblclick',ev=>{ev.stopPropagation();
      if(m.userData.type==='leaf')approcher(m.userData.d);});
    // survoler le LABEL pilote le meme highlight que survoler la bille : sans ca,
    // le raycaster du canvas ne se met plus a jour (le label capte l'event) et le
    // surlignage reste colle sur la derniere etoile.
    d.addEventListener('mouseenter',()=>{survol=m;rnd.domElement.style.cursor='pointer';
      const dd=m.userData.d;setHi(dd&&dd.fil!=null?dd.fil:null);});
    d.addEventListener('mouseleave',()=>{if(survol===m)survol=null;
      rnd.domElement.style.cursor='';setHi(null);});
  }
  etoiles.push(m);
  return m;
}
function trait(parent,a,b,col,op){
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),

// un lien EPAIS (cylindre) : dans WebGL une Line ne peut pas varier d'epaisseur,
// donc les liens dont l'epaisseur porte une info (la note) sont des cylindres.
const GEOCYL=new THREE.CylinderGeometry(1,1,1,8);
const YAXIS=new THREE.Vector3(0,1,0);
function lien(parent,a,b,col,op,ud){
  const m=new THREE.Mesh(GEOCYL,new THREE.MeshBasicMaterial({
    color:new THREE.Color(col),transparent:true,opacity:op,depthWrite:false,fog:false}));
  m.position.copy(a.clone().lerp(b,0.5));
  const dir=b.clone().sub(a), len=dir.length();
  m.quaternion.setFromUnitVectors(YAXIS,dir.normalize());
  m.userData=Object.assign({len:len},ud||{});
  m.scale.set(1.5,len,1.5);
  parent.add(m); liensNotes.push(m); return m;
}
// l'epaisseur des liens porte les notes, sur une echelle commune 0..10 :
//  - finding : sa note (0..10) ;
//  - coeur->axe : la SOMME des notes de l'axe (le nombre de findings compte),
//    normalisee 0..10 par rapport a l'axe le plus lourd (agregation relative).
const EPMIN=1, EPMAX=5;   // liens FINS (tiges) ; les noeuds font >= 3x leur lien
const epFromV=v=>EPMIN+(Math.max(0,Math.min(10,v))/10)*(EPMAX-EPMIN);
function majEpaisseurs(){
  if(typeof liensNotes==='undefined')return;
  const base=EPMIN*EPMIN;
  // 1) chaque lien axe->finding : rayon = sa note sur l'echelle 0..10 (epFromV).
  liensNotes.forEach(m=>{
    if(m.userData.type!=='axe-finding')return;
    const e=NOTES[m.userData.id], v=(e&&typeof e.score==='number')?e.score:0;
    const w=epFromV(v); m.scale.set(w,m.userData.len,w);
  });
  // 2) le tronc coeur->axe agrege les SECTIONS (aires) de ses findings :
  //    aire = base + somme(rayon_finding^2 - base)  ->  rayon = sqrt(aire).
  //    Consequence : le tronc est TOUJOURS >= sa plus grosse branche (coherent),
  //    le nombre de findings notes compte, c'est reactif, et le sqrt amortit ->
  //    ca se normalise peu importe le nombre de findings (pas d'explosion).
  const wF={}, wA={};   // rayon du lien, par finding id et par axe
  liensNotes.forEach(m=>{
    if(m.userData.type==='axe-finding'){
      const e=NOTES[m.userData.id], v=(e&&typeof e.score==='number')?e.score:0;
      wF[m.userData.id]=epFromV(v);
    }
  });
  liensNotes.forEach(m=>{
    if(m.userData.type!=='coeur-axe')return;
    let aire=base;
    (m.userData.ids||[]).forEach(id=>{
      const e=NOTES[id], v=(e&&typeof e.score==='number')?e.score:0;
      const wf=epFromV(v); aire += wf*wf - base;   // exces de section au-dessus du repos
    });
    let w=Math.sqrt(Math.max(base,aire));   // le tronc agrege les sections des branches
    if(w>12)w=12;                           // reste une tige (les noeuds font 3x)
    m.scale.set(w,m.userData.len,w); wA[m.userData.axe]=w;
  });
  // TAILLE DES NOEUDS : une bille doit "recevoir" son lien, jamais etre plus
  // petite que lui (sinon pate de trait). Findings : grossissent avec la note.
  // RATIO ORGANIQUE : chaque noeud fait AU MOINS 3x l'epaisseur (rayon) du lien
  // le plus epais qui y arrive -> grosses boules au bout de tiges fines.
  const maxT=Math.max(EPMIN, ...(Object.keys(wA).length?Object.values(wA):[EPMIN]));
  if(typeof etoiles!=='undefined') etoiles.forEach(m=>{
    if(!m.userData)return;
    if(m.userData.type==='leaf'){
      const w=wF[m.userData.d&&m.userData.d.id]||EPMIN;
      m.scale.setScalar(Math.max(7, w*3)/7);             // bille >= 3x son lien
    }else if(m.userData.type==='axe'){
      const w=wA[m.userData.axe]||EPMIN;
      m.scale.setScalar(Math.max(17, w*3)/17);           // hub >= 3x son tronc
    }else if(m.userData.type==='core'){
      // le coeur >= 3x son plus gros tronc ET toujours plus gros que le + gros axe
      const grosAxe=Math.max(17, maxT*3);
      m.scale.setScalar(Math.max(34, grosAxe*1.4)/34);
    }
  });
}

// === TIERS (refonte 2026-07-30) : constellation RADIALE — axe=secteur, tier=rayon ===
let hiliAxe=null;              // axe survole dans un panneau -> highlight dans la constellation
let hiliId=null;              // finding survole dans un panneau d'axe -> highlight de cette etoile
let hiliTier=null;            // tier survolee/ouverte -> highlight de tous ses findings

// RETOUR-PILE-2026 : pile de navigation reelle. Le Retour remonte d'EXACTEMENT un niveau
// selon le chemin PARCOURU (constellation->axe->fiche => fiche->axe->constellation, sans

const TIERS=['Excellent','Cool','Intéressant','Neutre','Bof','Inutile'];   // 0=coeur -> 5=peripherie

const RIN=280, RSTEP=182;   // FILLSCREEN-2026 : anneaux plus régulièrement répartis (ring0 un peu moins collé au centre, tiers étalés jusqu'au bord) ; rayon du 1er anneau + pas entre anneaux
const tierR=k=>RIN+k*RSTEP;
// ANTIOVERLAP-2026 : positions {x,y,s} deterministes des noeuds d'une cellule (axe x tier). Au lieu d'un rayon
// unique (=> chevauchement quand le tier est dense), on donne a l'anneau une BANDE radiale (demi-epaisseur
// HBAND < RSTEP/2 -> le noeud reste clairement dans son anneau) et on repartit les noeuds en RAYON *et* en ANGLE
// sur une grille polaire. Le nb de rangees est choisi pour MAXIMISER le rayon effectif `s` du noeud qui tient a la
// fois radialement (ecart entre rangees) ET angulairement (corde entre voisins) : les billes sont donc dessinees a
// une taille qui GARANTIT une distance min centre-a-centre >= diametre (2*s) -> aucune superposition, meme en tier
// tres dense. `s` retombe sur la taille nominale `ts` quand la cellule est peu peuplee (aucune reduction inutile).
// `kTier` (0..3) sert de phase : deux tiers voisins ne posent pas leurs findings
// sur la meme direction, sinon ils se masquent l'un l'autre en profondeur.
function cellLayout(nn, ai0, ai1, amid, rr, ts, kTier){
  const out=[]; if(nn<=0)return out;
  const Wraw=Math.abs(ai1-ai0);
  // UNE SEULE RANGEE par couronne. La taille se normalise sur la densite : la
  // demi-corde entre deux voisins donne le rayon maximal admissible, borne par la
  // taille nominale du tier et par un plancher de lisibilite.
  const demiCorde = nn>1 ? rr*Math.sin(Math.min(Math.PI, Wraw/nn)/2) : Infinity;
  const rEff = Math.max(3.0, Math.min(ts, demiCorde));
  const s = rEff*0.78;                       // marge : le noeud n'occupe pas toute sa cellule
  // decalage de phase par tier : deux couronnes voisines ne posent pas leurs
  // findings sur la meme direction, sinon elles s'alignent en rayons.
  const PH=[0, 0.34, -0.20, 0.16], ph=(kTier==null?0:(PH[kTier%4]||0));
  // jitter deterministe (hash xorshift seede par rayon+angle) : le rendu reste
  // organique sans jamais rapprocher deux voisins de plus de 0,2 rayon.
  const JIT=rEff*0.10;
  const seed=((Math.round(rr)*2654435761)^(Math.round((amid+8)*997)*40503))>>>0;
  const H=k=>{let x=(seed^((k>>>0)*2246822519))>>>0;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967295;};
  for(let j=0;j<nn;j++){
    const fa = nn>1 ? ai0+(ai1-ai0)*((j+0.5+ph)/nn) : amid+(ai1-ai0)*ph*0.62;
    const rj = rr+(H(j*2+1)-0.5)*2*JIT;
    const aj = fa+((H(j*2+7)-0.5)*2*JIT)/Math.max(1,rj);
    out.push({x:Math.cos(aj)*rj, y:Math.sin(aj)*rj, s:s});
  }
  return out;
}

function tierIdx(t){const i=TIERS.indexOf(t);return i<0?2:i;}
// preview/dev : si les findings n'ont pas encore de tier (donnees pre-refonte), en inventer un
// (reparti en tranches deterministes PAR AXE). Sans effet quand la vraie donnee porte deja `tier`.
function assignTiersIfMissing(nodes){
  const byAxe={}; nodes.forEach(n=>{(byAxe[n.axe]=byAxe[n.axe]||[]).push(n);});
  const h=s=>{let x=0;for(const c of String(s))x=(x*31+c.charCodeAt(0))>>>0;return x;};
  Object.values(byAxe).forEach(arr=>{
    if(arr.every(n=>n.tier))return;
    arr.slice().sort((a,b)=>h(a.id)-h(b.id)).forEach((n,i)=>{
      if(!n.tier){ n.tier=TIERS[Math.min(3,Math.floor(i/arr.length*4))]; n.tier_source=n.tier_source||'agent'; }
    });
  });
}

function construire(){
  D.runs.forEach((run,ri)=>{
    const nodes=D.nodes.filter(n=>n.run===ri);
    assignTiersIfMissing(nodes);
    // L'echelle est commune a toutes les livraisons : la tier la plus basse de la
    // BIBLIOTHEQUE fixe le bord du disque, pas celle de la semaine regardee. Sinon
    // le disque change de taille d'un pas de temps a l'autre et rien ne se compare.
    const _dernier = (D && D.mode==='publish') ? dernierTierBibliotheque()
                                               : TIERS.length-1;
    const ROUT=tierR(_dernier)+RSTEP*0.65;
    const g=new THREE.Group(); g.position.z=zPlane(ri); scene.add(g);
    plans.push({ri:ri,g:g,R:ROUT,rayons:[],decor:[],etiquettes:[]});

    // 4 anneaux-guides (tiers) + leur label, du coeur vers la peripherie
    // en publication, seules les couronnes peuplees sont tracees : les tiers du bas
    // n'y ont aucun finding et videraient le disque pour rien.
    const tiersVus = new Set(nodes.map(x=>tierCourante(x)));
    const publie = (D && D.mode==='publish');
    for(let k=0;k<TIERS.length;k++){
      if(publie && !tiersVus.has(TIERS[k])) continue;
      const rr=tierR(k), pts=[];
      for(let i=0;i<=140;i++){const a=i/140*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rr,Math.sin(a)*rr,0));}
      const anneauTier=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0x5a76b0,transparent:true,opacity:.5})/*RINGS-VIS*/);
      g.add(anneauTier); plans[plans.length-1].decor.push(anneauTier);
      const el=document.createElement('div');
      el.textContent=TIERS[k];
      el.className='lb-tier';   /* CSS pilote font/opacity → responsive mobile */
      const o=new CSS2DObject(el); o.position.set(0,rr,0); g.add(o);
      plans[plans.length-1].decor.push(o); plans[plans.length-1].etiquettes.push(el);
      ZONES.tiers[TIERS[k]+'|'+ri]={mat:anneauTier.material,labelEl:el};
      // survol de l'etiquette -> toute la couronne s'allume (meme geste que depuis le menu)
      const nomTier = TIERS[k];
      el.style.pointerEvents='auto'; el.style.cursor='default';
      el.addEventListener('mouseenter', ()=>{
        if(curView && curView.type!=='core' && curView.type!=='tier') return;
        hiliTier = nomTier;
      });
      el.addEventListener('mouseleave', ()=>{
        if(curView && curView.type==='tier' && curView.tier===nomTier) return;
        if(hiliTier === nomTier) hiliTier = null;
      });
      // clic : on entre dans la couronne, comme sur l'etiquette d'un axe
      el.style.cursor='pointer';
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); ouvrirTier(nomTier, ri); });
    }

    // Limite du disque : sans elle, la sphere et le fond ont la meme valeur et on ne
    // sait plus ou s'arrete la veille. Un liseré clair, double d'un halo tres doux.
    {
      const ptsB=[]; for(let i=0;i<=200;i++){const aa=i/200*Math.PI*2;
        ptsB.push(new THREE.Vector3(Math.cos(aa)*ROUT,Math.sin(aa)*ROUT,-0.3));}
      const limite=new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsB),
        new THREE.LineBasicMaterial({color:0x93aede,transparent:true,opacity:.62}));
      g.add(limite);
      const pl0=plans.filter(x=>x.ri===ri)[0];
      if(pl0){ pl0.limite=limite;
        // la date de la livraison, posee une fois sur le bord : c'est elle qui
        // nomme la couche quand son decor est masque.
        const dd=document.createElement('div'); dd.className='lb-date';
        const brut=(D.runs&&D.runs[ri])||''; const mm=String(brut).slice(5).replace('-','/');
        dd.textContent=mm||brut;
        const od=new CSS2DObject(dd); od.position.set(-ROUT*0.82, -ROUT*0.62, 0); g.add(od);
        pl0.dateEl=dd; }
      const halo=new THREE.Mesh(new THREE.RingGeometry(ROUT,ROUT*1.035,120),
        new THREE.MeshBasicMaterial({color:0x6f8cc4,transparent:true,opacity:.14,
          side:THREE.DoubleSide,depthWrite:false,fog:false}));
      halo.position.z=-0.7; g.add(halo);
    }

    // COEUR : la racine, au centre
    etoile(g,0,0,45,'#c2d6f7',(D.theme||'Veille'),'core',{type:'core',ri:ri});   /* FIXPC-2026 bug5 : retrait de la date <small> collée à l'étoile centrale (la date reste dans le nav du bas) */

    // SECTEURS par axe : largeur angulaire proportionnelle au nombre de findings de l'axe
    const axes=AXORDER.filter(a=>nodes.some(d=>d.axe===a));
    // Largeur compressee (racine carree) : un axe deux fois plus fourni occupe
    // environ 1,4 fois plus de place, pas 2. Sans cela un axe dominant ecrasait
    // tout le disque et les axes a 2 findings n'avaient plus de quoi s'annoncer.
    const counts={}; let TOT=0; axes.forEach(a=>{counts[a]=Math.sqrt(nodes.filter(d=>d.axe===a).length);TOT+=counts[a];});
    const start=Math.PI/2, PAD=0.12;   // depart en haut, sens horaire, marge inter-secteurs (respiration entre axes)
    let cur=0;
    axes.forEach((a,axIdx)=>{
      const col=AXC[a];
      const w=counts[a]/TOT*2*Math.PI;
      const a0=start-cur, a1=start-(cur+w); cur+=w;
      const amid=(a0+a1)/2, ai0=a0-PAD, ai1=a1+PAD;
      SEC[a]={ai0:ai0,ai1:ai1,amid:amid,ri:ri,g:g};   // memorise le secteur pour la re-harmonisation
      // SECTIONSEP-2026 : séparation visuelle des sections (axes) — 2 approches sobres combinées.
      // (a) teinte de CHAQUE secteur (fini le "un sur deux" déséquilibré) avec SA couleur d'axe, en anneau-wedge
      //     derrière les nœuds. Intensité ÉGALE et subtile partout, et les wedges pavent exactement le disque
      //     (angles a0->a1, sans le PAD) -> pas de recouvrement ni de trou entre secteurs : rendu régulier.
      const SEPin=tierR(0)-RSTEP*0.55, SEPout=ROUT;
      const wedge=new THREE.Mesh(
        new THREE.RingGeometry(SEPin,SEPout,30,1,a1,a0-a1),
        new THREE.MeshBasicMaterial({color:new THREE.Color(col),transparent:true,
          opacity:.05,side:THREE.DoubleSide,depthWrite:false,fog:false}));
      wedge.position.z=-0.6; g.add(wedge); plans.filter(x=>x.ri===ri)[0].decor.push(wedge);
      // calque « axe entierement revu » : le secteur se remplit du coeur au bord dans
      // SA couleur, plus soutenue, et se cerne d'un contour vert. Masque par defaut.
      const wedgeVu=new THREE.Mesh(
        new THREE.RingGeometry(0.001,SEPout,42,1,a1,a0-a1),
        new THREE.MeshBasicMaterial({color:new THREE.Color(col),transparent:true,
          opacity:.20,side:THREE.DoubleSide,depthWrite:false,fog:false}));
      wedgeVu.position.z=-0.55; wedgeVu.visible=false; g.add(wedgeVu);
      // contour : coeur -> bord, arc exterieur, retour au coeur
      const ptsC=[new THREE.Vector3(0,0,-0.5)];
      for(let i=0;i<=36;i++){const aa=a1+(a0-a1)*i/36;
        ptsC.push(new THREE.Vector3(Math.cos(aa)*SEPout,Math.sin(aa)*SEPout,-0.5));}
      ptsC.push(new THREE.Vector3(0,0,-0.5));
      const contourVu=new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsC),
        new THREE.LineBasicMaterial({color:0x5fd39b,transparent:true,opacity:.85}));
      contourVu.visible=false; g.add(contourVu);
      ZONES.axes[a+'|'+ri]={wedgeVu:wedgeVu,contourVu:contourVu};
      // (b) trait radial (spoke) discret au CENTRE de la respiration entre secteurs (angle a1 = frontière
      //     avec l'axe suivant) -> délimite chaque section du cœur vers le bord.
      const sc=Math.cos(a1), ss=Math.sin(a1);
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(sc*SEPin,ss*SEPin,-0.4),
        new THREE.Vector3(sc*SEPout,ss*SEPout,-0.4)]),
        new THREE.LineBasicMaterial({color:0x35507f,transparent:true,opacity:.34})));
      const REDGE=ROUT+RSTEP*1.45;   // l'etiquette se detache nettement du bord du disque
      // etiquette d'axe au bord externe du secteur (l'axe se lit par la COULEUR + le regroupement, pas par un trait)
      etoile(g,Math.cos(amid)*REDGE,Math.sin(amid)*REDGE,0.1,col,esc(a),'axe',{type:'axe',ri:ri,axe:a});
      const colO=new THREE.Color(col);
      // findings groupes par tier : rayon = leur tier, etales angulairement dans le secteur
      const mine=nodes.filter(d=>d.axe===a);
      TIERS.forEach((t,k)=>{
        const arr=mine.filter(d=>tierCourante(d)===t), rr=tierR(k), nn=arr.length;
        if(!nn)return;
        // ANTIOVERLAP-2026 : bande radiale + grille polaire (cf cellLayout) -> plus de chevauchement en tier dense
        const cellPos=cellLayout(nn,ai0,ai1,amid,rr,tierSize(t),k);
        arr.forEach((d,j)=>{
          const fx=cellPos[j].x, fy=cellPos[j].y, ns=cellPos[j].s;
          POS[d.id]=[fx,fy];
          if(OVTEST)window.__OVNODES.push({id:d.id,axe:a,tier:t,x:fx,y:fy,s:ns});
          // filament organique coeur -> finding (courbe legere, couleur d'axe) : donne le geste "constellation"
          const A0=new THREE.Vector3(0,0,0), B0=new THREE.Vector3(fx,fy,0);
          const mid=A0.clone().lerp(B0,.5); const perp=new THREE.Vector3(-fy,fx,0).normalize().multiplyScalar(Math.hypot(fx,fy)*0.06);
          mid.add(perp);
          const fp=new THREE.QuadraticBezierCurve3(A0,mid,B0).getPoints(24);
          const fl=new THREE.Line(new THREE.BufferGeometry().setFromPoints(fp),
            new THREE.LineBasicMaterial({color:colO,transparent:true,opacity:.13}));
          fl.userData={faxe:a}; filaments.push(fl); g.add(fl);
          const lm=etoile(g,fx,fy,ns,col,esc(d.headline),'',{type:'leaf',d:d,ri:ri});
          lm.userData.fil=fl;   // pour repositionner le filament quand la tier change
          lm.userData.tx=fx; lm.userData.ty=fy;   // cible de position (lerp anime vers elle)
          lm.userData.baseR=ns;   // ANTIOVERLAP-2026 : taille adaptative memorisee (rescale au reclassement)
        });
      });
    });
  });
  tracerFils();
}
function posMonde(id){
  const n=D.nodes.filter(x=>x.id===id)[0]; if(!n)return null;
  const p=POS[id]; if(!p)return null;
  return new THREE.Vector3(p[0],p[1],zPlane(n.run));
}
function tracerFils(){
  (D.fils||[]).forEach(f=>{
    const col=new THREE.Color(AXC[f.axe]||'#64748b');
    for(let i=0;i<f.chaine.length-1;i++){
      const A=posMonde(f.chaine[i].id),B=posMonde(f.chaine[i+1].id); if(!A||!B)continue;
      const mid=A.clone().lerp(B,.5); mid.x*=1.13; mid.y*=1.13;
      const pts=new THREE.QuadraticBezierCurve3(A,mid,B).getPoints(30);
      const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:col,transparent:true,opacity:f.statut==='ouvert'?.55:.28}));
      l.userData={fil:f.i,statut:f.statut}; scene.add(l); liens.push(l);
    }
  });
}

// Ce que le pointeur peut atteindre : la livraison regardee, et elle seule.
// Les autres restent a l'ecran, attenuees — elles montrent l'epaisseur du temps,
// elles ne se cliquent pas. Sans ce filtre, une etoile d'une autre semaine passant
// devant celle qu'on visait ouvrait sa fiche a sa place.
function atteignables(){
  const multi = (D && (D.runs||[]).length>1 && D.mode==='publish');
  if(!multi) return etoiles;
  return etoiles.filter(m=>{
    const u=m.userData||{};
    const ri=(u.ri!=null)?u.ri:((u.d&&u.d.run)||0);
    return ri===active;
  });
}
function viser(e){
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(pointer,cam);
  // mobile : raycast récursif → touche aussi les halos (Sprite r*7.5) et anneaux (enfants du mesh),
  // ça donne des tap targets ~5-8× plus larges que la sphère seule ; on remonte au parent star.
  const cibles=atteignables();
  const hit=ray.intersectObjects(cibles,TACTILE);
  if(!hit.length)return null;
  let o=hit[0].object;
  if(TACTILE){ while(o && !cibles.includes(o)) o=o.parent; }
  return o||null;
}
// un lien de fil sous le curseur
function viserLien(e){
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(pointer,cam);
  const hit=ray.intersectObjects(liens,false);
  return hit.length?hit[0].object:null;
}
let survol=null,survolLien=null,selection=null;
function onHover(e){
  const m=viser(e);
  const l=m?null:viserLien(e);            // l'étoile prime sur le lien
  if(m===survol&&l===survolLien)return;
  survol=m; survolLien=l;
  rnd.domElement.style.cursor=(m||l)?'pointer':'';
  if(m){const d=m.userData.d; setHi(d&&d.fil!=null?d.fil:null); return;}
  setHi(l?l.userData.fil:null);
}
function onClick(e){
  const m=viser(e);
  if(m){
    selection=m;                            // noeud selectionne -> pulsation elegante (voir animer)
    if(m.userData.type==='leaf')ouvrir(m.userData.d);
    else if(m.userData.type==='axe')ouvrirAxe(m.userData.axe,m.userData.ri);
    else if(m.userData.type==='core'){
      // deja sur cette livraison : on ouvre sa carte, sinon on y va (comportement inchange)
      if(m.userData.ri===active)ouvrirLivraison(m.userData.ri); else allerA(m.userData.ri);
    }
    return;
  }
  const l=viserLien(e);                   // clic sur un lien : la carte du fil
  if(l)ouvrirFil(l.userData.fil);
}
function onDbl(e){
  const m=viser(e); if(!m||m.userData.type!=='leaf')return;
  approcher(m.userData.d);
}

function setHi(fi){
  if(hiFil===fi)return;
  hiFil=fi;
  const on=fi!=null;
  liens.forEach(l=>{
    const me=l.userData.fil===fi, base=l.userData.statut==='ouvert';
    l.material.opacity=!on?(base?.55:.28):(me?1:.04);
    l.material.linewidth=me?3:1;
  });
  etoiles.forEach(m=>{
    const d=m.userData.d, me=d&&d.fil===fi;
    const o=!on?1:(me?1:.22);
    m.material.transparent=o<1; m.material.opacity=o;
    if(m.userData.halo)m.userData.halo.material.opacity=!on?.5:(me?.85:.05);
  });
  const t=document.getElementById('filname');
  if(on&&(D.fils||[])[fi]){const f=D.fils[fi];t.textContent=f.titre+'  ('+f.chaine.length+' signaux)';t.style.opacity=1;}
  else t.style.opacity=0;
}

function volerA(cible,d){
  const from=cam.position.clone(), fromT=ctl.target.clone();
  const dir=cam.position.clone().sub(ctl.target).normalize();
  if(!isFinite(dir.x)||dir.lengthSq()<1e-6)dir.set(0,0,1);
  const to=cible.clone().add(dir.multiplyScalar(d));
  const t0=performance.now(), dur=Math.min(1000,360+from.distanceTo(to)*0.05);
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    cam.position.lerpVectors(from,to,e);
    ctl.target.lerpVectors(fromT,cible,e);
    ctl.update();
    if(k<1)requestAnimationFrame(step);
  })(performance.now());
}
/* ---- vitrine : vue en enfilade, orbite lente, aucune interaction ---- */
function cadrerVitrine(){
  ctl.enabled=false;
  const zRecent=zPlane(D.runs.length-1), zAncien=zPlane(0);
  ctl.target.set(-260,340,zRecent+(zAncien-zRecent)*0.44);
  majVitrine();
}
function majVitrine(){

// Profondeur lisible : le decor n'appartient qu'a la livraison regardee ; les
// autres ne montrent que leurs findings, attenues avec l'eloignement.
function majProfondeur(){
  if(typeof plans==='undefined' || !plans.length) return;
  const multi = (D && (D.runs||[]).length>1 && D.mode==='publish');
  plans.forEach(pl=>{
    const actif = (pl.ri===active);
    (pl.decor||[]).forEach(o=>{ o.visible = actif || !multi; });
    (pl.etiquettes||[]).forEach(el=>{ el.style.display = (actif || !multi) ? '' : 'none'; });
    // le cercle de la couche reste, attenue : c'est lui qui donne l'epaisseur du temps
    if(pl.limite){ pl.limite.visible = true;
      pl.limite.material.opacity = actif ? 0.62 : 0.16; }
    if(pl.dateEl){ pl.dateEl.style.display = multi ? '' : 'none';
      pl.dateEl.classList.toggle('active', actif); }
  });
  if(typeof etoiles==='undefined') return;
  etoiles.forEach(m=>{
    const u=m.userData||{}; if(u.ri==null && !(u.d)) return;
    const ri = (u.ri!=null) ? u.ri : (u.d && u.d.run) || 0;
    const actif = (ri===active);
    const loin = Math.abs(ri-active);
    const att = (!multi||actif) ? 1 : Math.max(0.42, 0.62 - 0.08*loin);
    if(m.material && m.material.opacity!=null){ m.material.transparent=true; m.material.opacity=att; }
    if(u.halo && u.halo.material) u.halo.material.opacity = 0.55*att;
    // etiquettes d'axe et de finding : seulement la livraison regardee
    if(u.lb){
      const vis = (actif||!multi);
      // MOBILE-2026 : CSS2DRenderer reecrit `display` a chaque frame d'apres `object.visible`.
      // Le masquage DOM ci-dessous etait donc annule image par image. On agit sur l'objet 2D.
      // Cible : ecran etroit seulement — le bureau a la place d'afficher les couches voisines.
      if(ETROIT()) m.children.forEach(ch=>{ if(ch.isCSS2DObject) ch.visible = vis; });
      u.lb.style.display = vis ? '' : 'none';
    }
  });
}

// ---- Persistance LOCALE (usage hors serveur wizard) ----
// Auto-migration des notes : si la clef courante est vide (ex. la date du run
// a derive dans les donnees), on adopte le jeu de notes le plus fourni d'une
// ancienne clef du meme watch. Rend la persistance robuste aux changements de clef.
function migrerLegacy(prefixe, cle){
  try{
    if(localStorage.getItem(cle))return;
    var best=null,bestN=0;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k===cle||k.indexOf(prefixe)!==0)continue;
      var n=0; try{n=Object.keys(JSON.parse(localStorage.getItem(k)||'{}')).length;}catch(e){}
      if(n>bestN){bestN=n;best=k;}
    }
    if(best)localStorage.setItem(cle,localStorage.getItem(best));
  }catch(e){}
}
