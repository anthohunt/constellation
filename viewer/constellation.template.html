  function positionTooltip(target, hint){
    // MOBILE-2026 : ecran etroit -> FEUILLE pleine largeur ancree en bas, ou en haut quand la
    // cible occupe la moitie basse. L'ancrage a la cible ne tient pas dans 390px : le carton
    // et son bouton « Suivant » finissaient hors ecran, et le parcours devenait infranchissable.
    if(window.innerWidth<=700 || (window.innerHeight<=500 && window.innerWidth>window.innerHeight)){
      const rr = (target && target.getBoundingClientRect) ? target.getBoundingClientRect() : null;
      const enHaut = !!(rr && rr.height>2 && (rr.top + rr.height/2) > window.innerHeight*0.52);
      tooltip.style.top=''; tooltip.style.left=''; tooltip.style.width='';
      tooltip.classList.toggle('wt-haut', enHaut);
      tooltip.setAttribute('data-arrow','feuille');
      return;
    }
    // 'bottom-fixed' ancre en bas MEME sans cible : une etape qui allume la
    // constellation ne doit pas masquer ce qu'elle montre avec sa propre bulle.
    if(!target && hint==='bottom-fixed'){
      const vw=window.innerWidth, vh=window.innerHeight;
      const tw=Math.min(340,vw-16), th=tooltip.offsetHeight||200;
      tooltip.style.top = Math.max(60, vh-118-th-8)+'px';
      tooltip.style.left = Math.max(8, Math.min(vw-tw-8, vw/2-tw/2))+'px';
      tooltip.style.width = tw+'px';
      tooltip.setAttribute('data-arrow','fixed');
      return;
    }
    if(!target||hint==='center'){
      tooltip.setAttribute('data-arrow','center');
      tooltip.style.top=''; tooltip.style.left='';
      tooltip.style.setProperty('--arrow-x', 24);
      return;
    }
    const r = target.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    // If target covers >60% of viewport (like the whole canvas #gl), positioning "below/above" it
    // pushes the tooltip out of screen. Force a fixed anchor at the bottom-center of the viewport,
    // clear of the bottom nav (~72px reserved).
    const bigTarget = (r.width > vw*0.6 && r.height > vh*0.6) || hint === 'bottom-fixed';
    const tw = Math.min(340, vw - 16), th = tooltip.offsetHeight || 200;
    const M = 12;
    let top, left, arrow;
    const bottomReserved = 118; // barre du bas : « Ma vue d'ensemble », livraisons
    const topReserved = 60;    // header

    if(bigTarget){
      // Anchor at bottom-center, above the nav bar (never off-screen).
      // Use arrow='fixed' (not 'center') to avoid CSS's translate(-50%,-50%) auto-center rule.
      top = Math.max(topReserved, vh - bottomReserved - th - 8);
      left = Math.max(8, Math.min(vw-tw-8, vw/2 - tw/2));
      arrow = 'fixed';
    }else{
      const spaceBelow = vh - bottomReserved - r.bottom;
      const spaceAbove = r.top - topReserved;
      const canBelow = spaceBelow > th + M + 20;
      const canAbove = spaceAbove > th + M + 20;

      if(hint==='below' || (hint==='best' && canBelow)){
        top = r.bottom + M + 8; arrow='up';
        left = Math.max(8, Math.min(vw-tw-8, r.left + r.width/2 - tw/2));
      }else if(hint==='above' || (hint==='best' && canAbove)){
        top = r.top - th - M - 8; arrow='down';
        left = Math.max(8, Math.min(vw-tw-8, r.left + r.width/2 - tw/2));
      }else if(hint==='below-left'){
        top = r.bottom + M + 8; arrow='up';
        left = Math.max(8, r.right - tw);
      }else if(hint==='right'){
        top = Math.max(topReserved, r.top); left = r.right + M; arrow='left';
      }else if(hint==='left'){
        top = Math.max(topReserved, r.top); left = r.left - tw - M; arrow='right';
      }else{
        // Fallback: force above the bottom nav
        top = vh - bottomReserved - th - 8;
        left = Math.max(8, Math.min(vw-tw-8, vw/2 - tw/2));
        arrow = 'center';
      }

      top = Math.max(topReserved, Math.min(vh - bottomReserved - th - 8, top));

    // la bulle ne sort jamais de l'ecran...
    left = Math.max(8, Math.min(left, vw - tw - 8));

    // elle bascule du cote oppose.
    if(target && target.getBoundingClientRect){
      const z = target.getBoundingClientRect();
      const chevauche = !(left+tw < z.left-6 || left > z.right+6 || top+th < z.top-6 || top > z.bottom+6);
      if(chevauche){
        const dessous = vh - z.bottom, dessus = z.top;
        const droite = vw - z.right, gauche = z.left;
        const best = Math.max(dessous, dessus, droite, gauche);
        if(best === dessous && dessous > th + 16)      top = Math.min(vh - th - 8, z.bottom + 12);
        else if(best === dessus && dessus > th + 16)   top = Math.max(8, z.top - th - 12);
        else if(best === droite && droite > tw + 16)   left = Math.min(vw - tw - 8, z.right + 12);
        else if(gauche > tw + 16)                      left = Math.max(8, z.left - tw - 12);
      }
    }
    tooltip.style.top = top+'px';
    tooltip.style.left = left+'px';
    tooltip.style.width = tw+'px';
    tooltip.setAttribute('data-arrow', arrow);
    if(arrow!=='center'){
      const arrowX = Math.max(16, Math.min(tw-24, r.left + r.width/2 - left));

    }
  }
  function voile(perce){ if(scrim) scrim.classList.toggle('perce', !!perce && !!currentStep); }
  // Les etapes qui parlent de la constellation dessinent la VRAIE forme dont elles parlent.

  window.__wtRelire = ()=>{ setTimeout(()=>{ if(currentStep) renderStep(); }, 260); };
  function renderStep(){
    const steps = STEPS();
    const s = steps[idx];

    if(s.skipOnMobile && window.matchMedia('(max-width:768px)').matches){
      idx++; renderStep(); return;
    }
    currentStep = s;
    // cleanup previous listeners
    cleanupFns.forEach(fn=>fn()); cleanupFns=[];
    // avant « ouvre un signal », on explique : rien n'est cliquable. Apres, seule la
    // zone montree l'est — le voile bloque tout le reste.
    const AGIR = steps.findIndex(x=>x.key==='star');
    // une etape est interactive des qu'elle attend un geste, et toujours a partir
    // de « ouvre un signal »
    const interactif = !!s.wait || !!s.interactif || (AGIR >= 0 && idx >= AGIR);
    if(scrim) scrim.classList.toggle('passe', interactif);
    if(masque) masque.classList.toggle('interactif', interactif);
    // chaque etape rallume ce qu'elle explique, et rien d'autre
    tutoEteindre();
    if(s.enter){ try{ s.enter(); }catch(e){} }
    // une cible dans la carte peut etre plus bas que l'ecran : on l'amene en vue
    // AVANT de percer le voile, sinon le trou se dessine dans le vide.
    const interne = /^tuto-(carte|tiers|retours|menu)$/.test(s.target||'');
    const dessiner = ()=>{
      const t = findTarget(s.target);
      if(!dessinerTrou(trouDeLEtape(s))) positionSpotlight(t);
      else spotlight.style.display='none';
      positionTooltip(t, s.position);
    };

      const t0 = findTarget(s.target);
      if(t0 && t0.scrollIntoView) t0.scrollIntoView({block:'center', behavior:'smooth'});
      else if(t0){ const r=t0.getBoundingClientRect(); const pn=document.getElementById('panel');
        if(pn && r.bottom>innerHeight) pn.scrollBy({top:r.bottom-innerHeight+80, behavior:'smooth'}); }
      setTimeout(dessiner, 420);
    }
    const target = findTarget(s.target);
    if(!dessinerTrou(trouDeLEtape(s))) positionSpotlight(target);
    else spotlight.style.display='none';
    // Tooltip content
    const isFirst = idx===0, isLast = idx===steps.length-1;
    const hasWait = !!s.wait;
    tooltip.innerHTML =
      '<div class="wt-sub">'+t('step')+' '+(idx+1)+' / '+steps.length+'</div>'+
      '<div class="wt-h">'+t(s.key+'_t')+'</div>'+
      '<div class="wt-body">'+t(s.key+'_b')+'</div>'+
      (hasWait && T[isEn()?'en':'fr'][s.key+'_hint'] ? '<div class="wt-hint">'+t(s.key+'_hint')+'</div>' : '')+
      '<div class="wt-dots">'+steps.map((_,i)=>'<div class="wt-dot'+(i===idx?' on':'')+'"></div>').join('')+'</div>'+
      '<div class="wt-actions">'+
        '<button class="wt-skip" type="button">'+t('skip')+'</button>'+
        (isFirst?'':'<button class="wt-prev" type="button">'+t('prev')+'</button>')+
        // Next is always clickable (never locked). Actions are optional advance triggers.
        '<button class="wt-next" type="button">'+

    tooltip.querySelector('.wt-skip').addEventListener('click', finish);
    const prevBtn = tooltip.querySelector('.wt-prev');

    const nextBtn = tooltip.querySelector('.wt-next');
    if(!hasWait){
      nextBtn.addEventListener('click', ()=>{
        if(isLast){finish();return;}
        idx++;renderStep();
      });
    }else{
      nextBtn.addEventListener('click', ()=>{

        if(isLast){finish();return;}
        idx++;renderStep();
      });
    }

    if(hasWait){
      const onEl = s.wait.on ? document.querySelector(s.wait.on) : document;
      if(!onEl) return;
      let startX, startY, moved=false;
      const advance = ()=>{
        const nb = tooltip.querySelector('.wt-next');
        if(nb) nb.classList.remove('wt-locked');
        setTimeout(()=>{
          if(currentStep===s){ idx++; renderStep(); }
        }, 500);
      };
      if(s.wait.event==='clic'){
        const cible = findTarget(s.wait.on);
        // sans cible reelle, ne rien ecouter : ecouter `document` faisait valider
        // l'etape par n'importe quel clic — y compris celui du bouton « Suivant »,
        // qui avancait alors deux fois et sautait l'etape intermediaire.
        if(!cible || !cible.addEventListener) return;
        const el = cible;
        const h = ()=>{ el.removeEventListener('click', h); advance(); };
        el.addEventListener('click', h);
        cleanupFns.push(()=>el.removeEventListener('click', h));
        return;
      }
      if(s.wait.event==='note'){
        // On surveille le signal ouvert, pas l'etoile tiree au sort a l'etape 3 :
        // noter la carte affichee ne debloquait pas l'etape.
        const C = window.__constel;
        const d = (C && C.ouvert && C.ouvert()) || tutoUneEtoile();
        const depart = (C && d) ? C.tier(d) : null;
        const iv = setInterval(()=>{
          if(C && d && C.tier(d) !== depart){ clearInterval(iv); advance(); }
        }, 220);
        cleanupFns.push(()=>clearInterval(iv));
        return;
      }
      if(s.wait.event==='ouvertBilan'){
        const iv = setInterval(()=>{ if(bilanOuvert()){ clearInterval(iv); advance(); } }, 220);
        cleanupFns.push(()=>clearInterval(iv));
        return;
      }
      if(s.wait.event==='vue'){
        const iv = setInterval(()=>{
          if(window.__constel && window.__constel.vue()===s.wait.attendu){
            clearInterval(iv); advance();
          }
        }, 220);
        cleanupFns.push(()=>clearInterval(iv));
        return;
      }
      if(s.wait.event==='pointerdown'){
        const down = (e)=>{startX=e.clientX;startY=e.clientY;moved=false;};
        const move = (e)=>{
          if(startX==null)return;
          if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY) > (s.wait.minMove||10)){
            moved=true;
            onEl.removeEventListener('pointerdown',down);
            onEl.removeEventListener('pointermove',move);
            advance();
          }
        };
        onEl.addEventListener('pointerdown',down);
        onEl.addEventListener('pointermove',move);
        cleanupFns.push(()=>{onEl.removeEventListener('pointerdown',down);onEl.removeEventListener('pointermove',move);});
      }else if(s.wait.event==='wheel'){
        const h = ()=>{onEl.removeEventListener('wheel',h);advance();};
        onEl.addEventListener('wheel',h,{passive:true});
        cleanupFns.push(()=>onEl.removeEventListener('wheel',h));
      }else if(s.wait.event==='panelopen'){
        // observe #panel classlist for .on class
        const panel = document.getElementById('panel');
        if(!panel){advance();return;}
        const obs = new MutationObserver(()=>{
          if(panel.classList.contains('on')){obs.disconnect();advance();}
        });
        obs.observe(panel,{attributes:true,attributeFilter:['class']});
        cleanupFns.push(()=>obs.disconnect());
      }
    }
  }

  function finish(){
    currentStep = null;                       // sinon la boucle continue de percer
    window.__wtEnCours = false;
    clearInterval(suiviTrou); suiviTrou = 0;
    tutoEteindre();
    tutoEtoile = null;
    cleanupFns.forEach(fn=>fn()); cleanupFns=[];
    scrim?.classList.remove('perce'); scrim?.classList.remove('passe');
    masque?.remove(); masque = null; trou = null; halo = null;
    scrim?.remove(); spotlight?.remove(); tooltip?.remove();
    scrim = spotlight = tooltip = null;
    // on rend la navigation dans l'etat ou on l'a prise
    if(ouvertParLeTuto){
      ouvertParLeTuto = false;
      const b = document.getElementById('pclose');
      if(b) b.click();
    }
    localStorage.setItem(WT_SEEN_KEY,'1');
    document.removeEventListener('keydown', onKey);
    // On ne laisse JAMAIS le lecteur sur la constellation d'exemple :
    // en cadre, on demande au parent de le refermer ; en pleine page, on revient d'ou on vient.
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage('tuto-fini','*');
      }else{
        const retour = new URLSearchParams(location.search).get('retour');
        if(retour && retour.startsWith('/')) location.href = retour;
      }
    }catch(e){}
  }

  function onKey(e){
    if(e.key==='Escape') finish();
    if(e.key==='ArrowRight'||e.key==='Enter'){
      const nb = tooltip?.querySelector('.wt-next');
      if(nb) nb.click();
    }
    if(e.key==='ArrowLeft'){
      const pb = tooltip?.querySelector('.wt-prev');
      if(pb) pb.click();
    }
  }

  const WT_SEEN_KEY = 'constel-walkthrough-v2-seen'; // gitleaks:allow (nom de cle localStorage, pas un secret)
  function startWalkthrough(){
    if(localStorage.getItem(WT_SEEN_KEY))return;
    let tries=0;
    const iv = setInterval(()=>{
      const pret = document.querySelectorAll('.lb').length > 5;
      const su   = !!(window.__constel && window.__constel.watch);   // on sait ou on est
      if(!(pret && su) && ++tries <= 40) return;
      clearInterval(iv);
      if(!pret) return;
      // Sur une vraie veille, le parcours n'apprend pas a noter TES signaux :
      // il ouvre la constellation d'exemple, ou rien n'est enregistre.
      if(su && window.__constel.watch() === 'tutoriel') buildOverlay();
      else ouvrirDemo();
    }, 250);
  }
  function forceStartWalkthrough(){
    if(window.__wtEnCours) return;        // un parcours tourne : ne pas le reinitialiser
    localStorage.removeItem(WT_SEEN_KEY);
    // if already running, remove overlays
    document.getElementById('wt-scrim')?.remove();
    document.getElementById('wt-spotlight')?.remove();
    document.getElementById('wt-tooltip')?.remove();
    document.getElementById('wt-masque')?.remove(); masque=null;
    let tries=0;
    const iv = setInterval(()=>{
      const ready = document.querySelectorAll('.lb').length > 5;
      if(ready || ++tries>40){clearInterval(iv); if(ready) buildOverlay();}
    }, 100);
  }
  // page de demonstration ouverte avec ?tuto=1 : on demarre sans rien demander
  (function auto(){
    if(!/[?&]tuto=1/.test(location.search)) return;
    // on insiste tant que la bulle n'est pas la : le premier essai peut tomber
    // pendant que la scene se construit, ou croiser un parcours qui vient de se fermer.
    const iv = setInterval(()=>{
      if(document.getElementById('wt-tooltip')){ clearInterval(iv); return; }
      if(document.querySelectorAll('.lb').length > 3) forceStartWalkthrough();
    }, 400);
    setTimeout(()=>clearInterval(iv), 20000);
  })();

  function buildOverlay(){
    // verrou : deux demarrages peuvent courir en parallele (auto + demo, bouton « ? »).
    if(window.__wtEnCours || document.getElementById('wt-tooltip')) return;
    window.__wtEnCours = true;
    scrim = document.createElement('div');
    scrim.id='wt-scrim';
    document.body.appendChild(scrim);
    spotlight = document.createElement('div');
    spotlight.id='wt-spotlight';
    document.body.appendChild(spotlight);
    tooltip = document.createElement('div');
    tooltip.id='wt-tooltip';
    document.body.appendChild(tooltip);
    idx=0;
    renderStep();
    // le cadre d'une etoile suit son mouvement (la sphere tourne en continu)
    clearInterval(suiviTrou);
    suiviTrou = setInterval(()=>{
      if(currentStep && /^tuto-/.test(currentStep.target||'')){
        dessinerTrou(trouDeLEtape(currentStep));
      }
    }, 120);
    // reposition on resize
    window.addEventListener('resize', ()=>{
      if(currentStep){
        const target = findTarget(currentStep.target);
        positionSpotlight(target);
        positionTooltip(target, currentStep.position);
      }
    });
    // key handling
    document.addEventListener('keydown', onKey);
  }

  // Kill any pre-existing tutorial from the older static-modal patch
  function killLegacyTuto(){
    const legacy = document.getElementById('tuto-scrim');
    if(legacy) legacy.remove();
  }

  const EST_DEMO = ()=> !!(window.__constel && window.__constel.watch && window.__constel.watch()==='tutoriel');
  const URL_DEMO = '/c/tutoriel/?tuto=1&retour=' + encodeURIComponent(location.pathname);

  // Sur une vraie veille, le tuto ne se joue pas sur tes donnees : il ouvre une
  // constellation d'exemple, ou noter n'a aucune consequence.
  // Une page annexe (profil, aide...) s'ouvre PAR-DESSUS l'evaluation : quitter la
  // constellation ferait perdre la notation en cours, et le retour arriere n'est pas
  // garanti selon la facon dont on est arrive ici.
  function ouvrirParDessus(url, titre){
    if(document.getElementById('sur-wrap')) return;
    const wrap = document.createElement('div');
    wrap.id = 'sur-wrap'; wrap.className = 'demo-wrap-like';
    wrap.innerHTML = '<div class="demo-bar"><span class="demo-t">' + titre + '</span>'
      + '<button type="button" id="sur-close">' + (isEn() ? "\u2715 Close" : "\u2715 Fermer") + '</button></div>'
      + '<iframe src="' + url + '" title="' + titre + '"></iframe>';
    document.body.appendChild(wrap);
    const fermer = ()=>{ wrap.remove(); document.removeEventListener('keydown', esc); };
    const esc = e=>{ if(e.key==='Escape') fermer(); };
    document.getElementById('sur-close').onclick = fermer;
    document.addEventListener('keydown', esc);
  }

  function ouvrirDemo(){
    if(document.getElementById('demo-wrap')) return;
    const wrap = document.createElement('div');
    wrap.id = 'demo-wrap';
    wrap.innerHTML = '<div class="demo-bar">'
      + '<span class="demo-t">' + (isEn() ? "Example constellation \u2014 nothing you do here is saved" : "Constellation d'exemple \u2014 rien de ce que tu fais ici n'est enregistr\u00e9") + '</span>'
      + '<button type="button" id="demo-close">' + (isEn() ? "\u2715 Close" : "\u2715 Fermer") + '</button></div>'
      + '<iframe src="' + URL_DEMO + '" title="Tutoriel"></iframe>';
    document.body.appendChild(wrap);
    const fermer = ()=>{ wrap.remove(); window.removeEventListener('message', surMessage); };
    document.getElementById('demo-close').onclick = fermer;
    function surMessage(e){
      if(!e) return;
      if(e.data === 'tuto-fini') return fermer();
      if(e.data && e.data.type === 'langue'){
        const t = wrap.querySelector('.demo-t'), b = wrap.querySelector('#demo-close');
        if(t) t.textContent = e.data.en ? "Example constellation \u2014 nothing you do here is saved" : "Constellation d'exemple \u2014 rien de ce que tu fais ici n'est enregistr\u00e9";
        if(b) b.textContent = e.data.en ? "\u2715 Close" : "\u2715 Fermer";
      }
    }
    window.addEventListener('message', surMessage);
    const esc = e=>{ if(e.key==='Escape'){ wrap.remove(); document.removeEventListener('keydown', esc); } };
    document.addEventListener('keydown', esc);
  }

  function buildHelpButton(){
    if(document.getElementById('help-btn-wt'))return;
    const btn = document.createElement('button');
    btn.id='help-btn-wt';
    btn.type='button';
    btn.setAttribute('aria-label', isEn() ? 'Replay walkthrough' : 'Rejouer le tutoriel');
    btn.title = isEn() ? 'Replay walkthrough' : 'Rejouer le tutoriel';
    btn.innerHTML='?';
    Object.assign(btn.style, {
      position:'fixed', top:'12px', right:'116px', zIndex:'35',
      width:'32px', height:'32px', minHeight:'32px', minWidth:'32px',
      padding:'0', boxSizing:'border-box',
      background:'rgba(19,31,54,.85)', color:'#eaf0fb',
      border:'1px solid #33456a', borderRadius:'50%',
      font:'700 16px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
      cursor:'pointer', userSelect:'none',
      backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)',
      boxShadow:'0 4px 12px rgba(0,0,0,.3)', transition:'background .15s, border-color .15s'
    });
    btn.addEventListener('mouseenter',()=>btn.style.background='rgba(45,60,90,.95)');
    btn.addEventListener('mouseleave',()=>btn.style.background='rgba(19,31,54,.85)');
    btn.addEventListener('click', ()=>{ if(EST_DEMO()) forceStartWalkthrough(); else ouvrirDemo(); });
    document.body.appendChild(btn);
  }

  // Boot after i18n patch has settled
  function boot(){
    killLegacyTuto();
    // Clear old-tuto key so users who saw the modal get the walkthrough exactly once
    // (walkthrough uses its own key WT_SEEN_KEY, independent of the old modal key)
    // Build help button so users can always replay
    setTimeout(buildHelpButton, 800);
    // « Mon profil » : fenetre par-dessus, jamais une navigation
    document.querySelectorAll('a.hdr-profil').forEach(a=>{
      a.addEventListener('click', e=>{
        e.preventDefault();
        ouvrirParDessus(a.getAttribute('href'), isEn() ? 'My profile' : 'Mon profil');
      });
    });
    // Delay a bit so the constellation has time to render
    setTimeout(startWalkthrough, 1200);
  }
  if(document.readyState==='complete' || document.readyState==='interactive'){
    setTimeout(boot, 300);
  }else{
    document.addEventListener('DOMContentLoaded', boot);
  }

  // Public reset (for testing)
  // relancer le parcours ne recharge PAS la page : un reload en plein parcours
  // renvoyait le lecteur a l'etape 1 sans explication.
  window.__restartWalkthrough = ()=>{ localStorage.removeItem('constel-tuto-seen');
    window.__wtEnCours = false; forceStartWalkthrough(); };
})();
</script>

<script>
(function initQoL(){
  // ---------- Escape fully closes the open card (skip hierarchical back-nav) ----------
  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Escape') return;
    if(document.getElementById('wt-scrim')) return;
    const panel = document.getElementById('panel');
    if(!panel || !panel.classList.contains('on')) return;
    panel.classList.remove('on');
  }, true);
  // ---------- Click-outside also closes ----------
  document.addEventListener('click', (e)=>{
    const panel = document.getElementById('panel');
    if(!panel || !panel.classList.contains('on')) return;
    // Robust "click originated inside the panel" test.
    // composedPath() is captured at dispatch time, so it still contains the panel
    // even when an in-panel handler (tier picker, finding link…) re-rendered #pbody
    // and thereby DETACHED e.target — in which case panel.contains(e.target) wrongly
    // returns false and used to close the panel. That was the "clicking a tier closes
    // the view" bug.
    const path = (typeof e.composedPath === 'function') ? e.composedPath() : [];
    if(path.indexOf(panel) !== -1 || panel.contains(e.target)) return;
    // A target detached by an in-panel re-render is never a real outside click.
    if(e.target && e.target.isConnected === false) return;
    // ignore clicks on the sphere itself (they may open a new card)
    if(e.target.closest && e.target.closest('#gl, canvas, .lb, #nav, #lang-toggle, #help-btn-wt, #wt-scrim, #wt-masque, #wt-tooltip, .resizer')) return;   // .resizer : la fin d'un drag de redimensionnement emet un click, qui fermait le panneau qu'on etait en train d'elargir
    panel.classList.remove('on');
  });

  // ---------- MOBILE-2026 : poignee de la feuille (replier / deplier) ----------
  // Sur telephone la fiche couvre tout l'ecran : on ne voit plus la constellation, donc plus
  // l'effet d'une note. La poignee la REPLIE le temps d'un coup d'oeil, sans la fermer.
  (function poigneeFeuille(){
    const pn = document.getElementById('panel'); if(!pn) return;
    if(document.getElementById('pgrab')) return;
    const h = document.createElement('button');
    h.type='button'; h.id='pgrab'; h.className='pgrab';
    h.setAttribute('aria-label','Replier ou déplier la fiche');
    h.addEventListener('click', ()=>pn.classList.toggle('replie'));
    pn.insertBefore(h, pn.firstChild);
    // une fiche fermee se rouvre toujours depliee
    pn.addEventListener('transitionend', ()=>{ if(!pn.classList.contains('on')) pn.classList.remove('replie'); });
  })();

  // ---------- Save toast on comment/rating changes ----------
  const toast = document.createElement('div');
  toast.id = 'save-toast';
  document.body.appendChild(toast);
  let toastTimer = null;
  // Défaut = langue réellement active (posée par l'i18n sur <html lang>), sinon FR.
  // Avant, le défaut 'en' affichait le tutoriel en anglais sur une UI FR.
  const isEn = ()=> (localStorage.getItem('constel-lang')||document.documentElement.lang||'fr')==='en';
  function showToast(msgEn, msgFr){
    toast.textContent = isEn() ? msgEn : msgFr;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('on'), 1400);
  }

  // Watch for comment field changes (textarea inside .commentaire or #panel textarea)
  document.addEventListener('input', (e)=>{
    const el = e.target;
    if(el && el.tagName === 'TEXTAREA'){
      // debounce per-textarea
      clearTimeout(el._saveDebounce);
      el._saveDebounce = setTimeout(()=>showToast('Saved', 'Enregistré'), 700);
    }
  });
  // Watch for rating click (buttons inside .avis-lg, .tier-picker, .chips)
  document.addEventListener('click', (e)=>{
    const el = e.target;
    if(!el || el.tagName !== 'BUTTON') return;
    const parent = el.closest('.avis-lg, .avis-wrap, .tier-picker, .chips, .avis, .note-sticky');
    if(parent){
      // MOBILE-2026 : la fiche couvre la constellation, on ne VOIT pas l'etoile changer
      // d'anneau. Le message dit donc explicitement ou elle vient d'atterrir.
      const niv = el.dataset && el.dataset.tier;
      setTimeout(()=>niv
        ? showToast('Moved to \u201c'+niv+'\u201d', 'Class\u00e9 \u00ab\u00a0'+niv+'\u00a0\u00bb \u2014 l\u2019\u00e9toile rejoint cet anneau')
        : showToast('Saved', 'Enregistr\u00e9'), 80);
    }
  });

  // ---------- Invalid deep-link toast ----------
  const hashMatch = location.hash.match(/^#fil=(.+)$/);
  if(hashMatch){
    // wait for data to be loaded, then check if the fil exists
    let tries = 0;
    const iv = setInterval(async ()=>{
      try{
        const d = window.__constel && window.__constel.donnees && window.__constel.donnees();
        if(!d){ if(++tries>60) clearInterval(iv); return; }
        clearInterval(iv);
        const id = decodeURIComponent(hashMatch[1]);
        const found = (d.fils||[]).some(f=>f.id===id);
        if(!found){
          setTimeout(()=>{
            showToast('Thread not found — showing all', 'Fil introuvable — vue générale');
            history.replaceState(null, '', location.pathname + location.search);
          }, 900);
        }
      }catch(_){clearInterval(iv);}
    }, 400);
    setTimeout(()=>clearInterval(iv), 6000);
  }
})();
</script>

#bg-aurora .b4{width:38vmax;height:38vmax;top:30vmax;left:26vmax;background:radial-gradient(circle,#d4a15a 0%,transparent 65%);opacity:.22;animation-duration:60s;animation-delay:-24s}
@keyframes auroraDrift{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(6vmax,-4vmax) scale(1.08)}
  50%{transform:translate(-4vmax,4vmax) scale(.95)}

/* Ensure body bg lets the layered ambience through */
body{background:transparent!important}

/* ---------- Frosted glass surfaces ---------- */

header{background:linear-gradient(180deg,rgba(11,18,32,.72),rgba(11,18,32,.34))!important;

/* ---------- Landscape mobile fix (T13 crash-test) ----------
   Portrait 390×844 → nav bottom bar full-width is fine.

  /* My overview: also shrink + top-right so it doesn't fight the nav */
  #exportbtn{bottom:auto!important;top:12px!important;right:170px!important;

@media (prefers-reduced-motion:reduce){
  #bg-aurora .blob,.lb.core{animation:none!important}
}

<script>
(function initVisual(){
  // Load Fraunces from Google Fonts (self-hosted preferred but this is quick)
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap';
  document.head.appendChild(link);

  // ---------- A11y improvements ----------
  // 1) Skip link (first focusable, jumps past chrome to the constellation)
  const skip = document.createElement('a');
  skip.id = 'skip-to-main';
  skip.href = '#gl';
  skip.textContent = 'Aller à la constellation';
  document.body.prepend(skip);

  // 2) Wrap the main canvas + labels in a <main role="main"> landmark
  const gl = document.getElementById('gl');
  const lab = document.getElementById('lab');
  const bgStars = document.getElementById('bg-stars');
  if(gl){
    gl.setAttribute('role','img');
    gl.setAttribute('tabindex','0');
    gl.setAttribute('aria-label','Interactive constellation of findings. Use the My overview button, the language toggle, or the help button to navigate.');
    // Wrap gl + lab + bg-stars + aurora in a <main> landmark (so nothing sits outside a region)
    if(!document.querySelector('main[role="main"]')){
      const main = document.createElement('main');
      main.setAttribute('role','main');
      main.setAttribute('aria-label', document.documentElement.lang === 'en' ? 'Constellation view' : 'Vue de la constellation');   // isEn() n'existe pas dans cette portee
      gl.parentNode.insertBefore(main, gl);
      main.appendChild(gl);
      if(lab) main.appendChild(lab);
      // Move ambient layers into the same main so axe sees them within a landmark
      const bgS = document.getElementById('bg-stars');
      const bgA = document.getElementById('bg-aurora');
      if(bgS) main.appendChild(bgS);
      if(bgA) main.appendChild(bgA);
    }
    if(bgStars){
      bgStars.setAttribute('aria-hidden','true');
      bgStars.setAttribute('role','presentation');
    }
  }
  // Wrap the delivery-selector bar (#nav) in a <nav aria-label="Livraisons">
  const nav = document.getElementById('nav');
  if(nav && !nav.closest('nav')){
    nav.setAttribute('role','navigation');
    nav.setAttribute('aria-label','Deliveries');
  }
  // Aurora is decorative
  const aur = document.getElementById('bg-aurora');
  if(aur){aur.setAttribute('aria-hidden','true'); aur.setAttribute('role','presentation');}
  // 3) Remove hidden buttons from tab order (they capture Tab needlessly)
  const stopTabbing = (id)=>{
    const el = document.getElementById(id);
    if(el && el.hasAttribute('hidden')) el.setAttribute('tabindex','-1');
  };
  // Watch for hidden buttons appearing/disappearing
  const observeHiddenTab = ()=>{
    ['reessayer','pclose'].forEach(stopTabbing);
    // The panel close button pclose is only meaningful when panel is open
    const panel = document.getElementById('panel');
    const pclose = document.getElementById('pclose');
    if(panel && pclose){
      pclose.setAttribute('tabindex', panel.classList.contains('on') ? '0' : '-1');
    }
  };
  observeHiddenTab();
  const mo = new MutationObserver(observeHiddenTab);
  const panelEl = document.getElementById('panel');
  if(panelEl) mo.observe(panelEl, {attributes:true, attributeFilter:['class','hidden']});
  const reessayer = document.getElementById('reessayer');
  if(reessayer && reessayer.parentElement) mo.observe(reessayer.parentElement, {attributes:true, subtree:true});

  // Inject the aurora layer — into <main> if it exists, so it stays inside a landmark
  const aurora = document.createElement('div');
  aurora.id = 'bg-aurora';
  aurora.setAttribute('aria-hidden','true');
  aurora.setAttribute('role','presentation');
  aurora.innerHTML = '<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>';
  const mainEl = document.querySelector('main[role="main"]');
  if(mainEl) mainEl.prepend(aurora); else document.body.prepend(aurora);

  // Inject the starfield canvas — into <main> if it exists
  const c = document.createElement('canvas');
  c.id = 'bg-stars';
  c.setAttribute('aria-hidden','true');
  c.setAttribute('role','presentation');
  if(mainEl) mainEl.prepend(c); else document.body.prepend(c);
  const ctx = c.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * DPR; c.height = H * DPR;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // Generate stars — 3 layers with different parallax + twinkle
  const N = window.innerWidth < 600 ? 1400 : 2600;
  const stars = [];
  for(let i=0;i<N;i++){
    const depth = Math.random(); // 0 (far, tiny) → 1 (near, larger)
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      z: 0.3 + depth*0.7,
      r: 0.35 + depth*1.5,
      base: 0.35 + depth*0.5,
      hue: 210 + Math.random()*40, // cool blue tones
      phase: Math.random()*Math.PI*2,
      speed: 0.4 + Math.random()*1.2
    });
  }
  const reducedMotion = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 0, running = true, animating = false, scheduled = false;
  // STARFIELD-2026 : rendu d'UNE frame (identique à l'ancien corps de boucle).
  function drawFrame(){
    ctx.clearRect(0, 0, W, H);
    return;/*STARS-OFF*/
    // Very subtle drift on some layers to hint at parallax
    for(const s of stars){
      const twinkle = reducedMotion ? 1 : 0.6 + 0.4*Math.sin(t*s.speed + s.phase);
      const a = s.base * twinkle;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${s.hue|0}, 55%, 92%, ${a.toFixed(3)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
      // Occasional larger glow for near stars
      if(s.r > 1.2 && twinkle > 0.85){
        ctx.beginPath();
        ctx.fillStyle = `hsla(${s.hue|0}, 55%, 90%, ${(a*0.15).toFixed(3)})`;
        ctx.arc(s.x, s.y, s.r*3.5, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
  function loop(){
    scheduled = false;
    if(!running || !animating) return;
    t += 0.008;
    drawFrame();
    scheduled = true;
    requestAnimationFrame(loop);
  }
  // PERF-BOOT-2026 : le starfield est un fond 2D (2600 arcs/frame) dont la boucle RAF,
  // lancée AVANT le module constellation, volait des frames pendant tout le boot (freeze
  // ressenti « 1000 ans »). On dessine UNE frame statique immédiate (étoiles visibles tout
  // de suite, aucun changement visuel), puis on ne démarre l'animation (twinkle) qu'APRÈS
  // le 1er rendu de la constellation (event 'constel-pret'), avec fallback de sécurité.
  drawFrame();                         // étoiles présentes dès le départ (statique)
  function startAnim(){
    if(animating || !running) return;
    animating = true;
    if(reducedMotion){ drawFrame(); return; }   // pas de boucle si mouvement réduit
    if(!scheduled){ scheduled = true; requestAnimationFrame(loop); }
  }
  window.addEventListener('constel-pret', startAnim, {once:true});
  // Fallback : si la constellation n'émet jamais le signal (erreur data…), on anime quand même.
  (window.requestIdleCallback||function(f){setTimeout(f,1600);})(()=>setTimeout(startAnim,0),{timeout:1800});
  // Pause when tab hidden (save battery)
  document.addEventListener('visibilitychange', ()=>{
    running = !document.hidden;
    if(running && animating && !scheduled){ scheduled = true; requestAnimationFrame(loop); }
  });

  // Ensure the WebGL sphere renders on TOP of ambient bg (its canvas is fine, we just make bg transparent-safe)
  // The WebGL renderer sets its own background — but our #bg-stars sits BELOW it. On the eval version, the
  // Three.js scene background is dark → will hide our stars. We fix that by giving the WebGL canvas a
  // transparent-if-possible fallback: not always feasible, but a soft-glow behind the sphere still shows via the aurora.
})();
</script>
